# Denominator removals ledger — the ONLY way a coverage denominator may shrink.
#
# ## The contract (docs/ci-test-architecture-v2.md §5.3)
#
# `docs/coverage/denominators.json` is the checked-in denominator of every
# coverage claim: the stdlib API surface, the language construct set, the test
# case/assertion bodies. `xtask denominators` regenerates it.
#
#   * An INCREASE in any denominator is always allowed. The surface grew; the
#     new coverage debt is visible in the next report. Nothing to declare here.
#
#   * A DECREASE fails the gate. This file is how a decrease is authorised.
#
# Why the asymmetry: shrinking the denominator is the cheapest possible way to
# make "100 % covered" true. Delete the module that is not covered, narrow an
# `exposing` list, let a file stop parsing (until this cycle, `sky doc --export`
# would silently drop it and still exit 0) — and the percentage goes UP while
# the product got smaller. Every such move must now be written down by a person,
# with a reason and their name on it.
#
# ## How the ratchet reads this file
#
# `xtask denominators` counts the `[[removal]]` stanzas here and compares that
# count with `removals_accounted` recorded in `denominators.json` when the
# baseline was written. A decrease of N in any single metric requires at least N
# NEWLY ADDED stanzas. Removing three stdlib values means writing three entries.
#
# All four fields are REQUIRED on every stanza; a stanza missing any of them
# fails the gate (otherwise empty stanzas would defeat the ratchet):
#
#   symbol — what left the denominator, fully qualified
#            (`Std.Foo.bar`, or a `SyntaxKind` name, or a test case id)
#   reason — WHY it is gone. "unused" is not a reason; "superseded by
#            Std.Bar.baz, which covers the same surface with a total signature"
#            is. This is the field a reviewer actually reads.
#   owner  — the person accountable for the removal.
#   commit — the commit that removed it, so the claim is checkable.
#
# ## Example (do not uncomment — it is not a real removal)
#
#   [[removal]]
#   symbol = "Std.Example.deprecatedThing"
#   reason = "removed pre-v1; superseded by Std.Example.thing, which is total"
#   owner  = "anzel"
#   commit = "0000000"
#
# ## Current state
#
# One removal, below.

[[removal]]
symbol = "Std.Db.findWhere"
# Accounted 2026-08-12. `xtask denominators` and `coverage-ledger --check` had
# BOTH been failing on `main` since 988de75b (1774 -> 1773 entries, 1653 -> 1652
# values, `removals_accounted` still 0). Only the release workflow runs them, so
# per-push CI stayed green over a red release gate.
reason = "un-exposed from sky-stdlib/Std/Db.sky because it CONCATENATES a caller-supplied WHERE string into SQL. Audit P1-3 had already renamed the safe surface to unsafeFindWhere, which names what it is and is what a caller must reach for deliberately; findWhere was briefly re-exposed to give the kernel member a Sky signature (a coverage number), and removing it again is that security decision standing. rt.Db_findWhere survives in the runtime as an alias so already-compiled sky-out/ trees keep linking, and kernel_signature_coverage.rs keeps its allowlist row, so the member stays visible as an UNTYPED kernel qualifier rather than vanishing from every ledger."
owner  = "anzel"
commit = "988de75b"

[[removal]]
symbol = "Std.Markdown.allChars"
# Accounted 2026-08-12. Two module-private helpers left and one arrived, so the
# unfiltered stdlib denominator fell by exactly 1 (1412 -> 1411 entries,
# 232 -> 231 hidden-by-exposing). Both departures are recorded rather than the
# single stanza the ratchet's arithmetic would accept, because the ledger is
# meant to say what actually left.
reason = "deleted when minimising the coerce-floor cost of the Std.Markdown rewrite. `allChars` tested a predicate over every char of a string by first materialising it through `stringChars`, so each candidate line allocated a List String purely to answer a boolean. Superseded by `restIsAll`, an index scan that lowers to a flat TCO'd loop with no allocation — same answer, 4 fewer runtime-narrowing tokens, and a faster hot path on the line classifier. No caller outside Std.Markdown existed: the symbol was never in the module's exposing list."
owner  = "anzel"
commit = "2771303a"

[[removal]]
symbol = "Std.Markdown.stringChars"
reason = "deleted with its only caller, `allChars` (see above). It existed to turn a String into a List String one grapheme at a time so a predicate could be folded over it; `restIsAll` indexes the string directly instead, so nothing needs the intermediate list. Module-private, never exposed, no remaining reference in sky-stdlib."
owner  = "anzel"
commit = "2771303a"

[[removal]]
symbol = "Std.Ai.Provider.Direct"
# Accounted 2026-10-12. stdlib.unfiltered.types 337 -> 336.
reason = "deleted when the built-in backends (`openai`, `compatible`) became a `Wire` over the internal `backendPost` transport, so `Provider` has one OpenAI-compatible arm instead of a separate `Backend Direct` constructor (one runtime payload narrowing fewer per operation). `Direct` was the `Backend` payload record and was never in the module's exposing list; `Provider` is opaque, so no caller could name it."
owner  = "anzel"
commit = "d5c684718"
#
#
# ===========================================================================
# ## The SECOND ledger: `[[weakening]]` — the only way a SURFACE may get
# ## weaker (docs/ci-test-architecture-v2.md §9.2)
# ===========================================================================
#
# `[[removal]]` above governs the DENOMINATOR — how much surface exists.
# `[[weakening]]` governs the NUMERATOR — how strongly each surface is
# covered. They are different failures and are never counted against each
# other: deleting a module shrinks what must be covered; letting a surface
# fall from "assertions in a proven-falsifiable gate" to "something builds
# it" keeps the surface and quietly stops checking it. Only the first is a
# denominator move, and only the second is a weakening.
#
# `docs/coverage/ledger.json` (generated by `xtask coverage-ledger`) scores
# every surface twice — `cover_today`, what the pre-overhaul corpus provided,
# and `cover_new`, what the Layer 1 + Layer 2 + registered-gate world provides
# — on one ordered scale:
#
#   0 None       nothing covers it
#   1 Builds     something compiles it, nothing runs it
#   2 Runs       something builds AND runs it; verdict = exit status only
#   3 Asserted   explicit counted assertions
#   4 Falsified  assertions in a REGISTERED gate whose falsifying mutation is
#                recorded PROVEN in docs/coverage/falsifier-proofs.json
#
# A surface whose `cover_new` is BELOW its `cover_today` gets the verdict
# `weaker`. That is a coverage removal wearing different clothes, and §9.2's
# rule is the same one that governs deletions: nothing is removed before its
# replacement is proven. `xtask coverage-ledger --check` therefore FAILS on
# any `weaker` surface that has no `[[weakening]]` stanza naming it.
#
# Why this needs its own stanza rather than being folded into `[[removal]]`:
# a weakening is the cheapest way to make the ledger look healthy without
# deleting anything. Retire the run and keep the build, drop a gate's
# assertions to a smoke check, let a falsifier lapse from PROVEN — the
# surface count is unchanged, every denominator is unchanged, and the product
# is checked less. The only defence is that a person writes down which
# surface, why, and under whose name.
#
# All four fields are REQUIRED on every stanza; a stanza missing any of them
# — or carrying a blank value — fails the gate, exactly as with `[[removal]]`,
# because an empty stanza would otherwise buy an unaccounted weakening:
#
#   surface — the surface id from ledger.json, verbatim
#             (`stdlib.Std.Csv`, `cli.doctor`, `db.postgres`, …). It must
#             match a row in the generated ledger; a stanza naming a surface
#             that does not exist protects nothing.
#   reason  — WHY the weaker cover is acceptable, and what replaces it.
#             "covered elsewhere" is not a reason; "the run moved into the
#             apps-relay gate, which asserts the same three responses and has
#             a PROVEN falsifier" is. This is the field a reviewer reads.
#   owner   — the person accountable for the weakening.
#   commit  — the commit that weakened it, so the claim is checkable.
#
# ## Example (do not uncomment — it is not a real weakening)
#
#   [[weakening]]
#   surface = "db.postgres"
#   reason  = "the Postgres arm moved from the nightly sweep to the T3
#              apps-ledger-postgres gate; the gate asserts the same journal
#              ordering but its falsifier is not yet PROVEN, so the class
#              drops 4 -> 3 until the proof lands"
#   owner   = "anzel"
#   commit  = "0000000"
#
# ## Current state
#
# No weakenings. No surface has been allowed to get weaker under this
# contract.
#
#
# ===========================================================================
# ## The THIRD ledger: `[[config-surface-rise]]` — the only way a
# ##                   configuration-surface count may GROW
# ===========================================================================
#
# `docs/coverage/config-surface.json` (`xtask config-surface`) measures the
# configuration surface: how many `sky.toml` keys are read PRE-BINARY, how many
# env suffixes the compiler seeds that nothing reads, and how far the docs and
# the readers have drifted apart. Every one of those counts is a defect count,
# so the ratchet runs the other way from the denominator ledger above:
#
#   * A DECREASE is always allowed. Fewer pre-binary reads means more of the
#     surface can move into typed app config; fewer unread seeds means fewer
#     settings that look set and do nothing. Nothing to declare.
#
#   * An INCREASE fails the gate. This is how an increase is authorised.
#
# The asymmetry has a second edge the other two ledgers do not: the gate cannot
# tell "the surface grew" from "the MEASUREMENT got better", and both raise the
# number. When `config-surface` learned to resolve a key named by a `const`, the
# pre-binary count went 9 -> 12 without a line of product code changing. Both
# readings are important and only a person can say which happened — so the
# stanza records it, pinned to the exact `from` and `to` so one authorisation
# can never quietly cover a later, different rise.
#
# All six fields are REQUIRED; a stanza missing any of them fails the gate.
#
#   metric — the summary key that rose, exactly as `config-surface.json`
#            spells it: `pre_binary_surfaces`, `seeded_without_reader`,
#            `documented_without_reader`, `read_without_doc`.
#   from   — the baseline value. Must match, so the stanza cannot be reused.
#   to     — the new value. Must match, for the same reason.
#   reason — WHY. Say which of the two readings it is. "the scan improved" is
#            not enough; "the scan now resolves a key named by a const, so
#            db_provision.rs's read of [database] postgresVersion is counted
#            for the first time — no new read was added" is.
#   owner  — the person accountable.
#   commit — the commit that raised it, so the claim is checkable.
#
# ## Example (do not uncomment — it is not a real rise)
#
#   [[config-surface-rise]]
#   metric = "pre_binary_surfaces"
#   from   = 12
#   to     = 14
#   reason = "measurement, not surface: STRUCTURAL_PRE_BINARY gained the two
#             inline parsers (db_driver_label, check_auth_secret) that the
#             mechanical scan cannot see because they take no key argument"
#   owner  = "anzel"
#   commit = "0000000"
#
# ## Current state
#
# One authorised rise (below). The `[bundle]` packaging identity moved OUT of
# sky.toml into a `Std.Bundle` `withX` binding read from source, so it is no
# longer a pre-binary config read at all — see rust/crates/sky/src/main.rs
# resolve_bundle_identity / scan_bundle_call.

[[config-surface-rise]]
metric = "documented_without_reader"
from   = 8
to     = 13
reason = """measurement, not surface: the unified-app-builder branch documented \
the CONFIG MODEL, not new runtime settings, so the +5 documented `SKY_*` names \
have no runtime reader BY CONSTRUCTION — none is a real setting a user can set \
and watch do nothing. Breakdown: `SKY_LSP_DEBUG`/`SKY_LSP_TRACE` appear only in \
`docs/tooling/config-architecture.md` (which LISTS the flagged names as its own \
worked example) and in `docs/tooling/lsp.md` (which documents that they were \
REMOVED — `grep … returns nothing`); `SKY_ANALYTICS_DEBUG` and \
`SKY_LIVE_MAX_SUBS_PER_SESSION` are in RFC/design docs (`docs/rfcs/std-analytics.md`, \
`docs/skylive/pubsub-design.md`) as PROPOSED knobs; `SKY_AUTH_COOKIE` \
(`docs/sky-toml.md`) is a user-CONVENTION env var read in the user's own code, \
exactly like the already-accepted `SKY_AUTH_TOKEN_SECRET`. The mechanical scan \
cannot tell a design-doc/RFC/meta reference or a user-convention from a real \
runtime setting."""
owner  = "anzel"
commit = "pending-merge"

[[config-surface-rise]]
metric = "pre_binary_surfaces"
from   = 14
to     = 15
reason = """the new key is `name`: `sky doc --diagram` reads `[project] name` (via \
project::sky_toml_project_key) to TITLE the diagram by the app name rather than a \
machine-local file path (a user request — a diagram is a shared artefact and a \
path leaks a private layout). `name` is an already-accepted, universally-present \
sky.toml key, and this is a READ-ONLY read in the `sky doc` TOOLING path, never \
the app runtime — so it enlarges no runtime residual config surface (the §12 \
risk-1 concern this metric guards). Falls back to the project directory basename, \
then the path, when no name is set."""
owner  = "anzel"
commit = "e4681c1a"

[[config-surface-rise]]
metric = "pre_binary_surfaces"
from   = 15
to     = 16
reason = """the new key is `version`: `sky doc --api openapi` reads `[project] \
version` (via project::sky_toml_project_key, the same reader as the `name` rise \
above) for the generated spec's `info.version`, so the OpenAPI document carries the \
app's real version; falls back to `0.0.0`. `version` is an already-accepted, \
universally-present sky.toml key, and this is a READ-ONLY read in the `sky doc` \
TOOLING path, never the app runtime — so it enlarges no runtime residual config \
surface (the §12 risk-1 concern this metric guards)."""
owner  = "anzel"
commit = "3bf1fa17"

