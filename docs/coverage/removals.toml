[[removal]]
symbol = "syntax::SyntaxKind::ForeignKw"
reason = "v0.27.12: `foreign` was a keyword in the Rust lexer only. docs/language/syntax.md never listed it, and its one rule (a top-level `foreign ...` line, ForeignDecl) was parsed and then dropped by hir with no meaning, a leftover of the retired TypeScript-era compiler. It blocked `foreign` as an ordinary name (`let foreign = ...` failed with `expected a pattern` and a cascade). Nothing in sky-stdlib, examples, tests, apps or templates used the rule. `foreign` is now a plain identifier; parse_tests.rs foreign_is_an_ordinary_name pins it."
owner  = "anzel"
commit = "fix/v0.27.12"

[[removal]]
symbol = "syntax::SyntaxKind::ForeignDecl"
reason = "v0.27.12: the node of the dead `foreign ...` top-level rule removed with ForeignKw (see that stanza). hir, fmt, the LSP and the Sky.Spa splitter ignored or reprinted it verbatim; no construct with a meaning left the language."
owner  = "anzel"
commit = "fix/v0.27.12"

[[removal]]
symbol = "Std.Ai.Train.withGradientCheckpointing"
reason = "v0.28.0 (unreleased, branch-only, never shipped): with SKY_AI_TRAIN_GRAD_CHECKPOINT. The native trainer's chunked loss recomputes each adapted layer in its own backward pass, so the setting changed nothing for Mlx, and Unsloth manages its own checkpointing. No released Sky had it, so no user breaks. ai_train_settings_test.go TestTrainSettingsHaveNoGradientCheckpointing pins that the variable is not read and the trainer is never passed --grad-checkpoint."
owner  = "anzel"
commit = "feat/std-ai-lifecycle"

# ===========================================================================
# ## The FOURTH ledger: `[[correction]]` — a false credit removed
# ===========================================================================
#
# A `[[weakening]]` records coverage that was REMOVED. A `[[correction]]`
# records that the ledger credited a surface with evidence it never had, and
# names the true strength. `xtask coverage-ledger` lets such a surface stand
# below the checked-in ledger at EXACTLY that strength; any other fall still
# fails, and a stanza whose strength no longer matches the recomputed one is
# stale. Fields: surface, strength (a class label), reason, owner, commit.
#
# G-2 (v0.27.0): the `cli-verbs` Layer 2 member was every `.sky` file under
# rust/crates/sky/tests, so the fixtures other flow tests load were credited to
# the `cli-verbs` gate (Falsified), which runs only `cli_verb_flow`. Each
# fixture is now credited to the flow test or e2e script that loads it: counted
# assertions in a release job, not a registered harness gate, so Asserted.

