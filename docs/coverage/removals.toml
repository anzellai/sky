reason = "v0.27.0 (unreleased) terminal redesign: the widget no longer takes raw output bytes. The runtime emulates the terminal on the server (runtime-go/rt/term_screen.go) and Process.screen returns screen-diff frames, so the base64 'output' payload has no consumer. Measured and recorded in docs/perf/runs/terminal-20260928/README.md. Std.Ui.Terminal.encodeExit went with it (the exit line is written into the server screen), and Sky.Core.Process.screen was added, so stdlib.values moves by -1 net. Their conformance and corpus cases were replaced by checks of the element Terminal.view renders; the frames are covered by term_screen_test.go, island_terminal_test.go and process_terminal_test.go."
owner  = "anzel"
commit = "fix/v027-terminal"

