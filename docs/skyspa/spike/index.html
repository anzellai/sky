<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sky.Spa spike</title></head>
<body>
<div id="app"></div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
    .then(r => { window.__spaReady = true; go.run(r.instance); })
    .catch(e => { document.getElementById("app").textContent = "load error: " + e; });
</script>
</body>
</html>
