name: Docs site

# Builds the static docs site (auto-generated API reference from the stdlib
# source) and deploys it to GitHub Pages. Runs whenever the stdlib, the doc
# renderer, or the site build script changes — so the published API tracks the
# compiler with zero hand-maintenance — and on demand.
#
# ONE-TIME SETUP: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'sky-stdlib/**'
      - 'rust/crates/project/src/doc.rs'
      - 'rust/crates/hir/src/**'
      - 'scripts/build-docs-site.sh'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Dominated by `cargo build --release -p sky` (~15-20 min cache-cold, the
    # same release build release.yml's Linux leg does); the doc-site render +
    # Pages upload/deploy add ~3 min ≈ 20 min. 1.5x = 30.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          # Restore the release-profile cache the nightly writes on main.
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Build sky
        working-directory: rust
        run: cargo build --release -p sky --locked
      - name: Build docs site
        # Resolve the binary through cargo rather than assuming
        # `rust/target/release/sky` — see scripts/lib/cargo-target.sh. Benign
        # here today (CI sets no CARGO_TARGET_DIR), but this is the last site
        # that still assumed, and "the safe ones" is not a list anyone should
        # have to keep in their head.
        run: |
          source scripts/lib/cargo-target.sh
          SKY_BIN="$(cargo_bin_path "$PWD/rust" sky --release)" scripts/build-docs-site.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          # v4+ drops dotfiles by default. build-docs-site.sh writes
          # `_site/.nojekyll`, and v3 shipped it, so keep shipping it.
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
