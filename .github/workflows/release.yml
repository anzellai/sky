name: Release

on:
  push:
    tags: ['v*']
  # A dispatched run (`gh workflow run release.yml --ref <branch>`) executes
  # every gate job — the full suite — and skips the publishing jobs, so a merge
  # to main can be held on the same gate as a tag (CLAUDE.md §0.2.1). Open the
  # PR first: `verify-ci-green` needs the per-commit ci-green of the head commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Cross-platform build. Each target is built natively on its own
  # runner (keeps the existing glibc floor + provides Go per-runner for
  # the sky-ffi-inspect asset). Cross-compile is deliberately avoided.
  # ────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries build on Ubuntu 22.04 (glibc 2.35), NOT 24.04 (glibc
          # 2.39), for PORTABILITY: a binary links against the build host's
          # glibc and only runs where glibc is at least that new. A 2.39 binary
          # fails on Debian Bookworm (2.36), Ubuntu 22.04, RHEL 9, and the
          # golang:1.26-bookworm Docker base ("version GLIBC_2.39 not found").
          # 2.35 runs on everything from Bookworm onward.
          # `timeout` is PER LEG: `timeout-minutes` applies to each matrix job
          # separately, and a single number sized for Windows would leave the
          # three Unix legs effectively unbounded. Basis: a cache-cold
          # `cargo build --release -p sky` (the whole crate graph in release) is
          # ~15-20 min on the Linux/macOS runners and ~30 min on Windows, whose
          # filesystem + linker make Rust builds ~2x slower. Values are 1.5x of
          # each leg's own estimate. Erring generous on the release path: a false
          # red here blocks a tag, and these legs run only on `push: tags`.
          - os: ubuntu-22.04
            artifact: sky-linux-x64
            ext: ''
            timeout: 30
          - os: ubuntu-22.04-arm
            artifact: sky-linux-arm64
            ext: ''
            timeout: 30
          - os: macos-latest
            artifact: sky-darwin-arm64
            ext: ''
            timeout: 30
          - os: windows-latest
            artifact: sky-windows-x64
            ext: '.exe'
            timeout: 45

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          # This job's only Go compile is tools/sky-ffi-inspect, whose deps live
          # in tools/sky-ffi-inspect/go.sum. Without this, setup-go looks for a
          # go.sum in the repo root (there is none) and logs "Restore cache
          # failed: Dependencies file is not found ... go.sum" on every leg. Name
          # the file it should hash so the module cache keys and warms correctly.
          cache-dependency-path: tools/sky-ffi-inspect/go.sum

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build sky compiler (cargo)
        shell: bash
        working-directory: rust
        run: |
          # Bake the tag into the binary at compile time (sky build.rs +
          # option_env!("SKY_BUILD_VERSION")). A standalone released binary
          # carries no repo tree, so this is its only version source; the smoke
          # test below fails loudly if it still reports "sky dev".
          export SKY_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --locked -p sky
          mkdir -p ../dist
          # Ask CARGO which file it produced. This is the artefact users
          # download, and a hardcoded target path silently ships an OLDER
          # binary wherever CARGO_TARGET_DIR is set — the `cp` cannot fail,
          # because the stale file genuinely exists. CI sets no such var today,
          # so this site was benign; "benign today" is not a property worth
          # relying on at the one step that reaches users. cargo reports the
          # path with its platform extension, so `matrix.ext` is not needed on
          # the source side.
          source ../scripts/lib/cargo-target.sh
          cp "$(cargo_bin_path "$PWD" sky --release)" "../dist/${{ matrix.artifact }}${{ matrix.ext }}"
          chmod +x "../dist/${{ matrix.artifact }}${{ matrix.ext }}" || true

      - name: Build sky-ffi-inspect (Go)
        shell: bash
        run: |
          # Still shipped for SkyDeploy compatibility even though the Rust `sky`
          # self-provisions the inspector (it `go build`s the embedded source on
          # first use). Keep the asset name so downstream pulls don't break.
          ( cd tools/sky-ffi-inspect && go build -ldflags="-s -w" -o "../../dist/sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}" . )

      - name: Smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL=$("./dist/${{ matrix.artifact }}${{ matrix.ext }}" --version)
          echo "$ACTUAL"
          # ANCHORED comparison, not a substring match. `sky --version` prints
          # exactly one line, `sky v<semver>` (rust/crates/sky/src/main.rs:4416),
          # so the version token is extracted and compared WHOLE.
          #
          # The previous check was `grep -qF "sky v${TAG_VERSION}"`, an unanchored
          # substring. Demonstrated failures it let through:
          #   tag v0.19.1  + binary "sky v0.19.10"    -> passed (wrong release!)
          #   tag v0.19.1  + binary "sky v0.19.1-rc1" -> passed (prerelease!)
          # Both are rejected below. It still catches the case the step was
          # written for: SKY_BUILD_VERSION unset bakes in the "sky dev" fallback,
          # which yields no version token at all.
          REPORTED=$(printf '%s\n' "$ACTUAL" | head -1 | sed -n 's/^sky v\([^ ]*\)$/\1/p')
          if [ -z "$REPORTED" ]; then
            echo "::error::binary did not report a version (got '$ACTUAL'); SKY_BUILD_VERSION was not baked in" >&2
            exit 1
          fi
          if [ "$REPORTED" != "$TAG_VERSION" ]; then
            echo "::error::version mismatch: tag says '$TAG_VERSION', binary says '$REPORTED'" >&2
            exit 1
          fi
          echo "version OK: $REPORTED == $TAG_VERSION"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows-*)
              ARCHIVE="${{ matrix.artifact }}.zip"
              7z a "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
            *)
              # --owner=0 --group=0 --numeric-owner: stamp root:root, not the CI
              # runner's UID/GID, so the installer never has to chown on extract
              # (unprivileged containers can't, and it blocked `sky` installs).
              ARCHIVE="${{ matrix.artifact }}.tar.gz"
              tar --owner=0 --group=0 --numeric-owner -czf "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
          esac
          ls -la
          # Assert the archive actually materialised and is non-empty. Without
          # this, a silent packaging failure reached upload-artifact, which was
          # set to `if-no-files-found: ignore` and uploaded nothing — green.
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::packaging produced no (or empty) $ARCHIVE for ${{ matrix.artifact }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Exactly one of these two exists per matrix leg (.zip on Windows,
          # .tar.gz elsewhere), so `error` fires only when the leg produced
          # NEITHER — which is the real failure. It was `ignore`, under which a
          # leg that built nothing still reported success and the release simply
          # shipped without that platform's asset.
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════════════════
  # THE RELEASE TEST GATE — fanned out into independent jobs that run
  # CONCURRENTLY.
  #
  # Until this gate existed, `release.yml` ran NO test of any kind: a tag cut
  # from a red commit shipped, green. The gate is the `rust gate suite` arm of
  # `scripts/preflight-tag.sh` — the set this repo already treats as the release
  # bar — plus the gate harness, which is the only runner that can report NOT
  # RUN / UNPROVEN instead of silently passing.
  #
  # HISTORY: it began as ONE sequential job (~2 h), then five (gate-core /
  # gate-t2 / gate-app / gate-falsifiers / gate-sweep). Three of those legs were
  # UNSHARDED and each hit or neared the 45-min job timeout on the v0.24.4 run
  # (34749427414): gate-core TIMED OUT at 44m (it ran workspace tests + corpus +
  # `build-run --all` + T1 in one job, with a `go clean -cache` that forced a
  # cold sweep rebuild); gate-falsifiers TIMED OUT at 45m; gate-t2 sat at ~34m.
  #
  # THIS REVISION shards the three tall poles so the wall-clock collapses to the
  # slowest shard, WITHOUT dropping any coverage:
  #   * `build-run --all` (build+run every example) moves OUT of gate-core into a
  #     NEW 3-shard matrix job `gate-buildrun` (the proven rust-ci build-corpus
  #     pattern: `--shard=N/3`, disjoint + total by
  #     `build_run_gate::shards_are_disjoint_and_total`). The `go clean -cache`
  #     step is GONE — it only existed to make room for that in-job sweep.
  #   * the T2 tier splits across `gate-t2-corpus` (the ~10-min `corpus` gate
  #     alone) + `gate-t2-rest` (the four lighter T2 gates).
  #   * the T1 falsifier sweep splits across `gate-falsifiers-1/2/3` by `--only`
  #     gate groups; their union is the whole T1 tier.
  # NOTHING is dropped: every tier T1-T4, the corpus gates, the workspace tests,
  # the falsifier verification, the census, and the FULL clean-slate example
  # sweep each run in EXACTLY ONE of the jobs below. `release: needs:` lists ALL
  # of them, so publication is still blocked until every one is green
  # (CLAUDE.md §0.2.1, INVIOLABLE).
  #
  # Shared setup (Rust + Go toolchains, warm caches, disk reclaim, the
  # scripts/build.sh compiler install) is defined ONCE in the local composite
  # action .github/actions/gate-setup. The composite's actions/cache restore-key
  # falls back to the per-commit `go-linux-` family, so a release inherits the
  # Go build cache that main's rust-ci warmed on the last push instead of
  # starting cold (releases are infrequent, so the release-only `go-release-*`
  # namespace is otherwise always evicted).
  # ════════════════════════════════════════════════════════════════════════

  # gate-core: workspace tests + corpus gates + coerce-floor + the T1 harness
  # (with proofs). The `lsp` T1 gate needs Neovim; the workspace live tests + T1
  # apps need a real PostgreSQL. Sole writer of the shared cargo cache.
  # `build-run --all` used to run here too; it now lives in `gate-buildrun`.
  # ────────────────────────────────────────────────────────────────
  # verify-ci-green — the tagged commit's per-commit `ci-green` must be GREEN.
  # This is a precondition, not a substitute: the release gate below runs the
  # FULL suite itself (CLAUDE.md §0.2.1 — the merge/release gate is the full
  # suite, nothing deferred to nightly). An interim "lean release" (2026-09-13)
  # had disabled the workspace tests, T1, T2 and the falsifier jobs here and
  # trusted ci-green plus the nightly instead; ci-green runs a LIGHT subset of
  # T1 and no T2, so that was the v0.21.0 gap again. Those jobs are re-enabled,
  # and the browser tier, the e2e scripts, the doc examples and `go test -race`
  # — which ran in no release job at all — are wired in.
  # `tests/workflows_parse.rs::the_release_workflow_is_the_full_suite` fails
  # the build if any of it is disabled again or drops out of `release: needs:`.
  # ────────────────────────────────────────────────────────────────
  verify-ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the tagged commit's per-commit ci-green to be SUCCESS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Requiring a green per-commit ci-green for $sha before releasing."
          # Poll up to ~10 min: the per-commit Rust CI for this commit may still
          # be finishing when the tag is pushed moments later.
          for i in $(seq 1 20); do
            concl=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name=="ci-green")] | sort_by(.started_at) | last | .conclusion // "pending"')
            echo "attempt $i: ci-green = $concl"
            case "$concl" in
              success)
                echo "ci-green is SUCCESS for $sha — safe to release."
                exit 0 ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "::error::ci-green is '$concl' for $sha. Refusing to release an unverified commit — fix ci-green on main first." >&2
                exit 1 ;;
              *)
                sleep 30 ;;
            esac
          done
          echo "::error::ci-green did not reach a conclusion for $sha within the wait window. Refusing to release." >&2
          exit 1

  gate-core:
    runs-on: ubuntu-latest
    # Cache-warm: ~5 min compiler install + workspace tests + ~3 min corpus +
    # coerce-floor. `build-run --all` moved to gate-buildrun and the ~14-min T1
    # harness moved to gate-t1, so this job is workspace tests + corpus +
    # coerce-floor only — comfortably inside 30 min.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: core
          postgres: 'true'
          neovim: 'true'
          rust-cache-writer: 'true'

      # Reclaim ~20 GB of preinstalled tooling this gate never uses. coerce-floor
      # EMITS every project and the workspace tests fill the go-build cache;
      # freeing the runner's dotnet/android/ghc trees (not the warm go/rust
      # cache) gives them headroom without slowing anything down. This is the
      # OS-junk reclaim only — the cache-throwing `go clean -cache` that used to
      # sit before the in-job sweep is REMOVED, because the sweep left this job.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Workspace tests
        working-directory: rust
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          SKY_LIVE_TESTS: require
        run: cargo test --workspace --locked

      # Release-built, deliberately. `preflight-tag.sh:70-74` records the
      # measurement: an unoptimised xtask made these ~10x slower, and `reject`
      # alone measured 780 s debug against 74 s release for an IDENTICAL
      # verdict. CI never got that fix; it gets it here.
      - name: Corpus gates
        working-directory: rust
        run: |
          set -euo pipefail
          for g in roundtrip resolve infer reject fuzz repro; do
            echo "── xtask $g ──"
            cargo run --release --locked -q -p xtask -- "$g"
          done
          # coerce-floor: five golden rows are examples whose GENERATED FFI
          # surface (sky-ffi/, .skydeps/) is .gitignored — 03-tea-external,
          # 05-mux-server, 08-notes-app, 11-fyne-stopwatch, 13-skyshop. This gate
          # job does not build that surface, so the rows are unmeasurable here
          # and the default gate fails on them. SKY_LIVE_TESTS=skip downgrades
          # the shortfall to a loud UNMEASURED block (gate-sweep measures all 61
          # with the FFI installed).
          echo "── xtask coerce-floor (SKY_LIVE_TESTS=skip: FFI-gitignored rows) ──"
          SKY_LIVE_TESTS=skip cargo run --release --locked -q -p xtask -- coerce-floor

      # Every full-module Sky example in the live docs must still `sky check`.
      # Ran per-commit only (rust-ci behaviour-docs); a release runs it too.
      - name: Live docs (full-module doc examples still compile)
        working-directory: .
        run: scripts/doc-examples.sh

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-t1 — the T1 gate harness, split out of gate-core so neither job overruns
  # 30 min on a 4-vCPU runner (gate-core = workspace tests + corpus; gate-t1 =
  # the ~14-min T1 harness). Coverage is identical to running it inside gate-core.
  # It needs postgres + neovim because T1 includes the lsp gate and the
  # postgres-arm gates. Not the rust-cache writer (gate-core writes it).
  gate-t1:
    runs-on: ubuntu-latest
    # The T1 harness release-compiles the workspace from a cold release cache
    # (~15-20 min) then runs its gates. Measured 28 min in total when this was
    # set to 40; at v0.25.18 the gate phase alone passed 35 min (run 36111406977,
    # cancelled at the ceiling with no verdict). This is the ONLY full T1 run, so
    # a ceiling that cancels it leaves T1 unproven at release. Each gate is
    # still bounded by its own harness budget.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: core
          postgres: 'true'
          neovim: 'true'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /
      - name: Gate harness (T1) with proof requirement
        working-directory: rust
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: cargo run --release --locked -q -p xtask -- harness --tier t1 --require-proofs
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-buildrun — the codegen build+run sweep, SHARDED 3 ways. Each shard
  # emits + `go build`s a DISJOINT third of every example (`--shard=N/3`) and
  # RUNS the CLI subset against its committed golden. This is the proven rust-ci
  # `build-corpus` pattern; `build_run_gate::shards_are_disjoint_and_total`
  # proves the thirds union to the whole corpus with nothing gated twice or
  # dropped. Moved out of gate-core, where it was the step that overran 44 min.
  # Measured locally: a shard is ~3-4 min cold, ~20 s warm — well inside 30.
  gate-buildrun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          # All shards share one Go cache family so the build-run cache warms
          # once and is reused across the three shards.
          cache-key: buildrun
      # The composite's free-disk default reclaims the OS junk before the sweep
      # fills the go-build cache. No `go clean -cache` — the sweep repopulates
      # only what its third needs, and a warm cache is the whole point.
      - name: Codegen build + run (shard ${{ matrix.shard }}/3)
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- build-run --all --shard=${{ matrix.shard }}/3
          cargo run --release --locked -q -p xtask -- build-run --shape cli --run --golden --shard=${{ matrix.shard }}/3

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-t2-corpus — the behavioural corpus (`corpus` gate ALONE). This is the
  # tier that caught the v0.21.0 `record_update` codegen regression the MORNING
  # AFTER the release, because it ran ONLY in the nightly (§0.2.1). It `go
  # build`s AND RUNS every combinatorial fixture and is ~10 min locally — the
  # single heaviest T2 gate, so it gets its own runner. The gate has no internal
  # shard flag, so it stays one gate; the OTHER four T2 gates run in
  # gate-t2-rest. `--require-proofs` matches the rigor of the T1 line.
  gate-t2-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_CACHE_BUDGET_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: t2

      - name: Gate harness (T2 — corpus, build+run every fixture) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t2 --only corpus --require-proofs

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-t2-rest — the remaining four T2 gates: spa-diff-fuzz, corpus-isolation,
  # corpus-witness, apps-fieldbook. Union with gate-t2-corpus = the whole T2
  # tier. spa-diff-fuzz + apps-fieldbook drive the installed compiler
  # (sky-out/sky), which the composite installs. `--require-proofs` retained.
  gate-t2-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_CACHE_BUDGET_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: t2

      - name: Gate harness (T2 — isolation / witness / spa-diff-fuzz / fieldbook) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t2 --only corpus-isolation,corpus-witness,spa-diff-fuzz,apps-fieldbook --require-proofs

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-app — the Layer-2 app tier (T3) + the pre-release tier (T4).
  # `apps-ledger-postgres` / `apps-dispatch-postgres` (T3) read the DSN below
  # (the service container declared at job level); the values mirror
  # nightly-sweep.yml's `harness-t3` job VERBATIM. T4 (`apps-ffi-scale`, the
  # 76k-symbol FFI benchmark) is the pre-release tier whose whole purpose is to
  # run exactly here.
  gate-app:
    runs-on: ubuntu-latest
    # T3 + T4 (the 76k-symbol FFI benchmark) + the heavy `#[ignore]`d real-DB
    # leg the nightly runs with a 90-min ceiling. 75 keeps ~1.5x over the three.
    timeout-minutes: 75
    # T3 needs a REAL PostgreSQL. This service mirrors nightly-sweep.yml's
    # `harness-t3` job VERBATIM (same image, credentials, health-check) so the
    # DSN the gates read is the one that job already proves works. It is
    # ADDITIONAL to the apt-installed postgresql-16 (via the composite): that one
    # backs the shared-cluster live tests via SKY_POSTGRES_BIN (each spins up its
    # own cluster in a temp dir); this container backs the T3 DSN on
    # localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: app
          postgres: 'true'

      # T3 — the Layer-2 app tier. Set the DSN on the STEP, not the job, so the
      # earlier live tests — which stand up their OWN cluster via
      # SKY_POSTGRES_BIN — are not handed this DSN.
      - name: Gate harness (T3 — Layer-2 app tier on Postgres) with proof requirement
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --tier t3 --require-proofs

      # T4 is the PRE-RELEASE tier — the one whose whole purpose is to run
      # exactly here. Gate selection is exact tier equality, so the `--tier t1`
      # line in gate-core cannot reach it; this is the only place it runs.
      - name: Gate harness (T4 — pre-release tier)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t4

      # `ai_memory_pg_flow` needs the pgvector extension in the apt cluster the
      # gate-setup composite installs (it installs postgresql-16 only). The
      # nightly job installs the same package for the same test.
      - name: pgvector for the real-DB e2e leg
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-16-pgvector
          [ -f /usr/share/postgresql/16/extension/vector.control ] || {
            echo "::error::pgvector did not install (no vector.control)" >&2; exit 1; }

      # The heavy real-DB e2e leg: the `#[ignore]`d sky-crate tests (nightly
      # harness-t3 runs the same line). They drive real clusters, so they sit
      # with the Postgres tier.
      - name: Heavy real-DB e2e leg (sky crate `#[ignore]`d tests)
        working-directory: rust
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked -- --ignored

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ════════════════════════════════════════════════════════════════════════
  # gate-falsifiers-{1,2,3} — the falsifier verification, SPLIT three ways by
  # `--only` gate groups so no single job overruns (the unsharded job TIMED OUT
  # at 45 min on the v0.24.4 run). `--require-proofs` on the tier lines DEMOTES
  # a PASS whose proof lapsed, but only these runs ESTABLISH that a gate's
  # declared mutation still reddens it. It ran ONLY in the nightly before.
  #
  # The three `--only` lists PARTITION the T1 tier: their union is exactly the
  # T1 gates and no gate appears twice, so the coverage of the old blanket
  # `--verify-falsifiers --tier t1` is preserved, spread across three runners.
  # Each group carries only the environment its gates need — group 2 has Neovim
  # for the `lsp` falsifier, group 3 has PostgreSQL for the `apps-*` falsifiers.
  # The permanent canary self-gate is verified in every run automatically.
  # ════════════════════════════════════════════════════════════════════════

  # gate-falsifiers-1 — the corpus + conformance + sky-suites falsifiers. Pure
  # compiler / stdlib / sqlite; needs neither Neovim nor PostgreSQL.
  gate-falsifiers-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: falsifiers-1
      - name: Falsifier verification (group 1 — corpus / conformance / sky-suites)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only conformance,sky-suites,roundtrip,reject,shared-world,corpus-manifest,corpus-reject,corpus-emit-shape

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-falsifiers-2 — the CLI / LSP / config falsifiers. Needs Neovim for the
  # `lsp` gate's mutation; no PostgreSQL.
  gate-falsifiers-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: falsifiers-2
          neovim: 'true'
      - name: Falsifier verification (group 2 — verify-cli / lsp / config)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only verify-cli,lsp,config-matrix,cli-verbs,config-surface,kernel-members,config-migration,config-migrate

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-falsifiers-3 — the app / runtime-safety falsifiers + the census /
  # ratchet gates. Needs PostgreSQL for the `apps-*` gates (health-driver
  # mutations). The `denominators` / `coverage-ledger` / `config-migration`
  # census checks (§0.2.1 step 2) run in no per-commit job, so a release is the
  # only place they are gated — they ride here.
  gate-falsifiers-3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: falsifiers-3
          postgres: 'true'
      - name: Falsifier verification (group 3 — Layer-2 apps)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only sky-verify,apps-bundled,apps-ledger,apps-dispatch,apps-dispatch-destructive,apps-relay

      # Denominator + ledger + config-migration ratchets. These do not test the
      # compiler; they assert that the coverage + config-migration claims shipped
      # alongside it are still true and still current. `config-migration --check`
      # is the legacy→withX migration census (§0.2.1 step 2); it runs in no
      # per-commit job, so a release is the only place it is gated.
      - name: Coverage ratchets
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- denominators --check
          cargo run --release --locked -q -p xtask -- coverage-ledger --check
          cargo run --release --locked -q -p xtask -- config-migration --check
          cargo run --release --locked -q -p xtask -- config-surface --check

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-falsifiers-{4,5,6} — the falsifier proofs of the tiers ABOVE T1. Groups
  # 1-3 partition T1; these partition T2, T3 and T4, so the union of all six
  # `--only` lists is every gate the registry declares (bar the self-tests and
  # a blocked gate, which have no baseline to falsify; the canary runs in every
  # group). `--all`: nothing is carried from the checked-in proof ledger.
  #
  # Group 4 is the behavioural corpus alone: its baseline and its mutated run
  # each `go build` and run every fixture (~10 min apiece).
  gate-falsifiers-4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GO_CACHE_BUDGET_MB: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: t2
      - name: Falsifier verification (group 4 — the T2 behavioural corpus)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only corpus
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # Group 5 — the rest of T2 and all of T3. The T3 gates need the PostgreSQL
  # service (the same container and DSN as gate-app).
  gate-falsifiers-5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: app
          postgres: 'true'
      - name: Falsifier verification (group 5 — T2 rest + T3 on Postgres)
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only spa-diff-fuzz,corpus-isolation,corpus-witness,apps-fieldbook,apps-ledger-postgres,apps-dispatch-postgres,apps-fleet
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # Group 6 — T4, the 76k-symbol FFI benchmark. Its baseline and its mutated run
  # each drive a cold `sky install` of the Stripe/Firebase surface.
  gate-falsifiers-6:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: sweep
      - name: Falsifier verification (group 6 — T4 FFI scale)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only apps-ffi-scale
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-falsifiers-7 — split out of group 3, which ran past its 30-minute
  # ceiling once the Layer-2 app gates and the runtime-safety gates shared a job.
  gate-falsifiers-7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: falsifiers-7
          postgres: 'true'
      - name: Falsifier verification (group 7 — runtime safety + coverage ledger)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only analytics-retention-survives-a-panic,analytics-prune-errors-are-reported,console-analytics-queries-are-bounded,erasure-path-uses-an-index,periodic-loops-recover-per-cycle,live-time-every-mutex-survives-a-panic,jobs-complete-failure-is-reported,coverage-ledger
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-race — the Go runtime under the race detector against a live
  # PostgreSQL, plus the `integration`-tagged Postgres session-store tests.
  # Mirrors rust-ci's `integration-postgres` (which explains why `-race` needs
  # cgo and why the embedded-supervisor tests need real binaries on the runner).
  gate-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: PostgreSQL binaries for the embedded supervisor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          for b in initdb pg_ctl postgres; do
            [ -x "/usr/lib/postgresql/16/bin/$b" ] || {
              echo "::error::missing /usr/lib/postgresql/16/bin/$b" >&2; exit 1; }
          done
      - name: Postgres session-store integration tests
        working-directory: runtime-go
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: CGO_ENABLED=0 go test -tags integration ./rt/ -run Postgres -v
      - name: rt tests under the race detector, with a live PostgreSQL
        working-directory: runtime-go
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: CGO_ENABLED=1 go test -race ./rt/... -count=1

  # gate-web — the browser tier and the e2e scripts: every Sky.Live /
  # Http.Server example driven in real Chromium (verify-all-web.sh, incl. the
  # console e2e, ui-showcase and the resilience holds), the Sky.Spa wasm client
  # e2e, the terminal loops in a pty, DOM identity, the Sky.Live client and the
  # Std.Ui forms. Mirrors nightly-sweep.yml's `web-runtime` job; before this job
  # none of it ran at a release.
  gate-web:
    runs-on: ubuntu-latest
    # The nightly job budgets 25 min for the tier; the e2e scripts build their
    # fixtures on top. 45 keeps ~1.5x.
    timeout-minutes: 45
    env:
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          cache-key: web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + its browser, sqlite3, python3-venv
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          command -v sqlite3 >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
      - name: Browser runtime verification (Sky.Live + Http.Server + resilience)
        run: scripts/verify-all-web.sh
      - name: Sky.Spa wasm client e2e (restore, stale handlers, RPC consistency, examples)
        run: |
          set -euo pipefail
          scripts/spa-restore-e2e.sh
          scripts/spa-stale-handler-e2e.sh
          scripts/spa-rpc-consistency-e2e.sh
          scripts/spa-examples-e2e.sh
      - name: Terminal loops pty e2e (terminal:tui + terminal:cli)
        run: scripts/tui-e2e.sh
      - name: Sky.Spa + Sky.Live DOM identity e2e
        run: scripts/spa-vdom-identity-e2e.sh
      - name: Sky.Live client e2e (handler addressing, input authority)
        run: scripts/live-client-e2e.sh
      - name: Std.Ui forms + keydown + pub/sub e2e (Sky.Live + Sky.Spa)
        run: scripts/ui-forms-e2e.sh
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-web-evidence
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-sweep — the FULL clean-slate example sweep, build AND RUN every example
  # from a wiped slate, INCLUDING the FFI / Std.Db / real-SDK examples
  # (skyshop's 76k-symbol cold `sky install`, Fyne, embedded Postgres). This is
  # the other gate §0.2.1 names by hand: it ran ONLY in the nightly. No
  # `--build-only` — the sweep must RUN each binary, not just compile it.
  #
  # SHARDED across 5 runners via `strategy.matrix`. Each shard builds+runs a
  # DISJOINT subset (examples whose stable index mod 5 == shard); the union of
  # the five shards is every example, exactly once (verified by
  # `example_sweep_shards_are_total.rs` + `scripts/example-sweep.sh --list`).
  # The compiler at sky-out/sky is installed by the composite (the sweep resolves
  # that path and refuses a stale one via require_fresh_compiler), and it does
  # the per-example FFI `sky install` itself.
  gate-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    # A shard is ~1/5 of the ~60 min full sweep + the compiler install. 45
    # keeps the ~1.5x margin (the skyshop FFI shard's cold `sky install` is the
    # variable one).
    timeout-minutes: 45
    env:
      # The sweep builds the FFI examples, whose Go deps float on "latest", so
      # its Go module cache grows fast. 6 GiB here (the nightly sweep's budget),
      # bounded before save so it never evicts the other release caches.
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-setup
        with:
          # All shards share one Go cache family so the FFI cache is warmed
          # once and reused; distinct from the light jobs' caches.
          cache-key: sweep
          postgres: 'true'

      - name: Full example sweep (clean-slate build AND run, shard ${{ matrix.shard }}/5, incl. FFI/Std.Db)
        working-directory: .
        env:
          SWEEP_SHARD_INDEX: ${{ matrix.shard }}
          SWEEP_SHARD_TOTAL: '5'
        run: scripts/example-sweep.sh

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ────────────────────────────────────────────────────────────────
  # Assemble release assets, generate checksums, publish GitHub Release.
  # ────────────────────────────────────────────────────────────────
  release:
    # Only a tag publishes; a dispatched full-suite run stops before this job.
    if: startsWith(github.ref, 'refs/tags/v')
    # Publication is blocked until EVERY gate job is green — the §0.2.1
    # "full suite green before publish" invariant, preserved across the split.
    # A red gate → this job never runs → no Release → the tag is safe. This list
    # names EVERY sharded gate job; a matrix job (gate-buildrun / gate-sweep) is
    # not satisfied until all its legs pass, so `needs` on the job name blocks on
    # the whole matrix.
    # The jobs run concurrently, so the wall clock is the slowest job, not the
    # sum. The interim "lean release" list (build / buildrun / sweep / app only)
    # is gone: CLAUDE.md §0.2.1 makes the full suite the release gate, and
    # `tests/workflows_parse.rs` fails the build if a `gate-*` job is disabled or
    # missing from this list.
    needs:
      - verify-ci-green
      - build
      - gate-core
      - gate-t1
      - gate-buildrun
      - gate-t2-corpus
      - gate-t2-rest
      - gate-app
      - gate-falsifiers-1
      - gate-falsifiers-2
      - gate-falsifiers-3
      - gate-falsifiers-4
      - gate-falsifiers-5
      - gate-falsifiers-6
      - gate-falsifiers-7
      - gate-race
      - gate-web
      - gate-sweep
    runs-on: ubuntu-latest
    # No compilation: download 4 artifacts, checksum, extract CHANGELOG notes,
    # create the Release (asset upload dominates) ≈ 3 min. 1.5x ≈ 5.
    timeout-minutes: 5
    steps:
      # Checkout is required so the CHANGELOG + release-notes extractor are on
      # disk — `sky upgrade` prints the Release body verbatim, so it MUST be the
      # curated CHANGELOG section, never GitHub's auto-generated commit list.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} release/ \;
          ls -la release/

      # ── The gate: the asset set is asserted, not assumed ──────────────────
      # `find … -exec cp` cannot fail the step when it copies nothing (find
      # exits 0 on an empty result), and upload-artifact was `if-no-files-found:
      # ignore`, so a matrix leg that produced no archive vanished silently and
      # the Release published a PARTIAL asset set, green. `sky upgrade` then
      # 404s for whichever platform went missing.
      #
      # This list is the release contract and must match the build matrix above.
      - name: Assert the complete asset set is present
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            sky-linux-x64.tar.gz
            sky-linux-arm64.tar.gz
            sky-darwin-arm64.tar.gz
            sky-windows-x64.zip
          )
          missing=()
          for f in "${EXPECTED[@]}"; do
            [ -s "release/$f" ] || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release is missing required asset(s): ${missing[*]}" >&2
            find release -maxdepth 1 -type f -exec basename {} \; >&2
            exit 1
          fi
          # Nothing unexpected either — an extra/renamed asset means the build
          # matrix and this contract have drifted apart.
          actual=$(find release -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')
          want=$(printf '%s\n' "${EXPECTED[@]}" | sort | tr '\n' ' ')
          if [ "$actual" != "$want" ]; then
            echo "::error::asset set drift. want: $want" >&2
            echo "got : $actual" >&2
            exit 1
          fi
          echo "asset set complete: $want"

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG
        run: |
          # Hard gate: fails the release if the tag has no matching CHANGELOG
          # section, so a tag can never ship empty upgrade notes.
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > NOTES.md
          echo "----- release body for ${GITHUB_REF_NAME} -----"
          cat NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: release/*

  # ────────────────────────────────────────────────────────────────
  # Multi-arch Docker image (amd64 + arm64) built from the Dockerfile.
  # ────────────────────────────────────────────────────────────────
  docker:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    # The Dockerfile compiles nothing — it apt-installs curl/git and downloads
    # the released binary. Cost is the arm64 leg under QEMU emulation (~5-8 min)
    # plus the asset-propagation retry loop (up to ~2 min per platform) ≈ 12 min.
    # 1.5x ≈ 20. `continue-on-error` means a hit here won't fail the release.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Pin the version explicitly so the image build never falls back to
          # the unauthenticated GitHub `releases/latest` API call inside the
          # Dockerfile. That fallback fires once PER platform (amd64 + arm64
          # under QEMU) and hit the 60/hr unauthenticated rate limit, failing
          # the multi-arch build even after the release assets were live. The
          # tag is already known here (this job `needs: release`), so pass it
          # straight through — deterministic, no network guesswork.
          build-args: |
            SKY_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            anzel/sky:latest
            anzel/sky:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
