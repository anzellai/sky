name: Release

on:
  push:
    tags: ['v*']
  # A dispatched run (`gh workflow run release.yml --ref <branch>`) executes
  # every gate job — the full suite — and skips the publishing jobs, so a merge
  # to main can be held on the same gate as a tag (CLAUDE.md §0.2.1). Open the
  # PR first: `verify-ci-green` needs the per-commit ci-green of the head commit.
  workflow_dispatch:

permissions:
  contents: write

env:
  # THE GLIBC FLOOR: the oldest glibc a released Linux binary may need. It
  # defines the oldest supported Linux: Debian 12, Ubuntu 22.04, RHEL 9 and
  # newer. The Linux build legs run on the current Ubuntu runners and build
  # with cargo-zigbuild against `<triple>.<floor>`, so the runner's own glibc
  # never leaks into the binary. The `glibc floor` step in each Linux leg
  # fails the build if a binary needs a newer symbol version than this.
  # Raise it only on purpose: it drops every distribution below it.
  SKY_GLIBC_FLOOR: '2.35'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Cross-platform build. Each target is built on a runner of its own
  # architecture (provides Go per-runner for the sky-ffi-inspect asset). The
  # Linux legs pin their glibc with cargo-zigbuild rather than with an old
  # runner image (see SKY_GLIBC_FLOOR above).
  # ────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries build on the CURRENT Ubuntu runners (ubuntu-latest,
          # ubuntu-24.04-arm; GitHub has no ubuntu-latest-arm label), so a
          # breaking image change shows up early. Their glibc is NOT the
          # runner's: a binary linked normally needs the build host's glibc
          # (a 24.04 host gives 2.39, which fails on Debian 12, Ubuntu 22.04
          # and RHEL 9 with "version GLIBC_2.39 not found"). `rust-target`
          # makes the leg build with `cargo zigbuild --target
          # <rust-target>.$SKY_GLIBC_FLOOR`, which links against that glibc
          # version instead, and the leg then proves it (objdump + a run in
          # debian:12) before it uploads anything.
          # `timeout` is PER LEG: `timeout-minutes` applies to each matrix job
          # separately, and a single number sized for Windows would leave the
          # three Unix legs effectively unbounded. Basis: a cache-cold
          # `cargo build --release -p sky` (the whole crate graph in release) is
          # ~15-20 min on the Linux/macOS runners and ~30 min on Windows, whose
          # filesystem + linker make Rust builds ~2x slower. Values are 1.5x of
          # each leg's own estimate. Erring generous on the release path: a false
          # red here blocks a tag, and these legs run only on `push: tags`.
          - os: ubuntu-latest
            artifact: sky-linux-x64
            ext: ''
            rust-target: x86_64-unknown-linux-gnu
            timeout: 30
          - os: ubuntu-24.04-arm
            artifact: sky-linux-arm64
            ext: ''
            rust-target: aarch64-unknown-linux-gnu
            timeout: 30
          - os: macos-latest
            artifact: sky-darwin-arm64
            ext: ''
            timeout: 30
          - os: windows-latest
            artifact: sky-windows-x64
            ext: '.exe'
            timeout: 45

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Before any build: the tag, the one version source
      # (`[workspace.package] version` in rust/Cargo.toml, which `sky
      # --version` prints) and the newest CHANGELOG.md heading must all name
      # the same version. Every commit already holds the last two equal
      # (rust/crates/xtask/tests/docs_state_the_current_version.rs); this adds
      # the tag.
      - name: Tag, workspace version and CHANGELOG agree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' rust/Cargo.toml)
          CHANGELOG_VERSION=$(sed -nE 's/^## v([0-9]+\.[0-9]+\.[0-9]+)( .*)?$/\1/p' CHANGELOG.md | head -1)
          echo "tag $TAG_VERSION, rust/Cargo.toml $CARGO_VERSION, CHANGELOG.md $CHANGELOG_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::the tag (v$TAG_VERSION), rust/Cargo.toml [workspace.package] version ($CARGO_VERSION) and the newest CHANGELOG.md heading (v$CHANGELOG_VERSION) must name the same version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          # No setup-go cache: these legs run on a tag, and a cache saved on a
          # tag ref is visible to that tag alone, so it only filled the 10 GB
          # repository budget. The one Go compile here is tools/sky-ffi-inspect.
          cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          # A cache saved on a tag ref serves that tag alone. Save nothing.
          save-if: 'false'

      # The Linux legs link against SKY_GLIBC_FLOOR, not the runner's glibc.
      # Both tools are pinned: zig from its PyPI wheel (the files.pythonhosted.org
      # CDN, checked against the sha256 below), cargo-zigbuild by exact crate
      # version with its own Cargo.lock.
      - name: Install zig and cargo-zigbuild (Linux glibc floor)
        if: matrix.rust-target != ''
        shell: bash
        env:
          CARGO_ZIGBUILD_VERSION: '0.23.4'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              wheel_url='https://files.pythonhosted.org/packages/db/81/f9f5c7fd68d80b8edff2a641a1c95ac4125356387d298374227040b8e1e8/ziglang-0.15.2-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl'
              wheel_sha256='806316453d1ede7174ed3fefb8e5348154629089c3bb5fe812dfd0e172fac130'
              ;;
            aarch64)
              wheel_url='https://files.pythonhosted.org/packages/53/7d/8c277208250ffa72f12a10f52dfc1d45850f08244093065b40c5f4628260/ziglang-0.15.2-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl'
              wheel_sha256='edc0aa60ec964a4cf462d40f68d7de242ddf37fd9a80f2afaee6397059463230'
              ;;
            *)
              echo "::error::no pinned zig for $(uname -m)" >&2
              exit 1
              ;;
          esac
          dir="$RUNNER_TEMP/zig-0.15.2"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/zig.whl" "$wheel_url"
          echo "$wheel_sha256  $dir/zig.whl" | sha256sum -c -
          (cd "$dir" && unzip -q zig.whl 'ziglang/*' && rm -f zig.whl)
          chmod +x "$dir/ziglang/zig"
          echo "$dir/ziglang" >> "$GITHUB_PATH"
          "$dir/ziglang/zig" version
          cargo install --locked "cargo-zigbuild@${CARGO_ZIGBUILD_VERSION}"
          command -v cargo-zigbuild

      - name: Build sky compiler (cargo)
        shell: bash
        working-directory: rust
        run: |
          # The binary prints the workspace version (rust/Cargo.toml), which
          # the first step held equal to the tag. An empty SKY_GIT_REV tells
          # rust/crates/sky/build.rs this is a release: no commit after the
          # version, so the binary prints exactly `sky v<tag>` (the smoke test
          # below checks it).
          export SKY_GIT_REV=""
          mkdir -p ../dist
          if [ -n "${{ matrix.rust-target }}" ]; then
            # Linux: link against the glibc floor, not the runner's glibc. The
            # executable path comes from cargo's own JSON report, for the same
            # reason as cargo_bin_path below.
            target="${{ matrix.rust-target }}.${SKY_GLIBC_FLOOR}"
            echo "building for $target"
            cargo zigbuild --release --locked -p sky --target "$target" --message-format=json > "$RUNNER_TEMP/sky-build.json"
            src=$(tr ',' '\n' < "$RUNNER_TEMP/sky-build.json" | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | grep -v '^null$' | tail -1)
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "::error::cargo zigbuild reported no sky executable (got '${src:-<empty>}')" >&2
              exit 1
            fi
            cp "$src" "../dist/${{ matrix.artifact }}${{ matrix.ext }}"
            chmod +x "../dist/${{ matrix.artifact }}${{ matrix.ext }}"
            exit 0
          fi
          cargo build --release --locked -p sky
          # Ask CARGO which file it produced. This is the artefact users
          # download, and a hardcoded target path silently ships an OLDER
          # binary wherever CARGO_TARGET_DIR is set — the `cp` cannot fail,
          # because the stale file genuinely exists. CI sets no such var today,
          # so this site was benign; "benign today" is not a property worth
          # relying on at the one step that reaches users. cargo reports the
          # path with its platform extension, so `matrix.ext` is not needed on
          # the source side.
          source ../scripts/lib/cargo-target.sh
          cp "$(cargo_bin_path "$PWD" sky --release)" "../dist/${{ matrix.artifact }}${{ matrix.ext }}"
          chmod +x "../dist/${{ matrix.artifact }}${{ matrix.ext }}" || true

      - name: Build sky-ffi-inspect (Go)
        shell: bash
        run: |
          # Still shipped for SkyDeploy compatibility even though the Rust `sky`
          # self-provisions the inspector (it `go build`s the embedded source on
          # first use). Keep the asset name so downstream pulls don't break.
          #
          # The module fetch is the only network step between a green gate
          # suite and a published release, and a single slow answer from
          # proxy.golang.org used to fail the whole tag run (v0.25.21 linux-x64:
          # "TLS handshake timeout" on golang.org/x/tools). Fetch with bounded
          # retries, then build with GOPROXY=off so the build itself cannot
          # reach the network: a module the fetch missed fails loudly here
          # instead of being fetched again without a retry.
          cd tools/sky-ffi-inspect
          ok=0
          for attempt in 1 2 3 4 5; do
            if go mod download; then ok=1; break; fi
            echo "go mod download failed (attempt $attempt of 5), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          [ "$ok" = 1 ] || { echo "go mod download failed 5 times"; exit 1; }
          GOPROXY=off GOFLAGS=-mod=readonly go build -ldflags="-s -w" -o "../../dist/sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}" .

      - name: Smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          # On a tag the binary must print the tag. A dispatched run (the
          # merge gate) runs on a branch, where GITHUB_REF_NAME is the branch
          # name: there the binary must print the workspace version, the one
          # version source (the tag step above already ties tag == workspace
          # version on a tag).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' rust/Cargo.toml)
          fi
          if [ -z "$TAG_VERSION" ]; then
            echo "::error::no expected version: not a tag, and rust/Cargo.toml has no [workspace.package] version" >&2
            exit 1
          fi
          ACTUAL=$("./dist/${{ matrix.artifact }}${{ matrix.ext }}" --version)
          echo "$ACTUAL"
          # ANCHORED comparison, not a substring match. `sky --version` prints
          # exactly one line, `sky v<semver>` (rust/crates/sky/src/main.rs:4416),
          # so the version token is extracted and compared WHOLE.
          #
          # The previous check was `grep -qF "sky v${TAG_VERSION}"`, an unanchored
          # substring. Demonstrated failures it let through:
          #   tag v0.19.1  + binary "sky v0.19.10"    -> passed (wrong release!)
          #   tag v0.19.1  + binary "sky v0.19.1-rc1" -> passed (prerelease!)
          # Both are rejected below. So is a binary that names a commit after
          # the version (`sky v0.27.5 (1a2b3c4)`, a source build): a release
          # sets SKY_GIT_REV="" and prints the version alone.
          REPORTED=$(printf '%s\n' "$ACTUAL" | head -1 | sed -n 's/^sky v\([^ ]*\)$/\1/p')
          if [ -z "$REPORTED" ]; then
            echo "::error::binary did not print exactly 'sky v<version>' (got '$ACTUAL'); a release build must set SKY_GIT_REV=\"\"" >&2
            exit 1
          fi
          if [ "$REPORTED" != "$TAG_VERSION" ]; then
            echo "::error::version mismatch: tag says '$TAG_VERSION', binary says '$REPORTED'" >&2
            exit 1
          fi
          echo "version OK: $REPORTED == $TAG_VERSION"

      # THE GLIBC FLOOR, proved on the binaries this leg is about to upload.
      # (a) No dynamic symbol may need a GLIBC_x.y above SKY_GLIBC_FLOOR. A
      #     static binary (sky-ffi-inspect is pure Go) needs no glibc at all.
      # (b) The binary must run in debian:12, the oldest distribution the
      #     floor names, on this leg's own architecture.
      # Both sit before Package and upload, so a binary that fails them never
      # reaches the publish job.
      - name: Linux binaries need no glibc above SKY_GLIBC_FLOOR
        if: matrix.rust-target != ''
        shell: bash
        run: |
          set -euo pipefail
          floor="$SKY_GLIBC_FLOOR"
          bad=0
          for bin in "dist/${{ matrix.artifact }}" "dist/sky-ffi-inspect-${{ matrix.artifact }}"; do
            if [ ! -f "$bin" ]; then
              echo "::error::$bin was not built" >&2
              exit 1
            fi
            # Captured first: `readelf | grep -q` under pipefail can fail on
            # SIGPIPE and would read as "static".
            headers=$(readelf -l "$bin")
            if ! grep -q 'Requesting program interpreter' <<<"$headers"; then
              echo "$bin: statically linked, needs no glibc"
              echo "- \`$(basename "$bin")\`: static, no glibc" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            syms=$(objdump -T "$bin")
            need=$(printf '%s\n' "$syms" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -1 || true)
            if [ -z "$need" ]; then
              echo "::error::$bin is dynamically linked but objdump found no GLIBC symbol versions" >&2
              exit 1
            fi
            top=$(printf '%s\n%s\n' "$floor" "$need" | sort -V | tail -1)
            echo "$bin: needs glibc $need (floor $floor)"
            echo "- \`$(basename "$bin")\`: needs GLIBC_$need (floor $floor)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$top" != "$floor" ]; then
              echo "::error::$bin needs GLIBC_$need, above the floor $floor. These symbols are too new:" >&2
              printf '%s\n' "$syms" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | while read -r v; do
                if [ "$(printf '%s\n%s\n' "$floor" "$v" | sort -V | tail -1)" != "$floor" ]; then
                  printf '%s\n' "$syms" | grep -F "GLIBC_$v" | sed 's/^/  /' >&2 || true
                fi
              done
              bad=1
            fi
          done
          exit "$bad"

      - name: sky --version runs in debian:12 (the floor's oldest distribution)
        if: matrix.rust-target != ''
        shell: bash
        run: |
          set -euo pipefail
          out=$(docker run --rm -v "$PWD/dist:/dist:ro" debian:12 "/dist/${{ matrix.artifact }}" --version)
          echo "debian:12 ($(uname -m)): $out"
          echo "- debian:12 on $(uname -m): \`$out\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows-*)
              ARCHIVE="${{ matrix.artifact }}.zip"
              7z a "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
            *)
              # --owner=0 --group=0 --numeric-owner: stamp root:root, not the CI
              # runner's UID/GID, so the installer never has to chown on extract
              # (unprivileged containers can't, and it blocked `sky` installs).
              ARCHIVE="${{ matrix.artifact }}.tar.gz"
              tar --owner=0 --group=0 --numeric-owner -czf "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
          esac
          ls -la
          # Assert the archive actually materialised and is non-empty. Without
          # this, a silent packaging failure reached upload-artifact, which was
          # set to `if-no-files-found: ignore` and uploaded nothing — green.
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::packaging produced no (or empty) $ARCHIVE for ${{ matrix.artifact }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          # Exactly one of these two exists per matrix leg (.zip on Windows,
          # .tar.gz elsewhere), so `error` fires only when the leg produced
          # NEITHER — which is the real failure. It was `ignore`, under which a
          # leg that built nothing still reported success and the release simply
          # shipped without that platform's asset.
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════════════════
  # THE RELEASE TEST GATE — fanned out into independent jobs that run
  # CONCURRENTLY.
  #
  # Until this gate existed, `release.yml` ran NO test of any kind: a tag cut
  # from a red commit shipped, green. The gate is the `rust gate suite` arm of
  # `scripts/preflight-tag.sh` — the set this repo already treats as the release
  # bar — plus the gate harness, which is the only runner that can report NOT
  # RUN / UNPROVEN instead of silently passing.
  #
  # HISTORY: it began as ONE sequential job (~2 h), then five (gate-core /
  # gate-t2 / gate-app / gate-falsifiers / gate-sweep). Three of those legs were
  # UNSHARDED and each hit or neared the 45-min job timeout on the v0.24.4 run
  # (34749427414): gate-core TIMED OUT at 44m (it ran workspace tests + corpus +
  # `build-run --all` + T1 in one job, with a `go clean -cache` that forced a
  # cold sweep rebuild); gate-falsifiers TIMED OUT at 45m; gate-t2 sat at ~34m.
  #
  # THIS REVISION shards the three tall poles so the wall-clock collapses to the
  # slowest shard, WITHOUT dropping any coverage:
  #   * `build-run --all` (build+run every example) moves OUT of gate-core into a
  #     NEW 3-shard matrix job `gate-buildrun` (the proven rust-ci build-corpus
  #     pattern: `--shard=N/3`, disjoint + total by
  #     `build_run_gate::shards_are_disjoint_and_total`). The `go clean -cache`
  #     step is GONE — it only existed to make room for that in-job sweep.
  #   * the T2 tier splits across `gate-t2-corpus` (the behavioural corpus
  #     shard gates `corpus-1` … `corpus-4`) + `gate-t2-rest` (the lighter T2
  #     gates).
  #   * the T1 falsifier sweep splits across `gate-falsifiers-1/2/3` by `--only`
  #     gate groups; their union is the whole T1 tier.
  # NOTHING is dropped: every tier T1-T4, the corpus gates, the workspace tests,
  # the falsifier verification, the census, and the FULL clean-slate example
  # sweep each run in EXACTLY ONE of the jobs below. `release: needs:` lists ALL
  # of them, so publication is still blocked until every one is green
  # (CLAUDE.md §0.2.1, INVIOLABLE).
  #
  # Shared setup (Rust + Go toolchains, warm caches, disk reclaim, the
  # scripts/build.sh compiler install) is defined ONCE in the local composite
  # action .github/actions/gate-setup. Caches are RESTORE-ONLY here: only
  # refs/heads/main saves a cache (rust-ci and the nightly), so a release
  # restores the Go cache main last wrote (`go-linux`, or `go-sweep` for the
  # FFI-heavy jobs) and the release-profile cargo cache the nightly writes
  # (`sky-gates-linux`), and saves nothing that could evict them.
  # ════════════════════════════════════════════════════════════════════════

  # gate-core: workspace tests + corpus gates + coerce-floor + the T1 harness
  # (with proofs). The `lsp` T1 gate needs Neovim; the workspace live tests + T1
  # apps need a real PostgreSQL. Caches are restore-only here.
  # `build-run --all` used to run here too; it now lives in `gate-buildrun`.
  # ────────────────────────────────────────────────────────────────
  # verify-ci-green — the tagged commit's per-commit `ci-green` must be GREEN.
  # This is a precondition, not a substitute: the release gate below runs the
  # FULL suite itself (CLAUDE.md §0.2.1 — the merge/release gate is the full
  # suite, nothing deferred to nightly). An interim "lean release" (2026-09-13)
  # had disabled the workspace tests, T1, T2 and the falsifier jobs here and
  # trusted ci-green plus the nightly instead; ci-green runs a LIGHT subset of
  # T1 and no T2, so that was the v0.21.0 gap again. Those jobs are re-enabled,
  # and the browser tier, the e2e scripts, the doc examples and `go test -race`
  # — which ran in no release job at all — are wired in.
  # `tests/workflows_parse.rs::the_release_workflow_is_the_full_suite` fails
  # the build if any of it is disabled again or drops out of `release: needs:`.
  # ────────────────────────────────────────────────────────────────
  verify-ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the tagged commit's per-commit ci-green to be SUCCESS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Requiring a green per-commit ci-green for $sha before releasing."
          # Poll up to ~10 min: the per-commit Rust CI for this commit may still
          # be finishing when the tag is pushed moments later.
          for i in $(seq 1 20); do
            # Filter by name IN the query: the endpoint pages at 30 runs, and a
            # commit with more check runs than that (a release branch carries
            # dozens) hid `ci-green` on page 2, so this read "pending" for ten
            # minutes on a commit whose ci-green had already passed.
            concl=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs?check_name=ci-green&per_page=100" \
              --jq '[.check_runs[] | select(.name=="ci-green")] | sort_by(.started_at) | last | .conclusion // "pending"')
            echo "attempt $i: ci-green = $concl"
            case "$concl" in
              success)
                echo "ci-green is SUCCESS for $sha — safe to release."
                exit 0 ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "::error::ci-green is '$concl' for $sha. Refusing to release an unverified commit — fix ci-green on main first." >&2
                exit 1 ;;
              *)
                sleep 30 ;;
            esac
          done
          echo "::error::ci-green did not reach a conclusion for $sha within the wait window. Refusing to release." >&2
          exit 1

  gate-core:
    runs-on: ubuntu-latest
    # Workspace tests EXCEPT the `sky` crate, which runs in gate-core-sky-1..6.
    # They took ~37 min on the runner at v0.25.18 (run 36122173135), so the
    # corpus gates + coerce-floor + doc examples that used to follow them here
    # moved to gate-corpus. At v0.27.0 the sky crate alone outgrew the job: run
    # 36643630048 was cancelled at 60 min inside `cargo test --workspace`, with
    # the spa_split_flow binary still running after 35 min (its tests share one
    # build lock, so `cargo test` runs them one at a time). Before sky, the other
    # crates took ~4 min of tests after a ~5 min compile. Estimate ~15 min with
    # setup; per-job timeout = 1.5x (docs/ci-test-architecture-v2.md §8.2) = 23,
    # rounded to 25.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          neovim: 'true'

      # `--exclude sky`: the sky crate runs in gate-core-sky-1..6 below, sliced
      # by test with nextest. Doctests still run here (`cargo test` runs them;
      # nextest does not, and sky is bin-only, so it has none).
      - name: Workspace tests (every crate except sky)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo test --workspace --exclude sky --locked

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
