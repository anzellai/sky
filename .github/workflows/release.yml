  # gate-core-sky-1..6 — the `sky` crate's tests, split out of gate-core.
  # `cargo nextest run -p sky --partition slice:k/6`: slice splits the whole
  # sorted test list evenly across the six jobs, so a long binary such as
  # spa_split_flow (81 tests, 25-40 min alone under `cargo test`) is spread
  # across all of them. Disjoint and total by construction;
  # tests/workflows_parse.rs checks the six slices are all present. The
  # `serial-servers` group in rust/.config/nextest.toml still runs the
  # fixed-port server tests one at a time within each job. The same split the
  # per-commit `test-sky` jobs use (rust-ci.yml, at 9 slices).
  #
  # Why nine, measured (release runs 37545837777, 37594890617, 37713125127,
  # 37752520304, all at five slices): the nextest execution summed over the
  # five slices is 67-71 min per run (3997-4253 s); the slowest slice ran
  # 968 s of tests, and its job took 22.0 min (gate-setup 1.6-4.2 min, test
  # compile 1m40s-3m07s, then the tests). That is 27% headroom under the
  # 30-min timeout, and v0.27.8 (run 37752520304) lost it: gate-core-sky-4
  # spent 15 min in gate-setup's disk-reclaim step on a slow runner, then was
  # cancelled at 30 min with 11.5 min of tests done (the re-run took 19.2).
  # At nine slices the tests are ~8 min per slice (4253 s / 9 = 473 s), so
  # with the ~6-7 min fixed setup + compile a slice job is ~14-16 min. The
  # per-commit 9-slice test-sky jobs agree: their slowest job was 11.4 and
  # 13.6 min (rust-ci runs 37711532703, 37750307576). That is >= 40% headroom
  # under 30 min. Seven slices would put the slowest job at ~18 min, at the
  # edge of that margin, so nine. Timeout stays 30.
  #
  # Why SIX since v0.27.9: the build-speed work made the tests faster. At nine
  # slices the jobs took 268-429 s each, compile and setup included (release run
  # 38858732165): about 29 min of tests in all, under 4 min per slice, behind a
  # ~2.5 min compile that every slice repeats. Nine jobs of mostly fixed cost
  # held nine of the 40 jobs that can run at once, and the release queued. Six
  # slices are ~5 min of tests each (~8 min a job), still under a third of the
  # 30-min timeout.
  # The heavy `#[ignore]`d legs run in gate-app (`-- --ignored`), unchanged.
  gate-core-sky-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          install-compiler: 'false'
      - name: Install cargo-nextest (prebuilt binary)
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: sky crate tests, slice 1/6 (nextest)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo nextest run -p sky --locked --partition slice:1/6
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

