name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Cross-platform build. Each target is built natively on its own
  # runner (keeps the existing glibc floor + provides Go per-runner for
  # the sky-ffi-inspect asset). Cross-compile is deliberately avoided.
  # ────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries build on Ubuntu 22.04 (glibc 2.35), NOT 24.04 (glibc
          # 2.39), for PORTABILITY: a binary links against the build host's
          # glibc and only runs where glibc is at least that new. A 2.39 binary
          # fails on Debian Bookworm (2.36), Ubuntu 22.04, RHEL 9, and the
          # golang:1.26-bookworm Docker base ("version GLIBC_2.39 not found").
          # 2.35 runs on everything from Bookworm onward.
          # `timeout` is PER LEG: `timeout-minutes` applies to each matrix job
          # separately, and a single number sized for Windows would leave the
          # three Unix legs effectively unbounded. Basis: a cache-cold
          # `cargo build --release -p sky` (the whole crate graph in release) is
          # ~15-20 min on the Linux/macOS runners and ~30 min on Windows, whose
          # filesystem + linker make Rust builds ~2x slower. Values are 1.5x of
          # each leg's own estimate. Erring generous on the release path: a false
          # red here blocks a tag, and these legs run only on `push: tags`.
          - os: ubuntu-22.04
            artifact: sky-linux-x64
            ext: ''
            timeout: 30
          - os: ubuntu-22.04-arm
            artifact: sky-linux-arm64
            ext: ''
            timeout: 30
          - os: macos-latest
            artifact: sky-darwin-arm64
            ext: ''
            timeout: 30
          - os: windows-latest
            artifact: sky-windows-x64
            ext: '.exe'
            timeout: 45

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build sky compiler (cargo)
        shell: bash
        working-directory: rust
        run: |
          # Bake the tag into the binary at compile time (sky build.rs +
          # option_env!("SKY_BUILD_VERSION")). A standalone released binary
          # carries no repo tree, so this is its only version source; the smoke
          # test below fails loudly if it still reports "sky dev".
          export SKY_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --locked -p sky
          mkdir -p ../dist
          # Ask CARGO which file it produced. This is the artefact users
          # download, and a hardcoded target path silently ships an OLDER
          # binary wherever CARGO_TARGET_DIR is set — the `cp` cannot fail,
          # because the stale file genuinely exists. CI sets no such var today,
          # so this site was benign; "benign today" is not a property worth
          # relying on at the one step that reaches users. cargo reports the
          # path with its platform extension, so `matrix.ext` is not needed on
          # the source side.
          source ../scripts/lib/cargo-target.sh
          cp "$(cargo_bin_path "$PWD" sky --release)" "../dist/${{ matrix.artifact }}${{ matrix.ext }}"
          chmod +x "../dist/${{ matrix.artifact }}${{ matrix.ext }}" || true

      - name: Build sky-ffi-inspect (Go)
        shell: bash
        run: |
          # Still shipped for SkyDeploy compatibility even though the Rust `sky`
          # self-provisions the inspector (it `go build`s the embedded source on
          # first use). Keep the asset name so downstream pulls don't break.
          ( cd tools/sky-ffi-inspect && go build -ldflags="-s -w" -o "../../dist/sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}" . )

      - name: Smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL=$("./dist/${{ matrix.artifact }}${{ matrix.ext }}" --version)
          echo "$ACTUAL"
          # ANCHORED comparison, not a substring match. `sky --version` prints
          # exactly one line, `sky v<semver>` (rust/crates/sky/src/main.rs:4416),
          # so the version token is extracted and compared WHOLE.
          #
          # The previous check was `grep -qF "sky v${TAG_VERSION}"`, an unanchored
          # substring. Demonstrated failures it let through:
          #   tag v0.19.1  + binary "sky v0.19.10"    -> passed (wrong release!)
          #   tag v0.19.1  + binary "sky v0.19.1-rc1" -> passed (prerelease!)
          # Both are rejected below. It still catches the case the step was
          # written for: SKY_BUILD_VERSION unset bakes in the "sky dev" fallback,
          # which yields no version token at all.
          REPORTED=$(printf '%s\n' "$ACTUAL" | head -1 | sed -n 's/^sky v\([^ ]*\)$/\1/p')
          if [ -z "$REPORTED" ]; then
            echo "::error::binary did not report a version (got '$ACTUAL'); SKY_BUILD_VERSION was not baked in" >&2
            exit 1
          fi
          if [ "$REPORTED" != "$TAG_VERSION" ]; then
            echo "::error::version mismatch: tag says '$TAG_VERSION', binary says '$REPORTED'" >&2
            exit 1
          fi
          echo "version OK: $REPORTED == $TAG_VERSION"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows-*)
              ARCHIVE="${{ matrix.artifact }}.zip"
              7z a "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
            *)
              # --owner=0 --group=0 --numeric-owner: stamp root:root, not the CI
              # runner's UID/GID, so the installer never has to chown on extract
              # (unprivileged containers can't, and it blocked `sky` installs).
              ARCHIVE="${{ matrix.artifact }}.tar.gz"
              tar --owner=0 --group=0 --numeric-owner -czf "$ARCHIVE" "${{ matrix.artifact }}${{ matrix.ext }}" "sky-ffi-inspect-${{ matrix.artifact }}${{ matrix.ext }}"
              ;;
          esac
          ls -la
          # Assert the archive actually materialised and is non-empty. Without
          # this, a silent packaging failure reached upload-artifact, which was
          # set to `if-no-files-found: ignore` and uploaded nothing — green.
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::packaging produced no (or empty) $ARCHIVE for ${{ matrix.artifact }}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Exactly one of these two exists per matrix leg (.zip on Windows,
          # .tar.gz elsewhere), so `error` fires only when the leg produced
          # NEITHER — which is the real failure. It was `ignore`, under which a
          # leg that built nothing still reported success and the release simply
          # shipped without that platform's asset.
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # THE RELEASE TEST GATE.
  #
  # Until this job existed, `release.yml` ran NO test of any kind. Pushing a
  # `v*` tag built four binaries, checked that each reported the tag's version,
  # and published — so a tag cut from a red commit shipped, green. The only
  # thing standing between a broken compiler and a published release was
  # `scripts/preflight-tag.sh`, which a human has to remember to run locally.
  # "A human remembers" is not a gate.
  #
  # WHAT IT RUNS, and why exactly this set: it is the `rust gate suite` arm of
  # `scripts/preflight-tag.sh:75` — the set this repo already treats as the
  # release bar — plus the gate harness, which is the only runner that can
  # report NOT RUN / UNPROVEN instead of silently passing. Keeping the two in
  # step is deliberate: a release must not be gated on something weaker than
  # what the maintainer runs by hand.
  #
  # WHY IT DOES NOT `needs: build`: the matrix and the gate are independent, so
  # they run concurrently and the gate does not lengthen the critical path. The
  # dependency that matters is `release: needs: [build, gate]` — assets may be
  # built, but nothing is PUBLISHED until the gate is green.
  #
  # T4 (pre-release) ceiling is 3 h (docs/ci-test-architecture-v2.md §8.1); the
  # per-job timeout below is sized to this job's own estimate per §8.2, not to
  # the tier.
  # ────────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    # 90 → 180. The light subset fit in 90; the FULL tier suite does not.
    # §0.2.1 (INVIOLABLE) requires every tier at a release, and the heavy ones
    # dominate: the T2 behaviour-corpus alone is ~25 min on a CI runner
    # (nightly-sweep.yml:228 measured it >25 min on its first run), T3 adds the
    # Postgres app builds, and the full clean-slate example-sweep — build AND
    # run every example incl. the FFI/Std.Db ones — is ~60 min in the nightly
    # (nightly-sweep.yml:44-48). Sized to hold all of them, not to a single tier.
    timeout-minutes: 180
    # T3 (harness --tier t3) drives the Layer-2 app gates, two of which
    # (`apps-ledger-postgres`, `apps-dispatch-postgres`) need a REAL PostgreSQL.
    # This service mirrors nightly-sweep.yml's `harness-t3` job VERBATIM (same
    # image, credentials, health-check) so the DSN the gates read is the one that
    # job already proves works. It is ADDITIONAL to the apt-installed
    # postgresql-16 below: that one backs the shared-cluster live tests via
    # SKY_POSTGRES_BIN (each spins up its own cluster in a temp dir); this
    # container backs the T3 DSN on localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `test-rest` shelled out to a real `go build` with no toolchain pin,
      # which meant it silently tested whatever Go the runner image happened to
      # ship. Pin it here for the same reason the build job does.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Neovim is a DECLARED dependency of the `lsp` harness gate, which joined
      # the registry on 2026-08-12. Without it that gate reports 0 assertions
      # and the harness fails — correctly, since a gate that cannot run has not
      # passed. Installing it here is what makes the release gate able to run
      # the editor-parity suite at all.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      # The live environment, for the same reason `test-rest` now provisions it:
      # the shared-cluster security tests need a real PostgreSQL, and without
      # one they used to return and report `ok`. A release gate is the last
      # place that should be counting tests that did not run.
      - name: PostgreSQL + sqlite3 for the live tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 sqlite3
          for b in initdb pg_ctl postgres; do
            [ -x "/usr/lib/postgresql/16/bin/$b" ] || {
              echo "::error::missing /usr/lib/postgresql/16/bin/$b" >&2; exit 1; }
          done

      - name: Workspace tests
        working-directory: rust
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          SKY_LIVE_TESTS: require
        run: cargo test --workspace --locked

      # Release-built, deliberately. `preflight-tag.sh:70-74` records the
      # measurement: an unoptimised xtask made these ~10x slower, and `reject`
      # alone measured 780 s debug against 74 s release for an IDENTICAL
      # verdict. CI never got that fix; it gets it here.
      - name: Corpus gates
        working-directory: rust
        run: |
          set -euo pipefail
          for g in roundtrip resolve infer reject fuzz repro; do
            echo "── xtask $g ──"
            cargo run --release --locked -q -p xtask -- "$g"
          done
          # coerce-floor: five golden rows are examples whose GENERATED FFI
          # surface (sky-ffi/, .skydeps/) is .gitignored — 03-tea-external,
          # 05-mux-server, 08-notes-app, 11-fyne-stopwatch, 13-skyshop. This gate
          # job does not build that surface, so the rows are unmeasurable here
          # and the default gate fails on them. SKY_LIVE_TESTS=skip downgrades
          # the shortfall to a loud UNMEASURED block (nightly-sweep measures all
          # 61 with the FFI installed). This masking was latent until the
          # ETXTBSY fix let the gate step run past the workspace tests.
          echo "── xtask coerce-floor (SKY_LIVE_TESTS=skip: FFI-gitignored rows) ──"
          SKY_LIVE_TESTS=skip cargo run --release --locked -q -p xtask -- coerce-floor

      - name: Codegen build + run
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- build-run --all
          cargo run --release --locked -q -p xtask -- build-run --shape cli --run --golden

      # The harness is the only runner here that CANNOT report a false green: a
      # gate that did not execute renders NOT RUN, the suite renders UNKNOWN,
      # and UNKNOWN exits 3. `--require-proofs` additionally demotes a PASS
      # whose falsifying mutation has not been verified inside its declared
      # window to UNPROVEN, which is also non-zero. A release should not ship
      # behind a gate nobody has proven can fail.
      # The harness gates that drive real projects (`apps-*`, `sky-suites`)
      # invoke the INSTALLED compiler at `sky-out/sky`. Without it they report
      # VACUOUS — "the gate reported zero assertions … A gate that cannot run
      # has not passed" — and the harness fails, which is exactly what it should
      # do and exactly what it did on the first v0.20.0 tag: eight gates
      # VACUOUS, publication blocked, four platform binaries built for nothing.
      #
      # The gates were right; this job was incomplete. `scripts/build.sh` is
      # what puts a compiler where they look.
      - name: Install the compiler the app gates drive
        working-directory: .
        run: bash scripts/build.sh

      - name: Gate harness (T1) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t1 --require-proofs

      # T2 — the behavioural corpus. This is the tier that caught the v0.21.0
      # `record_update` codegen regression the MORNING AFTER the release, because
      # it ran ONLY in the nightly (nightly-sweep.yml's `behaviour-corpus` job).
      # §0.2.1 exists precisely because a gate we own found a defect one tier too
      # late. It `go build`s AND RUNS every combinatorial fixture. Nightly runs it
      # as bare `--tier t2`; `--require-proofs` is added here to match the rigor
      # of the T1 line above (a release must not ship behind a lapsed proof).
      - name: Gate harness (T2 — behaviour-corpus, build+run every fixture) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t2 --require-proofs

      # T3 — the Layer-2 app tier. `apps-ledger-postgres` / `apps-dispatch-postgres`
      # read the DSN below (the service container declared at job level); the
      # values mirror nightly-sweep.yml's `harness-t3` job VERBATIM. Set on the
      # STEP, not the job, so the earlier workspace/live tests — which stand up
      # their OWN cluster via SKY_POSTGRES_BIN — are not handed this DSN.
      - name: Gate harness (T3 — Layer-2 app tier on Postgres) with proof requirement
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --tier t3 --require-proofs

      # T4 is the PRE-RELEASE tier — the one whose whole purpose is to run
      # exactly here — and it was invoked by nothing at all. Gate selection is
      # exact tier equality (`harness/mod.rs`, `g.tier == o.tier`), so the
      # `--tier t1` line above cannot reach it, and no other harness call
      # existed in the repo. `apps-ffi-scale` (the 76k-symbol FFI benchmark)
      # was therefore registered, budgeted, and never executed.
      #
      # Found by the Judge reviewing the fix for the SAME defect at T2, which
      # is the argument for running whole tiers rather than named gates: a gate
      # added at T4 later is picked up here instead of silently joining the set
      # nothing runs.
      - name: Gate harness (T4 — pre-release tier)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t4

      # Falsifier verification — the deepest check in the repo. `--require-proofs`
      # on the tier lines above DEMOTES a PASS whose proof lapsed, but only this
      # run ESTABLISHES that a gate's declared mutation still reddens it. It ran
      # ONLY in the nightly (nightly-sweep.yml's `falsifier-verification` job).
      # Scoped to `--tier t1` exactly as nightly does: the merge-blocking tier
      # whose proofs the per-push safety net leans on. It rewrites
      # falsifier-proofs.json in the workspace; this job does not commit it.
      - name: Falsifier verification (T1 mutations still bite)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --tier t1

      # The FULL clean-slate example sweep — build AND run every example from a
      # wiped slate, INCLUDING the FFI / Std.Db / real-SDK examples (skyshop's
      # 76k-symbol cold `sky install`, Fyne, embedded Postgres). This is the
      # other gate §0.2.1 names by hand: it ran ONLY in the nightly
      # (nightly-sweep.yml's `example-sweep` job). No `--build-only` — the sweep
      # must RUN each binary, not just compile it. The compiler at `sky-out/sky`
      # was installed by the `bash scripts/build.sh` step above (the sweep
      # resolves that path and refuses a stale one via require_fresh_compiler),
      # and it does the per-example FFI `sky install` itself.
      - name: Full example sweep (clean-slate build AND run of every example, incl. FFI/Std.Db)
        working-directory: .
        run: scripts/example-sweep.sh

      # Denominator + ledger + config-migration ratchets. These do not test the
      # compiler; they assert that the coverage + config-migration claims shipped
      # alongside it are still true and still current. A release is exactly when a
      # stale ledger does the most damage. `config-migration --check` is the
      # legacy→withX migration census (§0.2.1 step 2); it runs in no per-commit
      # job, so a release is the only place it is gated.
      - name: Coverage ratchets
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- denominators --check
          cargo run --release --locked -q -p xtask -- coverage-ledger --check
          cargo run --release --locked -q -p xtask -- config-migration --check

  # ────────────────────────────────────────────────────────────────
  # Assemble release assets, generate checksums, publish GitHub Release.
  # ────────────────────────────────────────────────────────────────
  release:
    needs: [build, gate]
    runs-on: ubuntu-latest
    # No compilation: download 4 artifacts, checksum, extract CHANGELOG notes,
    # create the Release (asset upload dominates) ≈ 3 min. 1.5x ≈ 5.
    timeout-minutes: 5
    steps:
      # Checkout is required so the CHANGELOG + release-notes extractor are on
      # disk — `sky upgrade` prints the Release body verbatim, so it MUST be the
      # curated CHANGELOG section, never GitHub's auto-generated commit list.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} release/ \;
          ls -la release/

      # ── The gate: the asset set is asserted, not assumed ──────────────────
      # `find … -exec cp` cannot fail the step when it copies nothing (find
      # exits 0 on an empty result), and upload-artifact was `if-no-files-found:
      # ignore`, so a matrix leg that produced no archive vanished silently and
      # the Release published a PARTIAL asset set, green. `sky upgrade` then
      # 404s for whichever platform went missing.
      #
      # This list is the release contract and must match the build matrix above.
      - name: Assert the complete asset set is present
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            sky-linux-x64.tar.gz
            sky-linux-arm64.tar.gz
            sky-darwin-arm64.tar.gz
            sky-windows-x64.zip
          )
          missing=()
          for f in "${EXPECTED[@]}"; do
            [ -s "release/$f" ] || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release is missing required asset(s): ${missing[*]}" >&2
            find release -maxdepth 1 -type f -exec basename {} \; >&2
            exit 1
          fi
          # Nothing unexpected either — an extra/renamed asset means the build
          # matrix and this contract have drifted apart.
          actual=$(find release -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')
          want=$(printf '%s\n' "${EXPECTED[@]}" | sort | tr '\n' ' ')
          if [ "$actual" != "$want" ]; then
            echo "::error::asset set drift. want: $want" >&2
            echo "got : $actual" >&2
            exit 1
          fi
          echo "asset set complete: $want"

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG
        run: |
          # Hard gate: fails the release if the tag has no matching CHANGELOG
          # section, so a tag can never ship empty upgrade notes.
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > NOTES.md
          echo "----- release body for ${GITHUB_REF_NAME} -----"
          cat NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: release/*

  # ────────────────────────────────────────────────────────────────
  # Multi-arch Docker image (amd64 + arm64) built from the Dockerfile.
  # ────────────────────────────────────────────────────────────────
  docker:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    # The Dockerfile compiles nothing — it apt-installs curl/git and downloads
    # the released binary. Cost is the arm64 leg under QEMU emulation (~5-8 min)
    # plus the asset-propagation retry loop (up to ~2 min per platform) ≈ 12 min.
    # 1.5x ≈ 20. `continue-on-error` means a hit here won't fail the release.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Pin the version explicitly so the image build never falls back to
          # the unauthenticated GitHub `releases/latest` API call inside the
          # Dockerfile. That fallback fires once PER platform (amd64 + arm64
          # under QEMU) and hit the 60/hr unauthenticated rate limit, failing
          # the multi-arch build even after the release assets were live. The
          # tag is already known here (this job `needs: release`), so pass it
          # straight through — deterministic, no network guesswork.
          build-args: |
            SKY_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            anzel/sky:latest
            anzel/sky:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
