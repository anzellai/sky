          neovim: 'true'
      - name: Gate harness (T1 shard 2/3 — sky-verify, sky-suites, lsp, Std.Ai, fmt-clean) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t1 --require-proofs --only sky-verify,sky-suites,lsp,ai-train-resume,ai-train-exactly-once,ai-serve-hot-load,ai-device-decide,ai-device-no-silent-fallback,ai-device-digest,ai-stream-pieces,ai-device-blob-allowlist,spa-wasm-server-only,fmt-clean
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  gate-t1-3:
    runs-on: ubuntu-latest
    # The harness runs this job's gates one after another: their summed budget
    # plus ~15 min of setup must fit, or a slow gate ends as a cancelled job
    # instead of a harness verdict (G-18; `e2e_scripts_are_gated.rs` checks it).
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          neovim: 'true'
      - name: Gate harness (T1 shard 3/3 — Layer-2 apps and CLI verbs) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t1 --require-proofs --only apps-bundled,cli-verbs,apps-ledger,apps-dispatch,apps-dispatch-destructive,apps-relay,config-matrix,build-growth-linear
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh


  # gate-buildrun — the codegen build+run sweep, SHARDED 2 ways. Each shard
  # emits + `go build`s a DISJOINT half of every example (`--shard=N/2`) and
  # RUNS the CLI subset against its committed golden. This is the proven rust-ci
  # `build-corpus` pattern; `build_run_gate::shards_are_disjoint_and_total`
  # proves the halves union to the whole corpus with nothing gated twice or
  # dropped. Moved out of gate-core, where it was the step that overran 44 min.
  # Three shards ran 111-367 s each after a 2-2.5 min setup (release run
  # 38764879819), so a third runner bought little and held one of the 40
  # concurrent jobs; two shards are ~5-6 min of building each.
  gate-buildrun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      # The composite's free-disk default makes sure the job starts with room
      # before the sweep fills the go-build cache (it reclaims OS junk only when
      # the runner is short). No `go clean -cache` — the sweep repopulates
      # only what its third needs, and a warm cache is the whole point.
      - name: Codegen build + run (shard ${{ matrix.shard }}/2)
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- build-run --all --shard=${{ matrix.shard }}/2
          cargo run --release --locked -q -p xtask -- build-run --shape cli --run --golden --shard=${{ matrix.shard }}/2

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-t2-corpus — the behavioural corpus, as its four shard gates
  # (`corpus-1` … `corpus-4`, each the cases whose index is k mod 4). This is
  # the tier that caught the v0.21.0 `record_update` codegen regression the
  # MORNING AFTER the release, because it ran ONLY in the nightly (§0.2.1). It
  # `go build`s AND RUNS every combinatorial fixture. The whole corpus ran in
  # 422 s at 530 cases (release run 38922351710), so the four shards share one
  # runner; a shard gate per job is the step to take if that stops holding.
  # The OTHER T2 gates run in gate-t2-rest. `--require-proofs` matches the
  # rigor of the T1 line.
  gate-t2-corpus:
    runs-on: ubuntu-latest
    # Four shard budgets of 1200 s (registry.rs). The harness runs this job's
    # gates one after another: their summed budget plus ~15 min of setup must
    # fit, or a slow gate ends as a cancelled job instead of a harness verdict
    # (G-18; `e2e_scripts_are_gated.rs` checks it). 80 + 15 = 95.
    timeout-minutes: 95
    env:
      GO_CACHE_BUDGET_MB: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup

      - name: Gate harness (T2 — corpus shards 1-4, build+run every fixture) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t2 --only corpus-1,corpus-2,corpus-3,corpus-4 --require-proofs

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-t2-rest — the remaining T2 gates: spa-diff-fuzz, corpus-isolation,
  # corpus-witness, apps-fieldbook, build-new-dir-compiles-nothing,
  # ai-device-partition. Union with gate-t2-corpus = the whole T2 tier. spa-diff-fuzz + apps-fieldbook drive the installed compiler
  # (sky-out/sky), which the composite installs. `--require-proofs` retained.
  gate-t2-rest:
    runs-on: ubuntu-latest
    # The harness runs this job's gates one after another: their summed budget
    # plus ~15 min of setup must fit, or a slow gate ends as a cancelled job
    # instead of a harness verdict (G-18; `e2e_scripts_are_gated.rs` checks it).
    # 4,800 s of budgets (ai-device-partition 600 s since v0.28.0) + 15 = 95.
    timeout-minutes: 95
    env:
      GO_CACHE_BUDGET_MB: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup

      - name: Gate harness (T2 — isolation / witness / spa-diff-fuzz / fieldbook / ai-device-partition) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t2 --only corpus-isolation,corpus-witness,spa-diff-fuzz,apps-fieldbook,build-new-dir-compiles-nothing,ai-device-partition --require-proofs

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-app — the Layer-2 app tier (T3) + the pre-release tier (T4).
  # `apps-ledger-postgres` / `apps-dispatch-postgres` (T3) read the DSN below
  # (the service container declared at job level); the values mirror
  # nightly-sweep.yml's `harness-t3` job VERBATIM. T4 (`apps-ffi-scale`, the
  # 76k-symbol FFI benchmark) is the pre-release tier whose whole purpose is to
  # run exactly here.
  gate-app:
    runs-on: ubuntu-latest
    # T3 + T4 (the 76k-symbol FFI benchmark) + the heavy `#[ignore]`d real-DB
    # leg the nightly runs with a 90-min ceiling. 75 keeps ~1.5x over the three.
    timeout-minutes: 75
    # T3 needs a REAL PostgreSQL. This service mirrors nightly-sweep.yml's
    # `harness-t3` job VERBATIM (same image, credentials, health-check) so the
    # DSN the gates read is the one that job already proves works. It is
    # ADDITIONAL to the runner's PostgreSQL (resolved by the composite): that one
    # backs the shared-cluster live tests via SKY_POSTGRES_BIN (each spins up its
    # own cluster in a temp dir); this container backs the T3 DSN on
    # localhost:5432.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'

      # T3 — the Layer-2 app tier. Set the DSN on the STEP, not the job, so the
      # earlier live tests — which stand up their OWN cluster via
      # SKY_POSTGRES_BIN — are not handed this DSN.
      - name: Gate harness (T3 — Layer-2 app tier on Postgres) with proof requirement
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --tier t3 --require-proofs

      # T4 is the PRE-RELEASE tier — the one whose whole purpose is to run
      # exactly here. Gate selection is exact tier equality, so the `--tier t1`
      # line in gate-core cannot reach it. The Std.Ai.Device T4 gates need
      # browsers, the device engines and a simulator, so they run in
      # gate-ai-device-web and gate-ai-device-native instead.
      - name: Gate harness (T4 — pre-release tier)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t4 --only apps-ffi-scale

      # `ai_memory_pg_flow` needs the pgvector extension in the PostgreSQL the
      # gate-setup composite resolved (it does not install pgvector). The
      # resolver installs `postgresql-<major>-pgvector` for the major it found
      # and fails if vector.control is absent. The nightly job does the same.
      - name: pgvector for the real-DB e2e leg
        run: bash "$GITHUB_WORKSPACE/scripts/ci/resolve-postgres.sh" --pgvector

      # The heavy real-DB e2e leg: the `#[ignore]`d sky-crate tests (nightly
      # harness-t3 runs the same line). They drive real clusters, so they sit
      # with the Postgres tier.
      - name: Heavy real-DB e2e leg (sky crate `#[ignore]`d tests)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        # The Android emulator test runs in gate-native-android (it needs a
        # running emulator); skip it here by name. The `gcp_live_*` tests
        # rent cloud GPUs: they run only through scripts/ai/gcp-live.sh (the
        # ai-cloud-live workflow, with a spend confirmation), never here.
        run: cargo test -p sky --locked -- --ignored --skip android_emulator --skip gcp_live_

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ════════════════════════════════════════════════════════════════════════
  # gate-falsifiers-1..10 — the falsifier verification. `--require-proofs` on
  # the tier lines DEMOTES a PASS whose proof lapsed, but only these runs
  # ESTABLISH that each gate's declared mutation still reddens it. `--all`:
  # nothing is carried from the checked-in proof ledger. The union of the
  # `--only` lists is every gate the registry declares, bar the self-tests and
  # a blocked gate, which have no baseline to falsify; the canary runs in every
  # group. `workflows_parse::the_release_workflow_is_the_full_suite` checks the
  # union, and that a gate split by `--mutation` runs every declared mutation.
  #
  # PACKING (measured per gate in release run 38764879819, baseline plus
  # mutations): lsp 461 s, spa-diff-fuzz 382, apps-ffi-scale 346, build-growth
  # 312, build-new-dir 308, config-matrix 236, conformance 220, corpus-reject
  # 174, cli-verbs 155, kernel-members 134, apps-fleet 122, the rest under
  # 110 s; 66 min in all, plus the corpus at 1,256 s. The old groups followed
  # the tiers and ran 9-25 min; these are packed longest-first into about
  # 9.5 min of proofs each, within three environment classes:
  #   1-5  T1 and T4, the runner's PostgreSQL binaries (the apps-* T1 gates
  #        stand up their own clusters); group 1 adds Neovim for `lsp`.
  #   6-7  T2 and T3, the PostgreSQL service and its DSN (as gate-app).
  #   8-9  the T2 behavioural corpus, one job per mutation (`--mutation`). Each
  #        runs the baseline and one mutated build+run of every case; together
  #        they are the whole proof, and neither records a partial one.
  # ════════════════════════════════════════════════════════════════════════
  gate-falsifiers-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          neovim: 'true'
      - name: Falsifier verification (group 1)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only lsp,erasure-path-uses-an-index,console-analytics-queries-are-bounded,analytics-prune-errors-are-reported,apps-dispatch-destructive,roundtrip,sky-fmt-check,stdlib-bodies

  gate-falsifiers-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          # apps-ffi-scale drives a cold `sky install` of the 76k-symbol FFI
          # surface: restore the FFI module cache the nightly sweep writes.
          go-cache-family: go-sweep
      - name: Falsifier verification (group 2)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only apps-ffi-scale,config-surface,analytics-retention-survives-a-panic,apps-dispatch,corpus-manifest

  gate-falsifiers-3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 3)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only build-growth-linear,kernel-members,verify-cli,live-time-every-mutex-survives-a-panic,periodic-loops-recover-per-cycle,jobs-complete-failure-is-reported,config-migration

  gate-falsifiers-4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 4)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only config-matrix,cli-verbs,corpus-emit-shape,sky-verify,apps-ledger,apps-bundled,config-migrate
      # Denominator + ledger + config-migration ratchets. These do not test the
      # compiler; they assert that the coverage + config-migration claims shipped
      # alongside it are still true and still current. `config-migration --check`
      # is the legacy→withX migration census (§0.2.1 step 2); it runs in no
      # per-commit job, so a release is the only place it is gated.
      - name: Coverage ratchets
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- denominators --check
          cargo run --release --locked -q -p xtask -- coverage-ledger --check
          cargo run --release --locked -q -p xtask -- config-migration --check
          cargo run --release --locked -q -p xtask -- config-surface --check

  gate-falsifiers-5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 5)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only conformance,corpus-reject,sky-suites,shared-world,apps-relay,reject,coverage-ledger

  gate-falsifiers-6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 6 — T2 and T3 on Postgres)
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only spa-diff-fuzz,corpus-witness,corpus-isolation,apps-ledger-postgres,apps-fieldbook

  gate-falsifiers-7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 7 — T2 and T3 on Postgres)
        working-directory: rust
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
          DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only build-new-dir-compiles-nothing,apps-fleet,apps-dispatch-postgres

  gate-falsifiers-8:
    runs-on: ubuntu-latest
    # Two corpus shard gates, each a baseline and two mutated runs over a
    # quarter of the cases: one and a half passes over the corpus in all.
    # The baseline and both mutations of the whole corpus took 1,256 s in one
    # job (release run 38764879819). About 1.5x with setup.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - name: Falsifier verification (group 8 — the T2 behavioural corpus, shards 1 and 2)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only corpus-1,corpus-2

  gate-falsifiers-9:
    runs-on: ubuntu-latest
    # As group 8, for the other two shards.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - name: Falsifier verification (group 9 — the T2 behavioural corpus, shards 3 and 4)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only corpus-3,corpus-4

  # gate-falsifiers-10 — the Std.Ai gates (v0.28.0) and fmt-clean: the T1
  # training, serving, device and streaming gates and the T2
  # ai-device-partition. The runner's PostgreSQL binaries, as groups 1-5. The
  # device browser and simulator gates are proven in their own jobs.
  gate-falsifiers-10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
      - name: Falsifier verification (group 10 — Std.Ai and fmt-clean)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only ai-train-resume,ai-train-exactly-once,ai-serve-hot-load,ai-device-decide,ai-device-no-silent-fallback,ai-device-digest,ai-stream-pieces,ai-device-blob-allowlist,ai-device-partition,spa-wasm-server-only,fmt-clean
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-ai-local — the real managed engine with zero configuration, and a
  # draft model and named LoRA adapters on it (draft_and_named_adapters_on_
  # the_real_engine; the adapters run on the synthetic Qwen2 model that
  # `go run ./cmd/sky-tiny-gguf` writes, so nothing more is fetched)
  # (rust/crates/sky/tests/ai_local_live.rs). The sliced core-sky runs exclude
  # it (rust/.config/nextest.toml, default-filter), so the model is fetched and
  # cached in this one job. Same job as rust-ci.yml `ai-local-live`.
  gate-ai-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          install-compiler: 'false'
      # Restore only: rust-ci `ai-local-live` saves it on main.
      - name: Restore the Std.Ai engine and development model (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.sky-ai/engines
            ${{ github.workspace }}/.sky-ai/models
          key: sky-ai-home-${{ runner.os }}-${{ hashFiles('runtime-go/rt/ai_pins.go') }}
      - name: sqlite3 and brotli for the sky crate's tests
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ensure-tools.sh" sqlite3 brotli
      - name: Std.Ai live end to end (real llama-server, zero configuration)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked --test ai_local_live -- --nocapture
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-ai-train — Std.Ai.Train with real trainer processes and no Python for
  # Mlx or Fake (rust/crates/sky/tests/ai_train_live.rs: the Fake trainer in
  # the runtime, and the native trainer's contract on the tiny model with the
  # linux-x64 bundle), plus the Unsloth driver's Python suites under the
  # pinned CPython. Same job as rust-ci.yml `ai-train-live`.
  gate-ai-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          install-compiler: 'false'
      # Restore only: rust-ci `ai-train-live` saves it on main.
      - name: Restore the Std.Ai home (engine, model, CPython, trainers; saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.sky-ai/engines
            ${{ github.workspace }}/.sky-ai/models
            ${{ github.workspace }}/.sky-ai/python
            ${{ github.workspace }}/.sky-ai/trainers
          key: sky-ai-train-${{ runner.os }}-${{ hashFiles('runtime-go/rt/ai_pins.go') }}
      - name: sqlite3 and brotli for the sky crate's tests
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ensure-tools.sh" sqlite3 brotli
      - uses: ./.github/actions/sky-trainer
        with:
          platform: linux-x64
          token: ${{ github.token }}
      - name: Std.Ai.Train live (the Fake trainer in the runtime, the native trainer on the tiny model)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked --test ai_train_live -- --nocapture
      - name: The Unsloth driver's Python suites under the pinned CPython
        working-directory: runtime-go
        env:
          SKY_LIVE_TESTS: require
        run: go test -tags ailive ./rt -run TestTheDriverSuitesPassUnderThePinnedCPython -count=1 -timeout 15m -v
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-ai-train-mlx — a real QLoRA run with the native trainer (sky-trainer,
  # MLX through mlx-c), killed and resumed, served and evaluated
  # (rust/crates/sky/tests/ai_train_native_live.rs), with the darwin-arm64
  # bundle .github/actions/sky-trainer provides. MLX runs on the CPU
  # (SKY_AI_ACCEL=cpu): the runner has no usable Metal device. Same job as
  # rust-ci.yml `ai-train-mlx-live`.
  gate-ai-train-mlx:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
      SKY_AI_ACCEL: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-macos
          save-if: 'false'
      # Restore only: rust-ci `ai-train-mlx-live` saves it on main.
      - name: Restore the Std.Ai home (engine, model, trainer, base; saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.sky-ai/engines
            ${{ github.workspace }}/.sky-ai/models
            ${{ github.workspace }}/.sky-ai/trainers
            ${{ github.workspace }}/.sky-ai/bases
          key: sky-ai-train-mlx-${{ runner.os }}-${{ hashFiles('runtime-go/rt/ai_pins.go', 'sky-stdlib/Std/Ai/Train.sky') }}
      - name: brotli for the sky crate's tests
        run: command -v brotli >/dev/null || brew install brotli
      - uses: ./.github/actions/sky-trainer
        with:
          platform: darwin-arm64
          token: ${{ github.token }}
      - name: Std.Ai.Train live (MLX on Apple silicon)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked --test ai_train_native_live -- --nocapture

  # gate-ai-device-web — Std.Ai.Device in real browsers
  # (scripts/ai-device-e2e.sh, docs/ai/device.md): the web engine is built
  # here from the pinned llama.cpp source (scripts/ai/device/
  # build-device-bundles.sh, the script the ai-device-bundles workflow runs),
  # installed with `sky ai provision --device web --from`, and the probe runs
  # the synthetic Qwen2 model on the CPU engine in Chromium and WebKit under
  # the strict policy: the download, the device answer with no call reaching
  # the server, a private WebKit window answered by the server, the operator's
  # server placement, and DeviceOnly refused typed. The WebGPU engine needs a
  # GPU with shader-f16 (a local run: `scripts/ai-device-e2e.sh --webgpu`).
  gate-ai-device-web:
    runs-on: ubuntu-latest
    # The emsdk install (~4 min), the two engine builds (~12 min), the
    # fixture build (~4 min), five browser runs (~6 min), and the privacy and
    # strict-policy gates (~12 min) and their falsifiers (a baseline and a
    # mutated e2e each, ~25 min): 100.
    timeout-minutes: 100
    env:
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - uses: ./.github/actions/playwright-setup
      # Restore only: a release saves no cache.
      - name: Restore the Std.Ai home (the server's engine)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sky-ai/engines
          key: sky-ai-engines-${{ runner.os }}-${{ hashFiles('runtime-go/rt/ai_pins.go') }}
      - name: Build the web engine from the pinned source
        timeout-minutes: 25
        run: |
          set -euo pipefail
          type -P ninja >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build; }
          curl -fsSL -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11200.tar.gz
          echo "77d9d947e1dbdbe3eccc95ae10fa5d6abf48dc3395a84673f67d59b6364b6a94  $RUNNER_TEMP/llama.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/src" && tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/src"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12 && "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
          curl -fsSL -o "$RUNNER_TEMP/dawn.zip" https://github.com/google/dawn/releases/download/v20260423.175430/emdawnwebgpu_pkg-v20260423.175430.zip
          echo "3ad7ebe95a4a20764df46c5a63b0ad489782aee26804fff8511d9797c10e732f  $RUNNER_TEMP/dawn.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/dawn" && unzip -q "$RUNNER_TEMP/dawn.zip" -d "$RUNNER_TEMP/dawn"
          ./scripts/ai/device/build-device-bundles.sh web --llama-src "$RUNNER_TEMP/src/llama.cpp-b11200" \
            --out "$RUNNER_TEMP/engines" --emsdk "$RUNNER_TEMP/emsdk" --emdawnwebgpu "$RUNNER_TEMP/dawn/emdawnwebgpu_pkg"
          ./sky-out/sky ai provision --device web --from "$RUNNER_TEMP/engines"
          ./sky-out/sky ai provision
      - name: Std.Ai.Device browser e2e (Chromium + WebKit, strict CSP, synthetic model)
        timeout-minutes: 25
        run: scripts/ai-device-e2e.sh
      - name: Gate harness (T4 — the device privacy and strict-policy gates)
        timeout-minutes: 25
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t4 --only ai-device-privacy,ai-device-csp
      # The privacy and strict-policy gates' falsifiers need these browsers
      # and this engine, so they are proven here, not in a gate-falsifiers job.
      - name: Falsifier verification (the device browser gates)
        timeout-minutes: 60
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only ai-device-privacy,ai-device-csp
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-ai-device-native — Std.Ai.Device in the iOS simulator and the macOS
  # desktop app (rust/crates/sky/tests/ai_device_native_flow.rs): the iOS
  # engine (SkyLlama.xcframework) is built here from the pinned source and
  # installed with `--from`; the probe downloads the synthetic model from its
  # backend, checks it and answers on the device's own llama.cpp.
  gate-ai-device-native:
    runs-on: macos-15
    timeout-minutes: 140
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      # Restore only: main writes these. See gate-native.
      - name: Restore the Go build + module cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-macos-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-macos
          save-if: 'false'
      - name: Build sky and the iOS engine from the pinned source
        timeout-minutes: 40
        run: |
          set -euo pipefail
          brew install ninja
          command -v brotli >/dev/null || brew install brotli
          ./scripts/build.sh
          curl -fsSL -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11200.tar.gz
          echo "77d9d947e1dbdbe3eccc95ae10fa5d6abf48dc3395a84673f67d59b6364b6a94  $RUNNER_TEMP/llama.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/src" && tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/src"
          ./scripts/ai/device/build-device-bundles.sh ios --llama-src "$RUNNER_TEMP/src/llama.cpp-b11200" --out "$RUNNER_TEMP/engines"
          ./sky-out/sky ai provision --device ios --from "$RUNNER_TEMP/engines"
          ./sky-out/sky ai provision
      - name: iOS simulator and desktop:mac on-device runs
        timeout-minutes: 30
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked --test ai_device_native_flow -- --ignored --test-threads=1 --skip android
      - name: Gate harness (T4 — the iOS simulator gate)
        timeout-minutes: 30
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo run --release --locked -q -p xtask -- harness --tier t4 --only ai-device-ios-sim
      - name: Falsifier verification (the iOS simulator gate)
        timeout-minutes: 40
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
        run: cargo run --release --locked -q -p xtask -- harness --verify-falsifiers --all --only ai-device-ios-sim

  # gate-ai-device-android — the Android counterpart on an x86_64 emulator
  # with KVM: the JNI engine for x86_64 is built here (NDK 27.0.12077973) and
  # the probe answers on the device.
  gate-ai-device-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      SKY_AI_HOME: ${{ github.workspace }}/.sky-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      # Restore only: main writes these. See gate-native.
      - name: Restore the Go build + module cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-linux-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build sky and the Android engine from the pinned source
        timeout-minutes: 40
        run: |
          set -euo pipefail
          type -P ninja >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build; }
          ./scripts/build.sh
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/llama.tar.gz" https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11200.tar.gz
          echo "77d9d947e1dbdbe3eccc95ae10fa5d6abf48dc3395a84673f67d59b6364b6a94  $RUNNER_TEMP/llama.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/src" && tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/src"
          ./scripts/ai/device/build-device-bundles.sh android --llama-src "$RUNNER_TEMP/src/llama.cpp-b11200" \
            --out "$RUNNER_TEMP/engines" --android-sdk "$ANDROID_HOME"
          ./sky-out/sky ai provision --device android --from "$RUNNER_TEMP/engines"
          cd rust && cargo test -p sky --locked --test ai_device_native_flow --no-run
      - name: Android emulator on-device run
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SKY_LIVE_TESTS: require
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: cd rust && cargo test -p sky --locked --test ai_device_native_flow -- --ignored --test-threads=1 android

  # gate-race — the Go runtime under the race detector against a live
  # PostgreSQL, plus the `integration`-tagged Postgres session-store tests.
  # Mirrors rust-ci's `integration-postgres` (which explains why `-race` needs
  # cgo and why the embedded-supervisor tests need real binaries on the runner).
  gate-race-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      - name: Restore the race-build Go cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-race-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-race-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-race-linux-
      - name: PostgreSQL binaries for the embedded supervisor
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/resolve-postgres.sh"
      - name: Postgres session-store integration tests
        working-directory: runtime-go
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: CGO_ENABLED=0 go test -tags integration ./rt/ -run Postgres -v
      # The rt tests that run the embedded browser clients need node; a
      # missing one fails them (runtime-go/rt/live_gate_test.go).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # SHARDED by test, as rust-ci integration-postgres: this job runs shard
      # 1/2 and gate-race-2 runs 2/2 of the same list (scripts/ci/go-test-shard.sh).
      - name: rt tests under the race detector, with a live PostgreSQL (shard 1/2)
        working-directory: runtime-go
        # The DSN-gated live tests fail, never skip, without it (G-8,
        # runtime-go/rt/live_gate_test.go); the job's postgres service is it.
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: CGO_ENABLED=1 bash ../scripts/ci/go-test-shard.sh 1/2 ./rt/... -- -race -timeout 20m -count=1
      # Every Go test package under tools/ runs here
      # (workflows_parse.rs::every_go_test_package_under_tools_runs_in_ci).
      - name: tools Go tests (sky-ffi-inspect, skyliveload)
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE/tools/sky-ffi-inspect" && CGO_ENABLED=0 go test ./... -count=1)
          (cd "$GITHUB_WORKSPACE/tools/skyliveload" && CGO_ENABLED=0 go test ./... -count=1)

  # gate-race-2 — shard 2/2 of the race run of the rt tests (see gate-race-1).
  # The integration-tagged store tests and the tools tests run in gate-race-1.
  gate-race-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      - name: Restore the race-build Go cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-race-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-race-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-race-linux-
      - name: PostgreSQL binaries for the embedded supervisor
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/resolve-postgres.sh"
      # The rt tests that run the embedded browser clients need node; a
      # missing one fails them (runtime-go/rt/live_gate_test.go).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # Shard 2/2 (scripts/ci/go-test-shard.sh).
      - name: rt tests under the race detector, with a live PostgreSQL (shard 2/2)
        working-directory: runtime-go
        # The DSN-gated live tests fail, never skip, without it (G-8,
        # runtime-go/rt/live_gate_test.go); the job's postgres service is it.
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: CGO_ENABLED=1 bash ../scripts/ci/go-test-shard.sh 2/2 ./rt/... -- -race -timeout 20m -count=1



  # gate-web-1..4 — the browser tier and the e2e scripts: every Sky.Live /
  # Http.Server example driven in real Chromium (verify-all-web.sh, incl. the
  # console e2e, ui-showcase and the resilience holds), the Sky.Spa wasm client
  # e2e, the terminal loops in a pty, DOM identity, the Sky.Live client and the
  # Std.Ui forms. Mirrors nightly-sweep.yml's `web-runtime` job; before these
  # jobs none of it ran at a release.
  #
  # SPLIT FOUR WAYS. As one job (`gate-web`) its fifteen steps ran one after
  # another for 41 minutes (release run 38764879819: console live 579 s, Spa Msg
  # order 376 s, verify-all-web 353 s, Spa wasm 284 s, canvas 187 s, CSP 122 s,
  # live client 113 s, controls 91 s, the rest under 45 s each), the longest
  # job of the release. The scripts share nothing but the installed compiler
  # and the browsers: each builds its own fixtures and frees its own ports. So
  # they are packed longest-first into four jobs of about 8-10 minutes of
  # scripts each. Every script still runs, exactly once, in a job `release:`
  # needs: `e2e_scripts_are_gated.rs` checks that every scripts/*-e2e.sh runs in
  # a gating job and in only one, and `workflows_parse.rs` pins the four jobs.
  #
  # Each step keeps its own timeout-minutes, about twice its slowest green run
  # (bfc8a16c, 7292ef57, 218f4d21), so a hung script fails its own named step,
  # with its log, instead of the job being cancelled at the job limit with no
  # log at all (run 36942837671, step 7). The job limit is the summed step
  # limits plus ~15 min of setup.
  gate-web-1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - uses: ./.github/actions/playwright-setup
      - uses: ./.github/actions/install-caddy
      - name: Sky Console live data + reconnect e2e (direct + behind Caddy)
        timeout-minutes: 22
        run: scripts/console-live-e2e.sh
      - name: Sky.Live without cookies e2e (header session transport, strict CSP)
        timeout-minutes: 5
        run: scripts/header-session-e2e.sh
      - name: Std.Ui forms + keydown + pub/sub e2e (Sky.Live + Sky.Spa)
        timeout-minutes: 5
        run: scripts/ui-forms-e2e.sh
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-web-evidence-1
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14

  gate-web-2:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - uses: ./.github/actions/playwright-setup
      - uses: ./.github/actions/install-caddy
      - name: Browser runtime verification (Sky.Live + Http.Server + resilience)
        timeout-minutes: 15
        run: scripts/verify-all-web.sh
      - name: Strict Content-Security-Policy e2e (Console, Sky.Live, Sky.Spa)
        timeout-minutes: 8
        run: scripts/csp-e2e.sh
      - name: Sky Console controls e2e (every control; embedded, dev, hub; Chromium + WebKit)
        timeout-minutes: 25
        # Every tab, range chip, level toggle, search, pivot, console link,
        # auto-refresh and sign-in/out, with the rows, the URL, the read's
        # parameters and the server's answer asserted.
        run: scripts/console-controls-e2e.sh
      - name: Widget islands e2e (Sky.Live + Sky.Spa, strict CSP)
        timeout-minutes: 5
        run: scripts/islands-e2e.sh
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-web-evidence-2
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14

  gate-web-3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - uses: ./.github/actions/playwright-setup
      - name: Sky.Spa Msg order + client WebSocket + sign-out e2e (Chromium + WebKit, strict CSP)
        timeout-minutes: 18
        # Each Msg runs once, in arrival order, as on Sky.Live; RPCs overlap; the
        # wasm client holds its own WebSocket; a sky_sid cookie copied before
        # sign-out is refused after it; a transiently failing request is re-sent
        # by the runtime (offline, 503 + Retry-After, a hung request, a hidden
        # page).
        run: |
          set -euo pipefail
          scripts/spa-rpc-order-e2e.sh
          scripts/spa-websocket-e2e.sh
          scripts/session-revocation-e2e.sh
          scripts/spa-resilience-e2e.sh
      - name: Std.Ui canvas, text wrapping + terminal e2e (Sky.Live + Sky.Spa, strict CSP)
        timeout-minutes: 10
        # The terminal-race case runs vim in the terminal, in Chromium and WebKit.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/ensure-tools.sh" vim
          scripts/ui-canvas-terminal-e2e.sh
      - name: Terminal loops pty e2e (terminal:tui + terminal:cli)
        timeout-minutes: 5
        run: scripts/tui-e2e.sh
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-web-evidence-3
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14

  gate-web-4:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
      - uses: ./.github/actions/playwright-setup
      - name: Sky.Spa wasm client e2e (restore, stale handlers, RPC consistency, examples)
        timeout-minutes: 18
        run: |
          set -euo pipefail
          scripts/spa-restore-e2e.sh
          scripts/spa-stale-handler-e2e.sh
          scripts/spa-rpc-consistency-e2e.sh
          scripts/spa-examples-e2e.sh
          scripts/spa-client-crypto-e2e.sh
      - name: Sky.Live client e2e (handler addressing, input authority)
        timeout-minutes: 6
        run: scripts/live-client-e2e.sh
      - name: Sky.Spa + Sky.Live DOM identity e2e
        timeout-minutes: 5
        run: scripts/spa-vdom-identity-e2e.sh
      - name: Std.Nav e2e (pushUrl / replaceUrl / clearFragment, Sky.Live + Sky.Spa, Chromium + WebKit, strict CSP)
        timeout-minutes: 5
        run: scripts/nav-e2e.sh
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-web-evidence-4
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14

  # gate-example-e2e — the behavioural contracts in `examples/*/e2e.json`
  # (`scripts/example-e2e.sh`): CLI steps, HTTP requests and Sky.Live event
  # dispatches with expected output, for the 17 examples that declare one. It
  # ran in no workflow before v0.27.0 (G-9); the script refuses to pass when
  # fewer contracts ran than exist.
  gate-example-e2e:
    runs-on: ubuntu-latest
    # 17 clean builds (13-skyshop's cold FFI install is the long pole) plus the
    # contract steps. 60.
    timeout-minutes: 60
    env:
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          go-cache-family: go-sweep
      - name: Install jq, lsof, sqlite3
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ensure-tools.sh" jq lsof sqlite3
      - name: Example behavioural contracts
        run: scripts/example-e2e.sh
      - name: Install LibreOffice (headless)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui libreoffice-writer-nogui
          type -P soffice
      - name: Std.Office files open in LibreOffice
        timeout-minutes: 10
        # A workbook and a document written by Std.Office.Xlsx / Docx are
        # converted by LibreOffice (a second reader); the formula total is
        # computed on open.
        run: scripts/office-second-reader-e2e.sh
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-sweep — the FULL clean-slate example sweep, build AND RUN every example
  # from a wiped slate, INCLUDING the FFI / Std.Db / real-SDK examples
  # (skyshop's 76k-symbol cold `sky install`, Fyne, embedded Postgres). This is
  # the other gate §0.2.1 names by hand: it ran ONLY in the nightly. No
  # `--build-only` — the sweep must RUN each binary, not just compile it.
  #
  # SHARDED across 3 runners via `strategy.matrix`. Each shard builds+runs a
  # DISJOINT subset (examples whose stable index mod 3 == shard); the union of
  # the three shards is every example, exactly once (verified by
  # `example_sweep_shards_are_total.rs` + `scripts/example-sweep.sh --list`).
  # The compiler at sky-out/sky is installed by the composite (the sweep resolves
  # that path and refuses a stale one via require_fresh_compiler), and it does
  # the per-example FFI `sky install` itself.
  gate-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Five shards swept 59-88 s each, and 313 s for the one with 13-skyshop,
    # after a 2-2.5 min setup (release run 38764879819); three hold fewer of the
    # 40 concurrent jobs for the same work. A shard is ~1/3 of the sweep + the
    # compiler install. 45
    # keeps the ~1.5x margin (the skyshop FFI shard's cold `sky install` is the
    # variable one). 55: the shard that sweeps 13-skyshop also compiles and
    # runs the `project` lib tests for the harvest differential below.
    timeout-minutes: 55
    env:
      # The sweep builds the FFI examples, whose Go deps float on "latest", so
      # its Go module cache grows fast. 6 GiB here (the nightly sweep's budget),
      # bounded before save so it never evicts the other release caches.
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          # All shards share one Go cache family so the FFI cache is warmed
          # once and reused; distinct from the light jobs' caches.
          go-cache-family: go-sweep
          postgres: 'true'

      - name: Full example sweep (clean-slate build AND run, shard ${{ matrix.shard }}/3, incl. FFI/Std.Db)
        working-directory: .
        env:
          SWEEP_SHARD_INDEX: ${{ matrix.shard }}
          SWEEP_SHARD_TOTAL: '3'
        run: scripts/example-sweep.sh

      # The #166 call-site harvest differential over EVERY example project
      # (`rust/crates/project/src/harvest_identity_tests.rs`, the `#[ignore]`d
      # test). Per-push CI runs the same differential without the examples
      # that need a fetched dependency (its NEEDS_FETCH list: 13-skyshop, whose
      # Sky dependency comes from `sky install`). This runs it with them, in
      # the shard whose sweep has just run `sky install` in 13-skyshop. The
      # per-push test fails if a NEEDS_FETCH example leaves the sweep's list,
      # so some shard always runs this step's test.
      - name: Harvest differential over every example (the shard that sweeps 13-skyshop)
        working-directory: .
        run: |
          set -euo pipefail
          if scripts/example-sweep.sh --list --shard "${{ matrix.shard }}/3" | grep -qx 13-skyshop; then
            cd rust && cargo test --locked -p project --lib harvest_identity -- --ignored
          else
            echo "13-skyshop is swept in another shard; the full harvest differential runs there"
          fi

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # gate-native — the native shells on a real macOS runner: a Std.App probe is
  # built for the iOS simulator twice (no entitlement; a keychain access group
  # and an associated domain declared), installed on a booted simulator and
  # LAUNCHED, and the app's own results are read back through its backend: the
  # Keychain round-trips a value (Native.secureSet / secureGet) and
  # Native.scanCode answers Err Unavailable (VisionKit's scanner needs a device
  # camera). An Android release is packaged and verified against its upload
  # key (rust/crates/sky/tests/native_shell_flow.rs). The runner image carries
  # Xcode, the iOS simulators, the Android SDK and a JDK. The Android EMULATOR
  # test is skipped here by name: the arm64 macOS runner has no hardware
  # virtualisation for the emulator. It runs in gate-native-android below.
  gate-native:
    runs-on: macos-latest
    # A cold `cargo test -p sky` build (~15-20 min on macOS) plus the smoke
    # tests (~4.5 min measured locally: the iOS launch gate 158 s, the macOS
    # universal-link gate 62 s, the Android release 36 s). 1.5x.
    timeout-minutes: 45
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      # Restore only: main writes these (rust-ci macos-determinism). A tag or a
      # dispatched branch saving its own copy evicted main's entries.
      - name: Restore the Go build + module cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-macos-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-macos
          save-if: 'false'
      - name: Native shell smoke (iOS simulator, macOS universal links, Android release)
        working-directory: rust
        env:
          SKY_LIVE_TESTS: require
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: cargo test -p sky --locked --test native_shell_flow -- --ignored --test-threads=1 --skip android_emulator

  # gate-native-android — the Android counterpart of gate-native's launch gate,
  # on a Linux runner with KVM (hardware virtualisation for the emulator). The
  # same probe app is built for `mobile:android` and `tablet:android` (with the
  # restricted Apple entitlements declared, which must change nothing on
  # Android), installed on a running x86_64 emulator and LAUNCHED; the app's own
  # results are read back through its backend: the Keystore round trip, the
  # camera scanner opened and closed with Back (Ok Nothing), and the biometric
  # prompt with no enrolled finger (Err Unavailable)
  # (`android_emulator_…` in rust/crates/sky/tests/native_shell_flow.rs), and
  # the first-launch prompts: `Native.scanCode` and `Native.notify` wait for
  # the permission prompt's answer. The runner image carries the Android SDK
  # and a JDK; the emulator action boots the AVD and the test uses the running
  # emulator. The emulator always cold-boots here (`-no-snapshot`), and a cold
  # boot can leave a SystemUI "isn't responding" dialog over the app, so the
  # script closes system dialogs before the tests, and the tests themselves
  # wait for the package manager and the launcher, turn the animations off and
  # dismiss a focused system dialog before each app step.
  gate-native-android:
    runs-on: ubuntu-latest
    # A cold `cargo test -p sky` build (~15 min), the emulator boot (~3 min,
    # up to the 15 min boot timeout below) and the four emulator tests
    # (220-250 s measured locally after a cold boot, plus up to 85 s for the
    # system-dialog test). About 1.5x.
    timeout-minutes: 60
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      # Restore only: main writes these (rust-ci). See gate-native.
      - name: Restore the Go build + module cache (saved on main only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-linux-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test binary before the emulator starts
        working-directory: rust
        run: cargo test -p sky --locked --test native_shell_flow --no-run
      - name: Android emulator gate (Keystore, scanner, biometrics; phone + tablet)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SKY_LIVE_TESTS: require
          # A failed emulator step saves its evidence here (logcat, focus,
          # screenshot, UI tree, backend log), beside the samplers' device and
          # host log; the last step uploads it when the job fails.
          SKYTEST_EVIDENCE_DIR: ${{ github.workspace }}/native-evidence
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The scanner needs a back camera; the emulated one opens.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          emulator-boot-timeout: 900
          # Each line runs on its own. The two background samplers keep what a
          # failure needs for its root cause: every 3 s the adb transport
          # state, the host load and memory, the guest uptime (a reboot resets
          # it) and system_server's pid (a soft restart changes it); and the
          # whole device log. The first CI run of this gate lost its emulator's
          # transport for over 40 s and left nothing to say why. Then close a
          # system dialog a cold boot left (an ANR over SystemUI) and wake the
          # screen before the tests.
          script: |
            mkdir -p "$SKYTEST_EVIDENCE_DIR"
            sh -c 'while true; do date -u +%T; adb devices | tail -n +2; uptime; free -m | sed -n 2p; echo "guest $(timeout 5 adb shell cat /proc/uptime) system_server $(timeout 5 adb shell pidof system_server)"; sleep 3; done' > "$SKYTEST_EVIDENCE_DIR/devices.log" 2>&1 &
            sh -c 'while true; do adb logcat -v threadtime; sleep 1; done' > "$SKYTEST_EVIDENCE_DIR/logcat-all.txt" 2>&1 &
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell input keyevent KEYCODE_WAKEUP
            cd rust && cargo test -p sky --locked --test native_shell_flow android_emulator -- --ignored --test-threads=1
      - name: Upload the emulator evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-emulator-evidence
          path: native-evidence
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────
  # Assemble release assets, generate checksums, publish GitHub Release.
  # ────────────────────────────────────────────────────────────────
  # gate-nix — the Nix package, through both entry points: the stable
  # `nix-build` (default.nix, no flakes) and the flake (`nix build .#sky`), plus
  # both dev shells. Each `sky --version` must print the version Nix computed;
  # on a tag the stable build must print exactly the tag, so a version source
  # that disagrees with the tag blocks the release. The `sky-ffi-inspect`
  # installed beside `sky` must inspect a real Go package. The nightly runs the
  # same script (nightly-sweep.yml `nix`).
  gate-nix:
    runs-on: ubuntu-latest
    # A cold `cargo build --release -p sky` in the sandbox (~20 min on a
    # 4-core runner) plus the inspector and the store downloads. About 2x.
    timeout-minutes: 60
    steps:
      # Full history: the flake reads the commit for its `+g<rev>` version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build both Nix entry points and check sky --version + sky-ffi-inspect
        run: bash scripts/ci/nix-build-check.sh

  release:
    # Only a tag publishes; a dispatched full-suite run stops before this job.
    if: startsWith(github.ref, 'refs/tags/v')
    # Publication is blocked until EVERY gate job is green — the §0.2.1
    # "full suite green before publish" invariant, preserved across the split.
    # A red gate → this job never runs → no Release → the tag is safe. This list
    # names EVERY sharded gate job; a matrix job (gate-buildrun / gate-sweep) is
    # not satisfied until all its legs pass, so `needs` on the job name blocks on
    # the whole matrix.
    # The jobs run concurrently, so the wall clock is the slowest job, not the
    # sum. The interim "lean release" list (build / buildrun / sweep / app only)
    # is gone: CLAUDE.md §0.2.1 makes the full suite the release gate, and
    # `tests/workflows_parse.rs` fails the build if a `gate-*` job is disabled or
    # missing from this list.
    needs:
      - verify-ci-green
      - build
      - gate-core
      - gate-core-sky-1
      - gate-core-sky-2
      - gate-core-sky-3
      - gate-core-sky-4
      - gate-core-sky-5
      - gate-core-sky-6
      - gate-corpus
      - gate-t1-1
      - gate-t1-2
      - gate-t1-3
      - gate-buildrun
      - gate-t2-corpus
      - gate-t2-rest
      - gate-app
      - gate-falsifiers-1
      - gate-falsifiers-2
      - gate-falsifiers-3
      - gate-falsifiers-4
      - gate-falsifiers-5
      - gate-falsifiers-6
      - gate-falsifiers-7
      - gate-falsifiers-8
      - gate-falsifiers-9
      - gate-falsifiers-10
      - gate-ai-local
      - gate-ai-train
      - gate-ai-train-mlx
      - gate-ai-device-web
      - gate-ai-device-native
      - gate-ai-device-android
      - gate-race-1
      - gate-race-2
      - gate-web-1
      - gate-web-2
      - gate-web-3
      - gate-web-4
      - gate-example-e2e
      - gate-sweep
      - gate-native
      - gate-native-android
      - gate-nix
    runs-on: ubuntu-latest
    # `id-token` + `attestations` let the job sign a build-provenance
    # attestation for every published asset (F-9): `gh attestation verify
    # <file> -R anzellai/sky` then proves the file came from this workflow.
    # `sky upgrade`, install.sh and the Dockerfile verify checksums.txt.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No compilation: download 4 artifacts, checksum, extract CHANGELOG notes,
    # create the Release (asset upload dominates) ≈ 3 min. 1.5x ≈ 5.
    timeout-minutes: 5
    steps:
      # Checkout is required so the CHANGELOG + release-notes extractor are on
      # disk — `sky upgrade` prints the Release body verbatim, so it MUST be the
      # curated CHANGELOG section, never GitHub's auto-generated commit list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} release/ \;
          ls -la release/

      # ── The gate: the asset set is asserted, not assumed ──────────────────
      # `find … -exec cp` cannot fail the step when it copies nothing (find
      # exits 0 on an empty result), and upload-artifact was `if-no-files-found:
      # ignore`, so a matrix leg that produced no archive vanished silently and
      # the Release published a PARTIAL asset set, green. `sky upgrade` then
      # 404s for whichever platform went missing.
      #
      # This list is the release contract and must match the build matrix above.
      - name: Assert the complete asset set is present
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            sky-linux-x64.tar.gz
            sky-linux-arm64.tar.gz
            sky-darwin-arm64.tar.gz
            sky-windows-x64.zip
          )
          missing=()
          for f in "${EXPECTED[@]}"; do
            [ -s "release/$f" ] || missing+=("$f")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release is missing required asset(s): ${missing[*]}" >&2
            find release -maxdepth 1 -type f -exec basename {} \; >&2
            exit 1
          fi
          # Nothing unexpected either — an extra/renamed asset means the build
          # matrix and this contract have drifted apart.
          actual=$(find release -maxdepth 1 -type f -exec basename {} \; | sort | tr '\n' ' ')
          want=$(printf '%s\n' "${EXPECTED[@]}" | sort | tr '\n' ' ')
          if [ "$actual" != "$want" ]; then
            echo "::error::asset set drift. want: $want" >&2
            echo "got : $actual" >&2
            exit 1
          fi
          echo "asset set complete: $want"

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'release/*'

      - name: Extract release notes from CHANGELOG
        run: |
          # Hard gate: fails the release if the tag has no matching CHANGELOG
          # section, so a tag can never ship empty upgrade notes.
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > NOTES.md
          echo "----- release body for ${GITHUB_REF_NAME} -----"
          cat NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: NOTES.md
          files: release/*

  # ────────────────────────────────────────────────────────────────
  # Multi-arch Docker image (amd64 + arm64) built from the Dockerfile.
  # ────────────────────────────────────────────────────────────────
  docker:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    # The Dockerfile compiles nothing — it apt-installs curl/git and downloads
    # the released binary. Cost is the arm64 leg under QEMU emulation (~5-8 min)
    # plus the asset-propagation retry loop (up to ~2 min per platform) ≈ 12 min.
    # 1.5x ≈ 20. `continue-on-error` means a hit here won't fail the release.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Pin the version explicitly so the image build never falls back to
          # the unauthenticated GitHub `releases/latest` API call inside the
          # Dockerfile. That fallback fires once PER platform (amd64 + arm64
          # under QEMU) and hit the 60/hr unauthenticated rate limit, failing
          # the multi-arch build even after the release assets were live. The
          # tag is already known here (this job `needs: release`), so pass it
          # straight through — deterministic, no network guesswork.
          build-args: |
            SKY_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            anzel/sky:latest
            anzel/sky:${{ steps.version.outputs.VERSION }}
          # No `type=gha` layer cache: this runs on a tag (or a dispatch), and a
          # cache saved there serves that ref alone while it fills the 10 GB
          # repository budget that main's caches live in.
