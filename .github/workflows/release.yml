  # gate-corpus — the corpus gates, coerce-floor and the live-doc examples,
  # split out of gate-core (see its comment) so both finish inside a ceiling.
  gate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup

      # Release-built, deliberately. `preflight-tag.sh:70-74` records the
      # measurement: an unoptimised xtask made these ~10x slower, and `reject`
      # alone measured 780 s debug against 74 s release for an IDENTICAL
      # verdict. CI never got that fix; it gets it here.
      - name: Corpus gates
        working-directory: rust
        run: |
          set -euo pipefail
          for g in roundtrip resolve infer reject fuzz repro; do
            echo "── xtask $g ──"
            cargo run --release --locked -q -p xtask -- "$g"
          done
          # coerce-floor: five golden rows are examples whose GENERATED FFI
          # surface (sky-ffi/, .skydeps/) is .gitignored — 03-tea-external,
          # 05-mux-server, 08-notes-app, 11-fyne-stopwatch, 13-skyshop. This gate
          # job does not build that surface, so the rows are unmeasurable here
          # and the default gate fails on them. SKY_LIVE_TESTS=skip downgrades
          # the shortfall to a loud UNMEASURED block (gate-sweep measures all 61
          # with the FFI installed).
          echo "── xtask coerce-floor (SKY_LIVE_TESTS=skip: FFI-gitignored rows) ──"
          SKY_LIVE_TESTS=skip cargo run --release --locked -q -p xtask -- coerce-floor

      # The collection performance gate: six Sky programs under tests/perf/
      # run at n and 4n (growth ratio <= 6, mallocs per element within a
      # budget, no erased cons on a typed tail, 3 s ceiling). A return to an
      # O(n^2) List/Dict/String path goes red here, on any runner.
      - name: Collection perf gate (xtask perf-gate)
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- perf-gate

      # Every full-module Sky example in the live docs must still `sky check`.
      # Ran per-commit only (rust-ci behaviour-docs); a release runs it too.
      - name: Live docs (full-module doc examples still compile)
        working-directory: .
        run: scripts/doc-examples.sh

      - name: Deep expressions at the release optimisation level
        # The deep-expression tests check the compiler's stack use. The other
        # jobs run them under `[profile.dev]` (opt-level 2), where frames are
        # smaller than in the binary users run. `ty::exhaustive::walk` had no
        # stack guard; its frame is 160 bytes at opt-level 2 and 448 bytes in
        # `--release` (where `check_case` is inlined into it), so the 1,500-field
        # codec test passed in CI and aborted under `--release`. These run the
        # same tests at the release optimisation level.
        # Ran per-commit (rust-ci behaviour-docs); a release runs it too.
        working-directory: rust
        run: |
          cargo test --release --locked -p project --test deep_expression_emit
          cargo test --release --locked -p sky-lsp --test deep_expression
          cargo test --release --locked -p sky --test deep_expression_flow

      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # The T1 shards need postgres + neovim because T1 includes the lsp gate and
  # the postgres-arm gates. Caches are restore-only (main writes them).
  # gate-t1-N — the T1 gate harness, SHARDED 3 ways by `--only`. Its 30 gates
  # run one after another inside one harness, and their budgets sum to ~413 min;
  # as ONE job it passed a 40-min and then a 75-min ceiling at v0.25.18 (runs
  # 36111406977 and 36122173135, cancelled with no verdict). The shards run in
  # parallel. `workflows_parse::the_release_workflow_is_the_full_suite` fails if
  # a T1 gate is in no shard. The harness prints each gate's verdict as it ends.
  # Shard 1 holds what were shards 1 and 4 (conformance + verify-cli, 256 s;
  # the corpus, runtime-safety and census gates, 159 s; release run
  # 38764879819): two jobs of mostly setup became one of ~9 minutes.
  gate-t1-1:
    runs-on: ubuntu-latest
    # The harness runs this job's gates one after another: their summed budget
    # plus ~15 min of setup must fit, or a slow gate ends as a cancelled job
    # instead of a harness verdict (G-18; `e2e_scripts_are_gated.rs` checks it).
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/gate-setup
        with:
          postgres: 'true'
          neovim: 'true'
      - name: Gate harness (T1 shard 1/3 — conformance, verify-cli, corpus, runtime safety, census) with proof requirement
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --tier t1 --require-proofs --only conformance,verify-cli,roundtrip,sky-fmt-check,reject,stdlib-bodies,shared-world,corpus-manifest,corpus-reject,corpus-emit-shape,analytics-retention-survives-a-panic,analytics-prune-errors-are-reported,console-analytics-queries-are-bounded,erasure-path-uses-an-index,periodic-loops-recover-per-cycle,live-time-every-mutex-survives-a-panic,jobs-complete-failure-is-reported,coverage-ledger,config-surface,kernel-members,config-migration,config-migrate
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  gate-t1-2:
    runs-on: ubuntu-latest
    # The harness runs this job's gates one after another: their summed budget
    # plus ~15 min of setup must fit, or a slow gate ends as a cancelled job
    # instead of a harness verdict (G-18; `e2e_scripts_are_gated.rs` checks it).
    # v0.28.0 adds the Std.Ai T1 gates (ai-train-resume 600 s,
    # ai-train-exactly-once 600 s, ai-serve-hot-load 300 s, five device and
    # streaming gates at 120 s) and fmt-clean (120 s): 7,320 s + 15 min = 137.
    timeout-minutes: 140
    steps:
