name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sky-linux-x64
          - os: macos-latest
            artifact: sky-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.3.0'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('sky-compiler.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      # Cache example FFI bindings — `sky-ffi-inspect` on Stripe +
      # Firebase takes 15+ min cold. Restoring `.skycache/ffi/` (typed
      # .skyi + kernel JSON) and `.skydeps/` (Sky package lockfile)
      # between CI runs drops the sweep from ~25 min to ~3 min when
      # the upstream Go modules haven't moved.
      #
      # Cache key components:
      #   1. `runner.os` — same-platform builds share artefacts
      #   2. hash of `runtime-go/rt/**.go` — when the runtime API
      #      surface changes, Sky deps (sky-tailwind, etc.) may use
      #      removed identifiers and fail to compile. Dropping the
      #      cache forces a fresh `sky install` that re-fetches the
      #      latest upstream commit. Caught: v0.13 migration removed
      #      `Std.Css.right_` → `right`; pre-v0.13 cached
      #      `.skydeps/sky-tailwind` would fail E1001 on a v0.13 run.
      #   3. hash of `sky-stdlib/**.sky` — same reason for the
      #      Sky-side stdlib (kernel sigs, public surface).
      #   4. hash of every `sky.toml` — dep-version bumps invalidate
      #      the relevant slice.
      # Restore-keys include components 1–3 so only same-runtime
      # caches are eligible (cross-runtime restores would re-introduce
      # the staleness bug).
      - name: Cache example FFI bindings
        uses: actions/cache@v4
        with:
          path: |
            examples/*/.skycache/ffi
            examples/*/.skydeps
          key: ${{ runner.os }}-ffi-${{ hashFiles('runtime-go/rt/**.go', 'sky-stdlib/**.sky') }}-${{ hashFiles('examples/*/sky.toml') }}
          restore-keys: |
            ${{ runner.os }}-ffi-${{ hashFiles('runtime-go/rt/**.go', 'sky-stdlib/**.sky') }}-

      # v0.16.13 #530-CI: cache Go modules + build cache. The
      # HubConsoleServeSpec runs `sky console-serve` which materialises
      # the embedded runtime-go tree then runs `go build` to produce
      # the hub binary — uncached this downloads OTLP/protobuf/sqlite
      # modules and cold-compiles them, exceeding the 120s wait.
      # actions/setup-go@v5's `cache: true` only keys off go.sum in
      # cwd; Sky's go.sum sits under runtime-go/ so we cache explicitly.
      - name: Cache Go modules + build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('runtime-go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Single-command local/CI parity: scripts/build.sh does everything
      # the manual steps below used to — compile sky, build sky-ffi-inspect,
      # install to sky-out/ + bin/. Adds self-test + example sweep when flagged.
      - name: Build compiler + tooling
        run: |
          ./scripts/build.sh --self-tests
          echo "$PWD/sky-out" >> $GITHUB_PATH
          echo "$PWD/bin"      >> $GITHUB_PATH

      - name: Smoke-test sky binary
        run: sky --version

      # v0.16.0 drift gate: runtime-go/rt/console_app/main.go is the
      # macOS GitHub runners don't ship GNU coreutils — bare `timeout`
      # (used by example-sweep.sh + the cabal test step below + the
      # drift-check script's inner `timeout` call) is missing, causing
      # exit 127 ("command not found"). Install coreutils + symlink
      # `gtimeout` → `timeout` for the rest of the job. example-sweep.sh
      # has its own shim but the bare `timeout 3600 cabal test` line on
      # the next step doesn't, and neither does regenerate-console.sh.
      # MUST run BEFORE the drift check below.
      - name: Install GNU coreutils (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coreutils
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "$HOME/.local/bin/timeout"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Sky.Live console UI translated to Go and committed to the
      # tree. PR 1 introduced the drift check; PR 2 removed the
      # in-tree Sky source (sky-bundled/console/), so this step
      # now skips when the source isn't present locally — the
      # script exits 2 ("no source"), which we treat as a no-op
      # (we cannot detect drift without the source). Maintainer
      # workflow: regenerate via SKY_CONSOLE_SRC=<external path>
      # ./scripts/regenerate-console.sh, commit the diff.
      #
      # SKY_REGEN_SKIP_CABAL=1: cabal already built sky earlier in
      # this job; re-running it would waste ~2 min of cold-cache
      # rebuild for no value.
      - name: Console inline-copy drift check
        run: |
          set +e
          SKY_REGEN_SKIP_CABAL=1 ./scripts/regenerate-console.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::notice::console source not in tree (PR 2 removed sky-bundled/console/); skipping drift check"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::regenerate-console.sh exited $rc"
            exit "$rc"
          fi
          git diff --exit-code runtime-go/rt/console_app/ || {
            echo '::error::runtime-go/rt/console_app/ is stale — run scripts/regenerate-console.sh and commit the result'
            git diff --stat runtime-go/rt/console_app/
            exit 1
          }

      # Linux GitHub runners ship ~14GB free disk after checkout.
      # That's not enough for cabal build + cabal test + hub pre-warm
      # + 26-example sweep (each with .skycache + sky-out + Go build
      # artifacts ~100MB). v0.16.13 deaf8c31 CI failed 10/26 examples
      # mid-sweep with `mapping output file failed: no space left on
      # device` from the Go linker. Reclaim ~30-40GB by nuking
      # preinstalled toolchains we don't use (.NET / Android SDK /
      # Swift / CodeQL / swap). Keep /opt/ghc + /opt/hostedtoolcache/go
      # — cabal + go are load-bearing for Sky.
      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h /
          echo "---before cleanup---"
          sudo rm -rf /usr/share/dotnet            || true
          sudo rm -rf /usr/local/lib/android       || true
          sudo rm -rf /usr/share/swift             || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL  || true
          sudo rm -rf /opt/microsoft               || true
          sudo rm -rf /opt/google/chrome           || true
          sudo rm -rf /opt/az                      || true
          # Drop swap (8 GB) — CI runners don't page enough for it
          # to matter; we'd rather have the disk.
          sudo swapoff -a                          || true
          sudo rm -f /swapfile /mnt/swapfile       || true
          # Trim apt + docker caches — small but adds up.
          sudo apt-get clean                       || true
          docker image prune --all --force 2>/dev/null || true
          df -h /
          echo "---after cleanup---"

      # macOS GitHub runners (M-series, 3-core, 4GB free) have only
      # ~14GB free disk after `actions/checkout` + `cabal build` —
      # NOT enough for the example sweep's 26 fresh .skycache dirs +
      # Go build caches. Without this cleanup, `cabal test` hits
      # `No space left on device` halfway through the sweep spec
      # and ALL examples fail (cascade). Free disk by deleting older
      # Xcode versions + Homebrew bottle caches + chruby cache.
      - name: Free disk space (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          df -h /
          echo "---before cleanup---"
          # Keep current Xcode (named with -current-version); delete older
          ls -1 /Applications/ | grep -E '^Xcode_' | head -5 || true
          sudo rm -rf /Applications/Xcode_*.app || true
          # Brew autoremove cleans orphan dependencies + clears the cache
          brew autoremove --quiet 2>/dev/null || true
          brew cleanup --quiet --prune=all 2>/dev/null || true
          rm -rf "$HOME/Library/Caches/Homebrew" 2>/dev/null || true
          # chruby + rbenv unused on Sky's CI; nuke
          sudo rm -rf /Users/runner/.rbenv /Users/runner/hostedtoolcache/Ruby || true
          df -h /
          echo "---after cleanup---"

      # v0.16.13 #530-CI: pre-warm the sky-hub binary so the
      # HubConsoleServeSpec doesn't burn its waitForReady window on a
      # cold `go build`. The hub binary is built on first invocation
      # of `sky console-serve` and cached at
      # `~/.cache/sky/hub-<version>/sky-hub` — we trigger one
      # boot+kill cycle here so the binary lands in cache before
      # the spec's 120s wait starts. Cold-cache go build of the hub
      # was the root cause of 3 consecutive Linux CI failures at
      # `waitForReady port 120 → False`.
      - name: Pre-warm sky-hub binary
        run: |
          # Boot the daemon in the background with a free port, give
          # it a moment to materialise the runtime + go build, then
          # kill. The first invocation does ALL the cold work; the
          # spec's invocation reuses the cached binary in <1s.
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); print(s.getsockname()[1]); s.close()' 2>/dev/null || echo 18099)
          DATA_DIR=$(mktemp -d)
          SKY_CONSOLE_HUB_QUIET=1 ./sky-out/sky console-serve \
              --port "$PORT" --data-dir "$DATA_DIR" --auth off &
          HUB_PID=$!
          # Up to 5 min for go build + boot + port bind.
          for i in $(seq 1 60); do
              if curl -s --max-time 1 "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
                  echo "hub pre-warm: ready in ${i}*5s"
                  break
              fi
              sleep 5
          done
          kill "$HUB_PID" 2>/dev/null || true
          wait "$HUB_PID" 2>/dev/null || true
          rm -rf "$DATA_DIR"
          echo "hub pre-warm: done"

      - name: Run cabal test suite
        # Skip Sky.Build.VerifyAll: that spec wraps `sky verify`
        # which we ALSO run as a dedicated step below. Doubling
        # up has no value AND VerifyAll has been observed to hang
        # in some CI envs (no per-example timeout in the spec
        # harness; the dedicated `sky verify` step has timeouts
        # via scripts/example-sweep.sh). Same skip we use locally
        # via `--test-options='--skip=Sky.Build.VerifyAll'`.
        # CLAUDE.md §2.3 — every long-running command MUST be
        # timeout-bounded. 60 min ceiling here so a stuck spec
        # (e.g. Sky.Cli.Watch's spawnWatch child) can't burn the
        # whole CI budget waiting unbounded.
        #
        # v0.16.13 #530-CI: SKY_SKIP_SWEEP=1 prevents
        # Sky.Build.ExampleSweepSpec from re-running the same
        # 25-example clean build the dedicated `Example sweep` step
        # below already runs. Removes ~10-15 min of duplicated work
        # AND eliminates a /tmp pressure source that caused
        # `No space left on device` cascades on the constrained
        # macOS runner (3-core, ~14GB free disk).
        env:
          # v0.16.14 Sky-tests fast mode: skip 5 integration specs
          # (HubConsoleServe / CheckIsBuild / VerifyScenario /
          # HeapBoundedHm / VerifyAll) that shell out to sky + go build.
          # Same code paths are exercised end-to-end by the dedicated
          # Example sweep + verify-all-web + verify-cli workflow steps
          # below. Set SKY_TESTS_FAST='' (empty) on a nightly schedule
          # to opt back into the full integration sweep.
          SKY_TESTS_FAST: '1'
          # Sky.Build.ExampleSweepSpec self-gates on this — see
          # task #531 commit message.
          SKY_SKIP_SWEEP: '1'
        run: timeout 3600 cabal test --test-show-details=direct

      # v0.16.13 #530-CI: cabal test + hub pre-warm + go module cache
      # together write 4-6 GB of artefacts to disk between the first
      # cleanup (before cabal) and the example sweep. macOS runner
      # only has ~14 GB free after first cleanup; cabal test alone
      # can consume 5 GB. Re-clean before the sweep: nuke ~/go cache
      # + cabal dist-newstyle test artefacts + /tmp clutter to give
      # the 26-example sweep a fresh 8-10 GB working budget.
      - name: Free disk space before sweep
        run: |
          df -h /
          echo "---before pre-sweep cleanup---"
          # Go build cache: holds cabal test's spec build artefacts.
          # Safe — sweep re-builds from scratch anyway.
          go clean -cache 2>/dev/null || true
          # /tmp leftovers from cabal test (logs, sky-cib-sweep dirs, …)
          sudo rm -rf /tmp/sky-* /tmp/sky-cib-* /tmp/sky-hub-spec-* 2>/dev/null || true
          # Pruned hub cache (we already built + tested it; sweep doesn't
          # need to re-exec sky-hub).
          rm -rf "$HOME/.cache/sky/hub-dev" 2>/dev/null || true
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Extra macOS sources we haven't touched yet.
            sudo rm -rf /Library/Developer/CoreSimulator 2>/dev/null || true
            sudo rm -rf "$HOME/.android" 2>/dev/null || true
          fi
          df -h /
          echo "---after pre-sweep cleanup---"

      # Example sweep — clean-build every example, then either run
      # to completion (cli, with `timeout 10`) or probe HTTP 200
      # (server, with `curl --max-time 1`). See scripts/example-sweep.sh.
      #
      # We use the script (not `sky verify`) because `sky verify`'s
      # per-example dispatch has no wall-clock cap — a CLI example
      # blocking on stdin or a server probe taking the whole TCP
      # backoff would hang the CI step indefinitely. The script's
      # bounded primitives keep the worst case ~10 min for a 19-
      # example sweep on a cold runner.
      - name: Example sweep (build + run + HTTP probe, bounded)
        run: bash scripts/example-sweep.sh

      # E2E harness — behavioural contracts per example (CLI flow
      # dispatch, HTTP body assertions, DB-error-log checks) that
      # `sky verify` alone misses. Catches logic/CLI/DB regressions
      # where the smoke test passes but the app's domain behaviour
      # is broken. Each example with examples/<n>/e2e.json runs
      # against its contract; any mismatch fails CI.
      - name: Run end-to-end contract tests
        run: bash scripts/example-e2e.sh

      # ─────────────────────────────────────────────────────────
      # Std.Ui regression gates (issue #63-class flex-chain +
      # visual snapshots on examples/26-ui-showcase). Catches the
      # bug class that hit v0.14.7-v0.14.16 five times BEFORE the
      # Cycle 5 renderer churn (mediaQuery, pseudo-classes,
      # transitions, aspectRatio) lands. CLAUDE.md §2.3 — bounded
      # by `timeout 120` inside the runner script.
      #
      # macOS-only: Linux Chromium renders text 1-2 px differently
      # than the developer macOS Chromium that recorded the
      # baselines, so the pixel-diff check would false-positive on
      # every Linux PR. Computed-style assertions ARE portable but
      # are gated behind the same runner today. Track in #380
      # follow-up if we ever need Linux coverage.
      # ─────────────────────────────────────────────────────────
      - name: Install Playwright deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npm install
          npx playwright install chromium

      - name: Std.Ui regression gates (ui-showcase)
        if: matrix.os == 'macos-latest'
        run: TMPDIR=/tmp bash scripts/verify-ui-showcase.sh

      # ─────────────────────────────────────────────────────────
      # Tooling smoke tests
      # ─────────────────────────────────────────────────────────
      - name: Test sky fmt (idempotent)
        run: |
          cp test-files/simple-case.sky /tmp/fmt-test.sky
          sky fmt /tmp/fmt-test.sky
          cp /tmp/fmt-test.sky /tmp/fmt-test2.sky
          sky fmt /tmp/fmt-test2.sky
          diff /tmp/fmt-test.sky /tmp/fmt-test2.sky

      - name: Test sky check
        run: sky check test-files/simple-case.sky

      # ─────────────────────────────────────────────────────────
      # Artifact
      # ─────────────────────────────────────────────────────────
      - name: Package artifact
        run: |
          mkdir -p dist
          cp sky-out/sky dist/${{ matrix.artifact }}
          cp bin/sky-ffi-inspect dist/sky-ffi-inspect-${{ matrix.artifact }} || true
          tar czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }} $( [ -f dist/sky-ffi-inspect-${{ matrix.artifact }} ] && echo sky-ffi-inspect-${{ matrix.artifact }} )
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
