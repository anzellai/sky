name: Nightly example sweep

# The FULL clean-slate example sweep — every example under examples/ is wiped
# (rm -rf sky-out .skycache .skydeps) and rebuilt from scratch, INCLUDING the
# FFI / Std.Db / real-SDK examples (skyshop's 76k Stripe symbols, Fyne, etc.)
# that the per-push Rust CI's build-run gate skips because their FFI surface
# regeneration (`sky install`) is too slow for a per-push runner.
#
# This is the gate for the whole FFI + Std.Db + Dict-in-record class (the shape
# behind the #164/#166 real-app regressions): the per-push CI gates "compiles +
# byte-matches oracle" and the `project` integration tests gate the specific
# #164/#166 shapes, but ONLY the sweep clean-builds every real example end to
# end. Runs nightly (and on demand) so the expensive coverage exists without
# slowing every push.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: # manual trigger
    inputs:
      only:
        # `both` is a historical name kept because it is the stored default of
        # this input: it means "every job", and the `if:` on each job spells
        # that out. The list must name EVERY job — `behaviour-corpus` and
        # `harness-t3` guard on `inputs.only` but were never added here, so a
        # manual dispatch could not select either one.
        description: 'Which job to run on a manual dispatch (the schedule always runs every job)'
        type: choice
        default: both
        options:
          [
            both,
            example-sweep,
            web-runtime,
            behaviour-corpus,
            harness-t3,
            bluedb-harness,
          ]

# Don't stack nightly runs; a newer run supersedes an in-flight one.
concurrency:
  group: nightly-sweep
  cancel-in-progress: true

jobs:
  # The two jobs are independent, and each is expensive in its own way (the
  # sweep is ~60 min, the browser tier holds ~80 s in one place by design).
  # `inputs.only` lets a manual dispatch run just the one being worked on
  # instead of burning the other; a scheduled run has no inputs, so
  # `inputs.only` is empty and both conditions hold.
  example-sweep:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["both", "example-sweep"]'), inputs.only) }}
    runs-on: ubuntu-latest
    # The one job that was already bounded. Kept at 90: a clean-slate rebuild of
    # all 55 examples INCLUDING the FFI/Std.Db ones (skyshop's cold `sky install`
    # over 76k Stripe symbols alone is 60-120 s) runs ~60 min, and 1.5x of that
    # is 90 — which is also the T3 nightly ceiling in
    # docs/ci-test-architecture-v2.md §8.1 (status: firm).
    timeout-minutes: 90
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      # This job is where the Go module cache actually explodes: the full sweep
      # builds the FFI examples, whose Go dependencies float on `"latest"`, so
      # every resolution can add another module version and nothing removes the
      # old ones. Measured at 75 GB locally — against a 10 GB budget for the
      # WHOLE repo's Actions cache. Left unbounded it evicts every other cache
      # entry (including the cargo caches `setup` primes in rust-ci) and makes
      # unrelated jobs silently cache-cold. 6 GiB here: the sweep legitimately
      # needs more than a per-push job, and one runtime-go build alone is
      # ~742 MiB.
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-sweep-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-sweep-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
      - name: Build sky binary
        # Ask cargo where it put the binary instead of assuming
        # `rust/target/release/sky`: cargo honours CARGO_TARGET_DIR and friends,
        # and a hardcoded path silently installs an OLDER build when they are
        # set. That cost a full release cycle on a developer machine (the
        # compiler under test was pre-fix, so a completed fix was declared
        # broken). CI does not set those vars today, so this site was benign —
        # but it is the same trap, and `scripts/lib/cargo-target.sh` exists
        # precisely so no one has to remember which sites are safe.
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: Full example sweep (clean-slate build of every example, incl. FFI/Std.Db)
        run: scripts/example-sweep.sh
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh

  # ── The browser tier — the ONLY runner of scripts/verify-all-web.sh in CI ───
  #
  # Until now this tier ran in exactly one place: `scripts/preflight-tag.sh`,
  # i.e. only when a human cut a release. That is not a theoretical gap. It is
  # how the `sky_sid` idle-eviction bug survived to a release: an idle-but-alive
  # Sky.Live session was evicted because the session COOKIE's Max-Age was keyed
  # to the store TTL, and the only gate that exercised it —
  # `resilience-idle` — never ran in CI. It had never passed since it was
  # written, and nobody saw it, because nothing ran it.
  #
  # It belongs at T3, not T1. The tier drives real browsers against real
  # servers: ~80s for the idle case alone, which must cross the 60s store
  # cleanup tick and therefore cannot be made fast. Per-push cannot afford it;
  # nightly can, and nightly is where the expensive coverage already lives.
  #
  # Four Go tests now carry the specific `sky_sid` invariant into per-push CI,
  # so the class is guarded there too. This job guards the TIER — the
  # click-is-a-no-op, console-error, server-panic and desync/idle classes that
  # only a browser can see.
  web-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["both", "web-runtime"]'), inputs.only) }}
    runs-on: ubuntu-latest
    # The tier measures ~10 min locally (10 checks incl. two ~80s resilience
    # holds and the console e2e). 1.5x = 15; 25 leaves room for a cold Go cache
    # and browser download, still far inside the 90-min T3 ceiling.
    timeout-minutes: 25
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-web-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-web-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Install Playwright + its browser
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build sky binary
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: Gate — browser runtime verification (Sky.Live + Http.Server + resilience)
        # verify-all-web.sh emits exactly ONE "VERIFY:" line, last, and exits
        # with its failure count. Take the EXIT STATUS as the verdict: an
        # earlier form of this check grepped for "0 fail" and matched the
        # substring inside "10 fail", passing a run where every Playwright
        # check was dead.
        run: scripts/verify-all-web.sh
      # A failed browser gate is a picture, a server log or a build log — none
      # of which survive in the step output. The first nightly run reported
      # "binary missing" for two examples and "N% pixels exceed" for nine
      # snapshots, and neither the compiler diagnostic nor a single PNG left
      # the runner, so both had to be re-derived by hand.
      - name: Upload failure evidence (diffs, server logs, build logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime-evidence
          path: |
            .skycache/ui-showcase-diffs/**
            .skycache/verify/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh

  # ── Behavioural corpus (harness tier T2) ────────────────────────────────────
  #
  # WHY THIS EXISTS. The T2 tier ran in NO workflow at all. `xtask corpus`
  # appeared in no job and no script, and `harness --tier t1` cannot reach it:
  # gate selection is exact tier equality, and the repo's only harness call was
  # `release.yml`'s `--tier t1`.
  #
  # Executed by nothing, therefore: 383 assertions — 335 generated Family-S
  # cases, the isolation gate, the witness gate, and the Live/Tui render-parity
  # app. Among them the 15-cell `Dict` key-type x iteration-operation crossing,
  # which exists BECAUSE #174's `Dict.foldl` panic reached a release through a
  # corpus that did not cross those axes. The registry records a falsifying
  # mutation proving `corpus` can fail; the proof was against a gate CI never
  # invoked.
  #
  # WHY NIGHTLY AND NOT PER-PUSH — measured, after getting it wrong. It was
  # first wired into rust-ci.yml on the estimate "274s locally, and CI wall
  # clock is the slowest job, so it is free". That estimate was warm-cache. The
  # real numbers: ~700s locally COLD (corpus alone 506s), and on a GitHub runner
  # it exceeded 25 MINUTES and was killed by its own timeout. All 335 cases are
  # `go build`-ed; that is inherently expensive on CI hardware.
  #
  # Per-push T1 has a 900s ceiling that `ci-green` asserts. Keeping the job
  # there meant either blowing that budget or raising the ceiling — and raising
  # it to fit a job I had just added is precisely the silent budget drift the
  # assertion exists to catch. So it runs here, in the tier sized for expensive
  # things, until it can be made to fit.
  #
  # HONESTLY: nightly is weaker than per-push. It is not merge-blocking, so a
  # regression lands and is caught the next night rather than at review. That is
  # a real gap and it is recorded as one in `.claude/AUTONOMOUS_GOAL.md`. The
  # path to closing it is sharding — `corpus --run` has no shard or filter flag
  # today, so partitioning the 335 cases across a matrix is a change to the
  # gate, not to this file. It is strictly better than the status quo it
  # replaces, which was no execution anywhere.
  behaviour-corpus:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["both", "behaviour-corpus"]'), inputs.only) }}
    runs-on: ubuntu-latest
    # Killed at 25 min on its first real run. 45 gives a cold-cache run room
    # while staying far inside the 90-min T3 ceiling.
    timeout-minutes: 45
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-corpus-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-corpus-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Build sky binary
        # `harness::layer2::sky_binary` resolves the compiler under test at
        # `<repo>/sky-out/sky` and treats a missing one as a HARD ERROR, never a
        # skip — "a gate that cannot run has not passed". Omitting this step is
        # what made the first run report `apps-fieldbook FAIL 0/8 VACUOUS`.
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: Warm the Go build cache before the parallel corpus run
        # The corpus runs 4 workers (`corpus/runner.rs`, WORKERS = 4). On the
        # first run of this job, all four spawned `go build` simultaneously
        # against a COLD build cache, each compiling the Go runtime and stdlib
        # from scratch on a 2-core runner. Exactly four cases died — cases 0-3,
        # the first batch, within 0.02s of each other — and reported
        # BUILD-FAILED with EMPTY stderr.
        #
        # Empty output is the tell: a Go compile ERROR always prints a
        # diagnostic. Nothing at all means the process was killed, not that the
        # code was rejected. Everything from case 5 on passed, once the cache
        # was warm. The same tier passes on an 8-core macOS host with GOCACHE
        # *and* GOMODCACHE both emptied, which rules out the caches themselves
        # and leaves contention.
        #
        # So: compile the runtime ONCE, serially, before the fan-out. The four
        # workers then share a warm cache instead of racing to build the same
        # objects four times over.
        #
        # This is a gate defect, not a compiler one — worth stating plainly,
        # because it presented as four red `record_update` cases, which is the
        # issue #166 family and reads exactly like a codegen regression.
        run: |
          cd runtime-go
          CGO_ENABLED=0 go build ./... 2>&1 | tail -5 || true
          go version
      - name: 'Gate — behavioural corpus (harness tier T2: 383 assertions)'
        # The whole tier, not named gates, so a gate ADDED at T2 later is picked
        # up automatically instead of silently joining the set nothing runs —
        # which is how this hole opened in the first place.
        run: cargo run --release -p xtask --manifest-path rust/Cargo.toml -- harness --tier t2
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh

  # ── Layer-2 app gates at tier T3 ────────────────────────────────────────────
  #
  # Same defect as `behaviour-corpus` above, found one tier over by the Judge
  # that reviewed that fix: `harness --tier t3` was invoked by NOTHING. Gate
  # selection is exact tier equality, and the repo's only harness calls were
  # `release.yml`'s `--tier t1` and (as of this cycle) nightly's `--tier t2`.
  #
  # Registered and unreachable until now: `apps-ledger-postgres`,
  # `apps-dispatch-postgres`, `apps-fleet`. Two of the three need a real
  # PostgreSQL — which is why they were parked at T3 in the first place, and why
  # wiring them needs a service container rather than just another `run:` line.
  #
  # The service mirrors `rust-ci.yml`'s `integration-postgres` exactly (same
  # image, credentials and health-check) so the DSN the gates read is the one
  # that job already proves works.
  harness-t3:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["both", "harness-t3"]'), inputs.only) }}
    runs-on: ubuntu-latest
    # T3's ceiling is 90 min; these are app builds plus Postgres round-trips.
    timeout-minutes: 60
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GO_CACHE_BUDGET_MB: '6144'
      SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
      DATABASE_URL: postgres://sky:sky@localhost:5432/sky?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-t3-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-t3-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Build sky binary
        # Layer-2 gates resolve the compiler under test at `<repo>/sky-out/sky`
        # and treat a missing one as a hard error, never a skip. Omitting this
        # is what made `behaviour-corpus`'s first run report `0/8 VACUOUS`.
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: 'Gate — Layer-2 app tier (harness tier T3)'
        run: cargo run --release -p xtask --manifest-path rust/Cargo.toml -- harness --tier t3
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh

  # ── BlueDB gate harness — full tier + mutation re-verification ──────────────
  #
  # WHY THIS EXISTS. `grep -rin bluedb .github/ scripts/` returned NOTHING. The
  # whole BlueDB harness — every gate BODY, `--check`, `--verify-mutations`, and
  # the full tier that is the only thing able to clear a STALE clock — was
  # invoked by no automation at all. What DID run was the `#[cfg(test)]` units
  # inside `rust/crates/xtask/src/bluedb_gates/*`, via `cargo test --workspace`:
  # the harness's own unit tests, green forever, while the gates they support
  # executed nowhere. `gate_manifest_test.rs` could not notice, because it
  # scans CI → xtask and never the converse; the new
  # `bluedb_gates_is_invoked_by_at_least_one_workflow` test closes that
  # direction and PINS this job — deleting it turns `cargo test -p xtask` red.
  #
  # WHY NIGHTLY AND NOT PER-PUSH. `--tier=full` is the tier that actually runs
  # the expensive gates, and `--verify-mutations` applies every recorded
  # falsifying patch and rebuilds for each probe — two `cargo build`s per
  # mutation. That is T3-shaped work, and T1 has a 900s ceiling `ci-green`
  # asserts. The per-push tier instead gained the part that is cheap and
  # unambiguous: `codegen-build` now runs `go test ./rt/... ./bluedb/...` and a
  # `-race` step over `./bluedb/...`.
  #
  # STEP ORDER IS LOAD-BEARING. `--verify-mutations` refuses to run against a
  # tree that differs from HEAD (`mutations::head_skew`, and `docs/bluedb` is in
  # `MEASURED_FROM_HEAD` while `STATUS.md` is NOT in the dev-tree exemption
  # list). `--tier=full` WRITES `docs/bluedb/STATUS.md`. Running the full tier
  # first therefore makes the mutation verifier refuse on skew it created
  # itself. Mutations first, full tier second.
  #
  # HONESTLY, AND ON PURPOSE: this job is EXPECTED TO REPORT FAILURE while the
  # BlueDB build-out is in progress. `bluedb-gates` exits 1 when any goal
  # verdict is UNKNOWN, and goals 1-5 are UNKNOWN today because their substrate
  # is not built yet — that IS the verdict, and publishing it nightly is the
  # point (same shape as `ci-green`'s budget assertion in rust-ci.yml). Nightly
  # is not a required check, so this blocks no merge. Do not silence it with
  # `continue-on-error`, and do not narrow the tier to make it green.
  #
  # NOT WIRED HERE, AND WHY: `bluedb-gates --check` was the third item asked
  # for. It cannot pass in ANY post-commit checkout, on three independent axes,
  # so wiring it would ship a permanently-red step rather than a gate:
  #   1. Clock 1 compares STATUS.md's recorded `commit:` to HEAD. A commit
  #      cannot record its own SHA, so the recorded value is necessarily an
  #      ancestor once the regeneration is committed.
  #   2. Clock 2 requires the full-tier ledger to be 0 commits behind HEAD —
  #      same argument.
  #   3. The hashed body carries a per-gate wall-clock `Time` column at 0.1s
  #      resolution, so "matches a fresh run" is not reproducible across hosts.
  # `--check` is a PRE-COMMIT gate by construction (HEAD is the parent, and the
  # regenerated STATUS.md records exactly it). Making it CI-usable needs the
  # clocks and the STATUS.md body format changed — a harness redesign, not a
  # workflow edit. Tracked as such rather than papered over.
  bluedb-harness:
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["both", "bluedb-harness"]'), inputs.only) }}
    runs-on: ubuntu-latest
    # Mutation verification is two `cargo build`s per recorded mutation plus the
    # full tier. 60 leaves room while staying inside the 90-min T3 ceiling.
    timeout-minutes: 60
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@v4
        with:
          # `mutations::head_skew` and `full_tier_behind` both shell out to git
          # (`git status`, `git rev-list <sha>..HEAD`). A depth-1 checkout has
          # no history, so `rev-list` fails and the clock reads "maximally
          # stale" rather than measuring anything.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-bluedb-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-bluedb-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Build sky binary
        # Gate bodies that compile Sky resolve the compiler under test at
        # `<repo>/sky-out/sky` and treat a missing one as a hard error, never a
        # skip — omitting this step is what made `behaviour-corpus`'s first run
        # report `0/8 VACUOUS`.
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: 'Gate — bluedb mutation proofs re-verified (every recorded falsifier goes RED)'
        run: cargo run --release -p xtask --manifest-path rust/Cargo.toml -- bluedb-gates --verify-mutations
      - name: 'Gate — bluedb full tier (the only run that can clear a STALE full-tier clock)'
        # `if: always()` so a red mutation verifier does not hide the tier's
        # verdict. Both are evidence; one is not a precondition of the other.
        if: always()
        run: cargo run --release -p xtask --manifest-path rust/Cargo.toml -- bluedb-gates --tier=full
      - name: Upload the regenerated STATUS.md + gate-state ledger
        # `--tier=full` writes both, and the runner is discarded — without this
        # the run's actual per-gate verdicts survive only as scrollback.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluedb-status
          path: |
            docs/bluedb/STATUS.md
            docs/bluedb/gate-state.tsv
          if-no-files-found: warn
          retention-days: 14
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh
