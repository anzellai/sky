name: Rust CI

# The primary CI gate for the Sky compiler. Guards the Rust compiler's
# reproducibility + parity invariants via the full xtask gate suite.
#
# Structure: the gates are split across INDEPENDENT jobs that run CONCURRENTLY,
# so the wall-clock is the slowest single job — not the sum of every gate (which
# was ~90 min in one sequential job). Nothing is dropped: every gate that ran
# before runs here, just fanned out. macOS keeps only the platform-determinism
# subset (repro / coerce-floor / runtime behaviour) — the reason for a 2nd OS —
# while ubuntu carries full coverage.
#
# Runs on every push/PR to main (no paths filter, so a required status check
# never deadlocks on a docs-only PR) plus the in-flight rewrite branch.
#
# ─────────────────────────────────────────────────────────────────────────────
# JOB GRAPH (v2 §8.1). `setup` builds the workspace ONCE and primes the shared
# cargo cache; the Rust-building jobs `needs: setup` and restore it instead of
# each paying its own cold dependency build. `ci-green` is the fan-in.
#
# ROLLOUT — TWO STEPS, AND THE ORDER MATTERS (v2 §9.5):
#   STEP 1 (THIS COMMIT): `ci-green` is an ADDITIONAL check. Every pre-existing
#           job KEEPS ITS NAME and keeps reporting. Repo branch-protection
#           settings live OUTSIDE this tree, so renaming or removing a job here
#           would leave every open PR waiting forever on a required check that
#           can never report again.
#   STEP 2 (A LATER, SEPARATE CHANGE, once `ci-green` has reported green on
#           real runs): add `ci-green` to the required checks in repo settings,
#           THEN remove the individual jobs from the required list.
#
#   `ci-green` also asserts the T1 time budget (v2 §8.2). That assertion is
#   EXPECTED TO FAIL until the remaining critical-path phases land — today's
#   measured wall clock is 31-34 min against a 15 min T1 ceiling. That is the
#   point: it publishes the real number every run. DO NOT promote `ci-green` to
#   a required check until it reports green, and DO NOT raise the ceiling to
#   make it pass — raising it is exactly the silent budget drift it exists to
#   catch.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, 'rewrite/rust-compiler']
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # T1 (per-push / PR) ceiling from docs/ci-test-architecture-v2.md §8.1, in
  # seconds, plus the 10 % runner-variance grace §8.2 allows. Single source of
  # truth: `ci-green` reads these, nothing hard-codes a number.
  T1_CEILING_SECONDS: '900'
  T1_GRACE_PERCENT: '10'
  # Ceiling for the Go build + module caches, in MiB. The module cache reached
  # 75 GB locally because example FFI deps float on `"latest"`; GitHub's cache
  # is 10 GB for the WHOLE repo, so an unbounded Go cache does not just waste
  # space, it evicts every other cache entry (including the cargo ones) and
  # silently makes every job cache-cold.
  GO_CACHE_BUDGET_MB: '2048'

defaults:
  run:
    working-directory: rust

jobs:
  # ── setup: build ONCE, prime the shared cargo cache for every Linux job ─────
  # Before this job existed, six jobs each ran their own `cargo build
  # --workspace --locked` and the two test jobs each built their own dependency
  # graph — the same dependency compile paid 8 times per push, because a cache
  # written at the END of a job is not available to jobs that started
  # CONCURRENTLY with it. Serialising one short build in front of the fan-out
  # makes the restore a cache HIT for all of them.
  #
  # It builds the workspace AND `cargo test --no-run`, so the cache also covers
  # dev-dependencies and the test harnesses that `test-ty` / `test-rest` need.
  #
  # HONEST ACCOUNTING: this trades wall clock for billed minutes. It removes the
  # duplicate dependency builds (a large billing win) but adds `setup` to the
  # critical path — v2 §8.1 budgets T1 as `setup + max(job)` for exactly this
  # reason. The wall-clock reduction comes from `[profile.dev] opt-level = 2`
  # (rust/Cargo.toml), which made the compute-bound gates ~6x faster; NOT from
  # this job, and not from dropping any check.
  #
  # UNVERIFIED UNTIL THE FIRST REAL RUN: the whole argument rests on downstream
  # jobs getting a cache HIT from what `setup` saved. Note that
  # Swatinem/rust-cache deliberately prunes the workspace's OWN crates before
  # saving, so dependencies are shared but the ~15 local crates are still
  # rebuilt per job. Check the "Cache restored from key" lines on run 1.
  setup:
    runs-on: ubuntu-latest
    # v2 §8.1 budgets setup at <= 6 min (<= 3 cache-warm). 1.5x = 9; 12 leaves
    # headroom for a fully cache-cold run after a lockfile bump.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          # ONLY this job writes the cache. Letting every job save produced
          # concurrent writes of near-identical entries that raced and churned
          # the 10 GB repo budget.
          save-if: 'true'
      - name: Build workspace (primes the shared cache for every dependent job)
        run: cargo build --workspace --locked
      - name: Build test binaries (primes dev-dependencies for test-ty/test-rest)
        run: cargo test --workspace --locked --no-run

  # ── ty crate tests (the heavy corpus tests — each recompiles the stdlib, so
  #    this crate is the bulk of the old 30-min test step; on its own runner) ──
  test-ty:
    needs: setup
    runs-on: ubuntu-latest
    # The 1857 s (~31 min) figure this job was sized against is STALE. It was
    # measured before the per-case cost was fixed, when every corpus case
    # rebuilt the stdlib world from scratch: 1293 ms/case x ~1400 cases ~= 1810 s,
    # which is essentially the whole 1857 s. After `perf(ty): incremental World`
    # and `perf(hir): memoise SourceDb::resolve` the per-case cost is 1.02 ms —
    # a ~1268x reduction — so the corpus RUN is now seconds, and what remains of
    # this job is compilation, which is what `needs: setup` addresses.
    #
    # Measured locally at this commit (8-core M-series, warm target dir):
    #   whole `cargo test -p ty --locked`   40 s   (68 tests, 0 filtered)
    #   of which the reject test target     22 s
    #
    # WHY THE REJECT TEST FACE IS NOT SKIPPED HERE. The plan for this phase was
    # to drop it from this job because it duplicates `xtask reject` in
    # `parity-reject` and was believed to be ~60 % of 1857 s (~1114 s). At the
    # measured cost that saving is ~22 s of RUN time — and skipping via a test
    # filter would not even save the compile, since the test binary is still
    # built. Removing an independent runner of a soundness corpus to save ~22 s
    # would be trading a real check for a rounding error, so BOTH faces stay.
    # The duplication was made cheap; it was not removed by deleting a face.
    # (`ty/tests/reject.rs` and `xtask reject` both call
    # `ty::reject_corpus::scan`, so they cannot drift.)
    #
    # Sizing: 50 min is retained deliberately rather than tightened on a local
    # number — the real CI cost is unknown until this graph runs once. `ci-green`
    # is what holds the TIER budget; this bound only catches a runaway job.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Tests — ty (corpus accept/reject/infer)
        run: cargo test -p ty --locked

  # ── Every other crate's tests + clippy + doctests ───────────────────────────
  test-rest:
    needs: setup
    runs-on: ubuntu-latest
    # Not separately measured. Reasoned: clippy --all-targets (~6 min debug) +
    # workspace-minus-ty tests incl. `project`'s real `go build` integration
    # tests (~10 min) + doctests (~2 min) ≈ 20 min. 1.5x = 30.
    #
    # Raised to 45 when this job started PROVISIONING PostgreSQL: the live
    # cluster tests used to return immediately here and now start real
    # postmasters, serialised one at a time (macOS allows 32 SysV shared-memory
    # ids in total and thirteen concurrent clusters exhausts them, so the
    # fixtures hold a mutex). Measured locally at 47 s for the fourteen
    # shared-cluster tests alone, plus the `db_*_flow` suites which each
    # provision and, in `db_run_cluster_flow`'s case, `go build` a real app —
    # all of which were skipping. ~10 min added; 1.5x of ~30 is 45.
    timeout-minutes: 45
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # PIN THE GO TOOLCHAIN. `cargo test --workspace --exclude ty` runs the
      # `project` crate's integration tests, and those shell out to a REAL
      # `go build` on emitted Go — they are the only gate on the #164 / #166
      # codegen-regression class. This job had NO actions/setup-go, so that gate
      # ran against whatever Go the runner image happened to ship, while every
      # other Go-touching job pinned 1.26. A runner image bump could therefore
      # change a codegen gate's verdict with no change in this repo.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-test-rest-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-test-rest-

      # PROVISION THE LIVE ENVIRONMENT. This is the only job that runs
      # `cargo test --workspace`, and it had no PostgreSQL — so the fourteen
      # tests in `crates/sky/src/db_shared/live_tests.rs` that stand behind the
      # shared-cluster security boundary ("app A's credentials cannot reach app
      # B's database", "a cluster that does not ask for a password is refused")
      # reported `ok. 14 passed` here having asserted nothing, every run, for as
      # long as they have existed. Run with and without a cluster they printed
      # byte-identical verdict lines, differing only in the wall clock.
      #
      # `integration-postgres` installs these binaries too, and cannot help:
      # its own first comment is "No Rust build at all" — it runs `go test`.
      - name: PostgreSQL + sqlite3 for the live tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 sqlite3
          # Fail here, loudly, rather than at the first live test: an absent
          # binary and a test that decided not to run are indistinguishable in
          # a verdict line, which is the whole defect being closed.
          for b in initdb pg_ctl postgres; do
            [ -x "/usr/lib/postgresql/16/bin/$b" ] || {
              echo "::error::missing /usr/lib/postgresql/16/bin/$b" >&2; exit 1; }
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Clippy (report only)
        run: cargo clippy --workspace --all-targets || true

      # PostgreSQL binaries, DECLARED rather than inherited from the runner
      # image. `db_cluster_flow::a_second_start_retunes_the_managed_block` is a
      # live gate that REFUSES to skip: its whole subject is a start that is not
      # the first one, so without a real cluster "PostgreSQL is missing" and
      # "the retune is broken" produce the same green line — which is how the
      # frozen managed block survived. The rest of that file's live tests do
      # skip, and did so silently on any runner image that dropped PostgreSQL.
      - name: PostgreSQL binaries for the live cluster gates
        run: |
          set -euo pipefail
          dir=""
          for v in 17 16 15 14; do
            if [ -x "/usr/lib/postgresql/$v/bin/initdb" ]; then dir="/usr/lib/postgresql/$v/bin"; break; fi
          done
          if [ -z "$dir" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
            dir=/usr/lib/postgresql/16/bin
          fi
          for b in initdb pg_ctl postgres psql; do
            [ -x "$dir/$b" ] || { echo "missing $dir/$b — the live cluster gates cannot run" >&2; exit 1; }
          done
          echo "SKY_POSTGRES_BIN=$dir" >> "$GITHUB_ENV"

      - name: Tests — workspace except ty and sky
        env:
          # Debian's PostgreSQL binaries are NOT on PATH — they live under
          # /usr/lib/postgresql/<major>/bin — so this is set explicitly rather
          # than left to discovery.
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          # The default, stated anyway: an unmet live environment must fail this
          # job rather than let a test return. The opt-out is `skip`, and no CI
          # job sets it.
          SKY_LIVE_TESTS: require
        # `sky` is split into its own `test-sky` job: its postgres-live +
        # db_*_flow integration tests are the tallest setup-dependent pole (the
        # T1 chain was setup+test-rest). Excluding it here + running it in
        # parallel drops the chain under the ceiling without weakening coverage
        # (every sky test still runs, in test-sky). Postgres stays provisioned
        # here as a safety net for any non-sky live test.
        run: cargo test --workspace --exclude ty --exclude sky --locked
      - name: Doctests
        run: cargo test --workspace --locked --doc
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── The `sky` crate, split off test-rest (T1 critical-path trim) ────────────
  # The sky crate owns the postgres-live shared-cluster tests + the db_*_flow
  # suites (each provisions a real cluster, one `go build`s a real app). At ~400s
  # they made setup+test-rest the tallest T1 dependent chain (1074s > 990s).
  # Running them here IN PARALLEL with the rest of the workspace drops the chain
  # to setup + the next pole (~repro), under the ceiling. Same env as test-rest
  # (Go 1.26 pin + PostgreSQL 16 + SKY_LIVE_TESTS=require); clippy + doctests are
  # NOT repeated (test-rest's `--all-targets` clippy and `--workspace --doc`
  # already cover sky). Setup-dependent (needs: setup) — NOT in
  # SETUP_INDEPENDENT_JOBS.
  test-sky:
    # Deliberately NO `needs: setup` — the same reasoning as `build-corpus`.
    # test-sky is the LONGEST job in the graph (~720s of postgres-live + spa-split
    # + db-flow integration), and it consumes none of setup's OUTPUT: it restores
    # the shared cargo cache by `restore-keys` (Swatinem `shared-key: sky-linux`,
    # `save-if: false`) exactly as every setup-dependent job does. While it waited
    # on setup, the T1 tier was `setup(~270s) + test-sky(~720s) ≈ 990s` — pinned
    # against the ceiling and flapping over it on setup variance. Run alongside
    # setup instead and the tier is `setup + max(OTHER dependent) = setup +
    # config-gates(~520s) ≈ 790s`, while test-sky itself (independent) stays well
    # under the ceiling. Listed in SETUP_INDEPENDENT_JOBS so the budget assertion
    # charges it correctly.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-test-sky-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-test-sky-
      - name: PostgreSQL + sqlite3 for the live tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 sqlite3
          for b in initdb pg_ctl postgres psql; do
            [ -x "/usr/lib/postgresql/16/bin/$b" ] || {
              echo "::error::missing /usr/lib/postgresql/16/bin/$b" >&2; exit 1; }
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Tests — sky crate (postgres-live + db_*_flow integration)
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
          SKY_LIVE_TESTS: require
        run: cargo test -p sky --locked
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── Accept-side parity gates (infer dominates ~13m) ─────────────────────────
  parity-accept:
    needs: setup
    runs-on: ubuntu-latest
    # infer ~13 min (this file's own header) + debug `cargo build --workspace`
    # ~4 min + roundtrip/resolve/divergences/s8 ~3 min ≈ 20 min. 1.5x = 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — roundtrip (reprint == source, L8)
        run: cargo run -q -p xtask -- roundtrip
      - name: Gate — resolve (name-resolution parity)
        run: cargo run -q -p xtask -- resolve
      - name: Gate — infer (type accept-parity, M3)
        run: cargo run -q -p xtask -- infer
      - name: Gate — divergences (known Rust-vs-oracle ledger)
        run: cargo run -q -p xtask -- divergences
      - name: Gate — s8 (forbidden public-surface patterns)
        run: cargo run -q -p xtask -- s8

  # ── Reject-side parity + fmt (reject dominates ~16m) ────────────────────────
  parity-reject:
    needs: setup
    runs-on: ubuntu-latest
    # reject measured 780 s DEBUG (74 s release — this job builds debug, so the
    # debug number is the one that applies) + fmt gate + debug workspace build
    # ≈ 20 min. 1.5x = 30. Drop this to ~12 if the gates ever build --release.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — fmt (sky fmt never drops a comment; idempotent)
        run: cargo run -q -p xtask -- fmt
      - name: Gate — reject (reject-parity)
        run: cargo run -q -p xtask -- reject

  # ── Byte-stable codegen across fresh processes (~15.5m) ─────────────────────
  # repro was the setup-dependent critical path: the config+auth wave added
  # stdlib surface (Sky.Config, the auth modules), which slowed the per-example
  # go build and took the full-corpus repro from ~690s to 790s, pushing the
  # setup→repro chain to 1048s against the 990s T1 ceiling. Sharded across two
  # sibling jobs (--shard=0/2 + --shard=1/2, the same flag macos-determinism
  # uses), each ~half the corpus; the union is asserted disjoint-and-total by
  # `repro_gate::tests::shards_are_disjoint_and_total`, so every example is
  # still covered. Both remain setup-dependent; the chain drops to setup + ~395s.
  repro:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — repro (byte-stable Go across fresh processes, L4, shard 0/2)
        run: cargo run -q -p xtask -- repro --shard=0/2

  repro-2:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — repro (byte-stable Go across fresh processes, L4, shard 1/2)
        run: cargo run -q -p xtask -- repro --shard=1/2

  # ── Codegen emit + go build + runtime (needs Go; cached) ────────────────────
  codegen-build:
    needs: setup
    runs-on: ubuntu-latest
    # The widest step list (coerce-floor, go test rt, build-run --all + 4 --shape
    # passes, an extra --release sky build, conformance, doc-examples). Not
    # separately measured, but bounded above by the audit's finding that test-ty
    # (31 min) is the SLOWEST job, so ≈ 30 min. 1.5x = 45.
    timeout-minutes: 45
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      # Declared partial, and only here. The census needs every project's
      # GENERATED FFI surface to emit, and `sky-ffi/` + `.skydeps/` are
      # .gitignored — so on a fresh checkout five rows (03-tea-external,
      # 05-mux-server, 08-notes-app, 11-fyne-stopwatch, 13-skyshop) cannot be
      # measured. Since 2026-08-16 the gate FAILS on that rather than reporting
      # PASS on the remainder, which is right, and `SKY_LIVE_TESTS=skip` is the
      # escape its own docs name: the run prints a loud itemised UNMEASURED
      # block instead, so the shortfall is a partial someone asked for rather
      # than one nobody noticed.
      #
      # Per-push cannot supply the surfaces: `sky install` for those five means
      # a cold 76k-symbol Stripe regeneration and Fyne's GL/X11 toolchain, which
      # is why the FFI examples live in the nightly sweep. The full 61-of-61
      # census runs THERE, after the sweep has generated all of them —
      # `nightly-sweep.yml`, job `example-sweep`. The per-project ratchets below
      # are unaffected either way; only the corpus-wide totals are.
      - name: Gate — coerce-floor (runtime-coercion floor lock, FAIL-ON-INCREASE)
        env:
          SKY_LIVE_TESTS: skip
        run: cargo run -q -p xtask -- coerce-floor
      - name: Gate — runtime rt tests (go test)
        run: cd ../runtime-go && CGO_ENABLED=0 go test ./rt/...
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── Emit + go build every example (split out of codegen-build) ──────────────
  #
  # 544s of codegen-build's 941s, and the single largest step in the tier after
  # two rounds of optimisation. Making it concurrent helped less here than
  # locally — 3.2x on a 10-core dev box, ~1.35x on a 4-core runner, because
  # `go build` already saturates those cores by itself. Splitting is the lever
  # that still works when parallelism inside a step has run out: the tier is
  # `setup + max(dependent)`, so this leaves the critical path rather than
  # merely shrinking on it.
  #
  # Nothing is dropped — `ci-green` requires this job, so the fan-in cannot pass
  # while every example is not building.
  build-corpus:
    # Deliberately NO `needs: setup`. This job consumes none of setup's output —
    # it runs its own `cargo build --workspace --locked` and restores the shared
    # cargo cache by `restore-keys`, exactly as the setup-dependent jobs do.
    # Waiting 209s for a job whose artifacts it never reads was pure serial
    # delay on the longest job in the graph, so the whole RUN now finishes that
    # much earlier — this is a real wall-clock saving, not a formula trick.
    # It is listed in `SETUP_INDEPENDENT_JOBS` so the budget assertion accounts
    # for it correctly.
    runs-on: ubuntu-latest
    # SHARD 0 of 2. The whole corpus was ~76s workspace build + ~59s cache restore
    # + ~544s build-run + the four runtime gates (~90s WARM) ≈ 13 min — the slowest
    # setup-independent job, and the one whose per-example `go build` variance kept
    # tripping the T1 tier ceiling (measured 844-1034s across runs). Sharded across
    # this job + `build-corpus-2` (the `repro`/`macos-determinism` fan-out pattern),
    # the corpus's dominant `go build` cost is halved onto two runners, so the
    # slowest setup-independent job drops off the critical path. Each shard still
    # runs its OWN workspace build + the runtime gates over ITS half (warm cache),
    # and `build_run_gate`'s `shards_are_disjoint_and_total` proves the two halves
    # union to the whole corpus with no example gated twice or dropped.
    #
    # 12 -> 18: a shard measured 729s (>720s = 12 min) and was KILLED by the
    # timeout, failing ci-green. The fixed per-job costs (workspace build + cache
    # restore + the four runtime gates) do not shard, so a shard is ~600-730s, not
    # the naive half of 844s. 18 restores the ~1.5x margin the whole job had.
    timeout-minutes: 18
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — build-run shard 0/2 (emit + go build; FFI skipped)
        run: cargo run -q -p xtask -- build-run --all --shard=0/2
      # The runtime gates live HERE, with `build-run --all`, and that placement
      # is load-bearing rather than tidy. They re-run the SAME examples, so the
      # `go build` cache the step above just filled is what makes them cheap
      # (splitting them off measured +613s of cold rebuilds to save 544s). They
      # take the SAME `--shard` so each gate covers this shard's half; the union
      # across both jobs is every example.
      - name: Gate — golden (runtime-correctness, CLI subset), shard 0/2
        run: cargo run -q -p xtask -- build-run --shape cli --run --golden --shard=0/2
      - name: Gate — live runtime (Sky.Live start + serve, no panic), shard 0/2
        run: cargo run -q -p xtask -- build-run --shape live --run --shard=0/2
      - name: Gate — http runtime (Sky.Http.Server start + serve), shard 0/2
        run: cargo run -q -p xtask -- build-run --shape http --run --shard=0/2
      - name: Gate — tui runtime (Sky.Tui start + run, no panic), shard 0/2
        run: cargo run -q -p xtask -- build-run --shape tui --run --shard=0/2
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── build-corpus SHARD 1 of 2 (fan-out sibling of build-corpus) ─────────────
  # Byte-identical to build-corpus but `--shard=1/2`. Kept a separate job (not a
  # `matrix`) because `assert-tier-budget.sh` exact-matches job names in
  # SETUP_INDEPENDENT_JOBS, and a matrix leg reports as "build-corpus (1)" (with a
  # space) — the same reason repro/repro-2 + macos-determinism/-2 are separate.
  build-corpus-2:
    runs-on: ubuntu-latest
    # 18, matching build-corpus: a shard is ~600-730s (the fixed costs do not
    # shard), and 12 killed a 729s run.
    timeout-minutes: 18
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — build-run shard 1/2 (emit + go build; FFI skipped)
        run: cargo run -q -p xtask -- build-run --all --shard=1/2
      - name: Gate — golden (runtime-correctness, CLI subset), shard 1/2
        run: cargo run -q -p xtask -- build-run --shape cli --run --golden --shard=1/2
      - name: Gate — live runtime (Sky.Live start + serve, no panic), shard 1/2
        run: cargo run -q -p xtask -- build-run --shape live --run --shard=1/2
      - name: Gate — http runtime (Sky.Http.Server start + serve), shard 1/2
        run: cargo run -q -p xtask -- build-run --shape http --run --shard=1/2
      - name: Gate — tui runtime (Sky.Tui start + run, no panic), shard 1/2
        run: cargo run -q -p xtask -- build-run --shape tui --run --shard=1/2
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── erasure-fuzz: type-check ⟹ go build ⟹ no panic ⟹ CORRECT VALUE ──────────
  #
  # Generates well-typed programs that cross the erasure boundary (a compound
  # value — function / record / ADT / Dict — passed through a polymorphic slot,
  # a codec, an open-row alias) and asserts every one that passes `sky check`
  # also `go build`s, runs without panic, AND prints the value the generator
  # constructed. The value check is the load-bearing half: the 2026-08-29 v1
  # audit found FIVE soundness breaks, and three of them (open-row field-drop,
  # nested-alias overflow, Codec.auto null) compiled and ran WITHOUT a panic —
  # they just returned the wrong data. A build-only gate is blind to that class;
  # this gate is `if it compiles it works`, enforced.
  #
  # Setup-independent (own `cargo build`, restores the shared cargo cache by
  # restore-keys) so it does not sit on setup's critical path — listed in
  # SETUP_INDEPENDENT_JOBS for the tier-budget assertion. `find_sky_bin` knows
  # only `sky-out/sky` and `target/release/sky`; this job builds DEBUG (a
  # release build would double the job), so SKY_BIN points it at the debug
  # binary explicitly.
  erasure-fuzz:
    runs-on: ubuntu-latest
    # ~90s workspace build + ~60s cache restore + the case sweep (each case is a
    # sky build + go build + run; parallel across the runner's cores). Measured
    # ~4-6 min for the sweep warm. 20 leaves the ~1.5x margin the corpus jobs
    # carry, with room for a cold Go cache.
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      SKY_BIN: ${{ github.workspace }}/rust/target/debug/sky
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — erasure-fuzz (type-check ⟹ go build ⟹ no panic ⟹ correct value)
        run: cargo run -q -p xtask -- erasure-fuzz
      # The Std.App `-> any` view render gates (`std_app_flow.rs`) are the SAME
      # erasure-boundary class — a Std.Ui Element / Std.Html document crossing an
      # `any`-erased view slot renders a silently blank page. They build AND run a
      # web app (~40s), so they carry `#[ignore]` to stay OFF test-sky's T1
      # critical path and run HERE, a setup-independent job with headroom. `test-sky`
      # skips them (ignored); this is the one place they execute — keep it.
      - name: Gate — Std.App `-> any` view render (erasure-boundary, ignored on test-sky)
        run: cargo test -p sky --test std_app_flow --locked -- --ignored --exact app_ui_view_annotated_any_rooted_at_layout_renders_not_silently_empty app_web_view_annotated_any_returning_element_renders_not_silently_empty
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── Behavioural stdlib + live docs (split out of codegen-build) ─────────────
  #
  # Both gates need a --release `sky` and neither needs anything else
  # codegen-build produces, so they were pure serial tail on that job: measured
  # 167s (conformance, incl. the release build) + 48s (doc-examples) inside a
  # 1338s job whose length was what put the T1 tier over its ceiling.
  #
  # The tier formula is `setup + max(dependent job)`, so moving independent work
  # into a SIBLING job removes it from the critical path entirely rather than
  # merely making it faster. Nothing is dropped — both gates still run on every
  # push, and `ci-green` requires this job like any other.
  behaviour-docs:
    needs: setup
    runs-on: ubuntu-latest
    # ~81s workspace build + ~167s conformance (incl. the release sky build) +
    # ~48s doc-examples ≈ 5 min. 1.5x ≈ 8, rounded up for runner variance.
    timeout-minutes: 12
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - name: Gate — stdlib behavioral conformance (sky test suites)
        # The behavioral layer the corpus gates + oracle DON'T cover: asserts
        # documented stdlib semantics with adversarial inputs (Store multi-col
        # order, memoised-CAF stale reads, Log attrs, fromJson-ADT, stack safety).
        working-directory: rust
        run: |
          cargo build --release -p sky --locked
          source ../scripts/lib/cargo-target.sh
          SKY_BIN="$(cargo_bin_path "$PWD" sky --release)" ../scripts/conformance.sh
      - name: Gate — live docs (full-module doc examples still compile)
        # Every `module Main …` Sky example in the live docs (docs/, excluding
        # docs/history/) must `sky check` — so a doc example can't silently rot.
        working-directory: rust
        run: |
          source ../scripts/lib/cargo-target.sh
          SKY_BIN="$(cargo_bin_path "$PWD" sky --release)" ../scripts/doc-examples.sh
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── Configuration surface + coverage ratchets ───────────────────────────────
  #
  # THESE RAN ONLY AT RELEASE, AND ONE OF THEM WAS RED ON `main` FOR IT.
  #
  # `config-surface` and `config-matrix` are both `Tier::T1`, and the repo's
  # only `harness --tier t1` invocation is in `release.yml`; `denominators
  # --check` and `coverage-ledger --check` were likewise release-only steps. So
  # a whole class of drift was invisible until a tag was cut.
  #
  # What that cost, live on this branch: `SKY_HTTP_CLIENT_TIMEOUT` was added by
  # `51ae71ee`, one commit AFTER `4a118e39` regenerated the census, and
  # `xtask config-surface --check` was FAILING on a clean tree at HEAD —
  # `STALE — summary.documented_names: 88 -> 89`. The series left its own gate
  # red at merge and nothing noticed, because nothing ran it before a release.
  #
  # COST, measured locally at this commit (warm caches, 8-core M-series):
  #   denominators --check      0.13 s
  #   coverage-ledger --check   0.28 s
  #   config-surface --check    0.28 s
  #   config-matrix (harness)  ~50 s   — 5 `sky build`s + 10 start/observe/kill
  #
  # The first three are free and belong on every PR without argument. The
  # fourth is ~50 s of RUN time but needs a `--release` compiler and a Go
  # toolchain, which is why it gets its own job rather than being bolted onto
  # one that has neither. It is nowhere near `codegen-build`'s ~13 min, so it
  # does not move the tier's critical path.
  #
  # `harness --only config-matrix` rather than `xtask config-matrix --check`:
  # the harness is what enforces the budget by `killpg`, requires the exact
  # assertion count, and refuses to render PASS when it cannot establish a
  # verdict. The plain subcommand has none of that.
  #
  # THE SAME LATENCY, WIDER: the fast T1 COUNTING gates ran only at release too.
  # `harness --tier t1` lives solely in `release.yml`, so `cli-verbs` and the
  # four analytics gates — pure assertion-count checks over `cargo test` /
  # `go test`, no server, no browser — were invisible until a tag was cut. That
  # is the exact latency that let `cli-verbs` sit RED on this branch for a whole
  # cycle (commit `726a5589`). They join this job below.
  #
  # THE SPLIT, and why it is here rather than a blanket `--tier t1`. Measured
  # locally at this commit (warm caches, 8-core M-series):
  #   cli-verbs                              76.8 s  (`cargo test` compile-bound)
  #   analytics-retention-survives-a-panic   20.2 s  (`go test` rt compile)
  #   analytics-prune-errors-are-reported     3.6 s
  #   console-analytics-queries-are-bounded   7.3 s
  #   erasure-path-uses-an-index              4.1 s
  #                                          ~112 s total
  # These are counting/assertion gates and belong on every PR. The rest of T1 —
  # `apps-*`, `sky-suites`, `lsp` — SPIN REAL SERVERS, PTYs and multi-replica
  # topologies (measured in minutes each) and stay at release / their own jobs;
  # a blanket `--tier t1` here would drag those onto the per-PR path. HOLE-1's
  # falsifier-applicability check is already per-PR: it rides inside the
  # `coverage-ledger --check` step below.
  config-gates:
    needs: setup
    runs-on: ubuntu-latest
    # ~60s cache restore + ~90s release `sky` (cache-warm) + ~50s config-matrix
    # + ~112s cli-verbs+analytics + three sub-second checks ≈ 6 min. 1.5x with
    # runner variance ≈ 9; 12 leaves headroom for a cold `cargo test` compile.
    timeout-minutes: 12
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-linux-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      # `config_matrix::sky_binary` establishes that the compiler it measures
      # was built from THIS tree and rebuilds it when it was not. Building it
      # here anyway keeps that rebuild OUT of the gate's budget, and keeps the
      # gate's own `cargo` invocation from nesting inside a `cargo run`.
      - name: Build the compiler the config matrix measures
        working-directory: rust
        run: cargo build --release --locked -p sky
      - name: 'Gate — config-surface (the census is current; no defect count rose)'
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- config-surface --check
      - name: 'Gate — kernel-members (tables are a faithful superset of the runtime)'
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- kernel-members
      - name: Gate — coverage ratchets (denominators + ledger)
        working-directory: rust
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p xtask -- denominators --check
          cargo run --release --locked -q -p xtask -- coverage-ledger --check
      - name: 'Gate — config-matrix (effective values, observed from running binaries)'
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --only config-matrix
      # The fast T1 counting gates, moved off release-only. One harness
      # invocation so a NOT RUN / UNPROVEN in any of them renders the suite
      # UNKNOWN (exit 3) rather than a quiet skip. Server-spinning apps-* /
      # sky-suites / lsp stay out deliberately — see the job header.
      #
      # roundtrip + shared-world join here (v1 B9): both are pure in-process
      # scans (parse / type-check, no sky-out/sky needed) and both are EXACT-count
      # ratchets that previously asserted their count ONLY at tag/nightly — so
      # roundtrip (187) and shared-world (138) drift shipped silently and first
      # surfaced when a human cut a tag (the v0.23.0 attempts). Running the count
      # form per-PR is what makes the tag gate boring. (conformance's count also
      # drifts tier-only, but it needs an installed sky-out/sky to run the suites,
      # so it stays in the nightly/release tier until config-gates installs one.)
      - name: 'Gate — cli-verbs + analytics + roundtrip/shared-world (fast T1 counting gates)'
        working-directory: rust
        run: cargo run --release --locked -q -p xtask -- harness --only cli-verbs,analytics-retention-survives-a-panic,analytics-prune-errors-are-reported,console-analytics-queries-are-bounded,erasure-path-uses-an-index,roundtrip,shared-world
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── Editor-parity (Neovim) + fuzzer (small; isolated setup) ─────────────────
  lsp-fuzz:
    needs: setup
    runs-on: ubuntu-latest
    # "small; isolated setup" per this file's header. Reasoned: nvim setup ~1 min
    # + debug workspace build ~4 min + lsp 49 cases (debug `sky`) ~5.5 min + fuzz
    # ~4 min ≈ 14.5 min. The 32 corpus cases added ~35% to the lsp gate (measured:
    # 17 legacy 144 s + 32 corpus 51 s locally) — they share one LSP session per
    # group, so they cost ~1.6 s each against the legacy ~8.5 s. Ceiling stays 20.
    # lsp-fuzz is not the critical path, so no tier split is needed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-linux
          save-if: 'false'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - run: cargo build --workspace --locked
      - name: 'Gate — lsp (Neovim editor-parity: 17 symbol-class + 32 corpus cases)'
        run: cargo run -q -p xtask -- lsp
      - name: Gate — fuzz (robustness + determinism, L7 + L4)
        run: cargo run -q -p xtask -- fuzz

  # ── The PostgreSQL bundle licence gate, proven able to fail ────────────────
  #
  # scan-bundle-licences.sh is the only thing standing between a GPL-linked
  # object and an Apache-2.0 release artifact, and test-licence-gate.sh is the
  # only evidence it still rejects what it exists to reject.
  #
  # IT LIVES HERE, NOT IN postgres-bundle.yml, AND THAT IS THE WHOLE POINT.
  # It ran there first, on a bare `pull_request:` trigger — so it reported on
  # every PR and could not block one: `ci-green`, the required check, fans in
  # THIS file only. A gate whose red verdict nobody is required to honour has
  # the same shape as a gate that does not run, and this one guards a legal
  # obligation. `rust/crates/xtask/tests/workflows_parse.rs` asserts the
  # property in general; this job is how it is satisfied for the licence gate.
  # postgres-bundle.yml keeps its own copy of the self-test as the precondition
  # of its build matrix, where it gates publication rather than merge.
  #
  # BOTH OSes, because the dependency-enumeration paths are entirely different
  # code — objdump/DT_NEEDED against otool/Mach-O load commands. A gate proven
  # on one is unproven on the other, and the macOS half also carries the one
  # path-sensitive rule in the licence table (Apple's LGPL libiconv is
  # PLATFORM; anyone else's is COPYLEFT).
  #
  # No Rust, no `needs: setup`, no cargo cache: a C compiler, the two scripts,
  # and about a minute. The macOS leg bills at 10x for that minute; the thing
  # it protects is the licence of every artifact this project publishes.
  licence-gate-linux:
    runs-on: ubuntu-latest
    # Compiles ~30 tiny fixture objects and runs the scanner over each; well
    # under a minute observed locally. 5 is a runaway bound, not an estimate.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # A real GNU readline lets the suite include one rejection driven by a
      # genuine GPL library rather than a stub carrying its name. The suite
      # skips that case when readline is absent, so this is fidelity, not a
      # hard dependency — and a skipped case is green, which is why it is
      # installed rather than hoped for.
      - name: Install GNU readline (fidelity fixture)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreadline-dev
      - name: Prove the licence gate rejects what it must
        working-directory: .
        run: bash scripts/skydb/test-licence-gate.sh

  licence-gate-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU readline (fidelity fixture)
        run: brew install readline || true
      - name: Prove the licence gate rejects what it must
        working-directory: .
        run: bash scripts/skydb/test-licence-gate.sh

  # ── Real-Postgres session-store integration (the store prod shops run on) ───
  # The per-push rt tests cover memory/sqlite round-trip + the postgres fail-loud
  # branch; the happy-path postgresStore (Get/Set/Delete/TTL/cross-instance
  # decode) was never tested against a live engine. A `postgres:16` service
  # container + the `integration`-tagged tests close that gap.
  integration-postgres:
    runs-on: ubuntu-latest
    # No Rust build at all: checkout + setup-go + postgres:16 service health-wait
    # + one `go test -run Postgres` over the rt package ≈ 5 min. The apt install
    # of the PostgreSQL binaries and the full `-race` pass over rt add roughly
    # 4 more (race is ~2-3x, and the live supervisor tests now actually run
    # instead of skipping). ≈ 9 min. 1.5x ≈ 14.
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Postgres session-store integration tests
        working-directory: runtime-go
        env:
          SKY_TEST_POSTGRES_DSN: postgres://sky:sky@localhost:5432/sky?sslmode=disable
        run: CGO_ENABLED=0 go test -tags integration ./rt/ -run Postgres -v

      # Two things made a whole defect class unreachable in CI, and it took a
      # local run to find one: a data race between `waitReady` reading
      # `cmd.ProcessState` and `watchChild`'s `Wait()` writing it — also an
      # os/exec contract violation, since ProcessState is invalid until Wait
      # returns. CI could not have caught it, because
      #
      #   1. every Go step here runs CGO_ENABLED=0, and `-race` needs cgo; and
      #   2. the embedded-PostgreSQL supervisor needs real initdb/pg_ctl/postgres
      #      binaries ON THE RUNNER. The service container above is a server on
      #      a port — it puts nothing on PATH — so every live test SKIPPED, and
      #      a skipped test is green.
      #
      # Both are closed below. The binaries also make the live supervisor tests
      # (socket permissions, drain-then-stop ordering, DSN handoff) actually run
      # rather than skip.
      - name: PostgreSQL binaries for the embedded supervisor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          # Fail here, loudly, rather than letting SKY_POSTGRES_BIN point at
          # nothing and every live test skip its way to a green run.
          for b in initdb pg_ctl postgres; do
            [ -x "/usr/lib/postgresql/16/bin/$b" ] || {
              echo "missing /usr/lib/postgresql/16/bin/$b — the live tests would" \
                   "have skipped silently" >&2
              exit 1
            }
          done

      - name: rt tests under the race detector, with a live PostgreSQL
        working-directory: runtime-go
        env:
          SKY_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: CGO_ENABLED=1 go test -race ./rt/... -count=1

  # ── macOS: platform-determinism subset only (the reason for a 2nd OS) ───────
  # Byte-stable codegen (repro) + coerce floor + runtime behaviour must hold on a
  # 2nd platform. Full example builds / parity corpora are platform-agnostic and
  # stay ubuntu-only above, so macOS carries just the determinism invariants.
  macos-determinism:
    runs-on: macos-latest
    # THE 10x-BILLING JOB — a wedged `sky test` inside conformance.sh burned the
    # full 6-hour default here on 2026-08-09, which is why the ceiling is kept
    # deliberately tight.
    #
    # Content is HALF the repro corpus (`--shard=0/2`) + coerce-floor.
    # `repro` was the whole T1 critical path: a runtime-go wave took the full
    # 54-example repro from ~690s to 928s and pushed this job to 1269s against a
    # 990s ceiling. The go-build per example is the cost (emit is ~3% of it), and
    # one 3-core runner bounds go build — so the corpus is fanned across TWO
    # sibling jobs (`macos-determinism` + `macos-determinism-2`), each on its own
    # runner. That halves this job's repro to ~27 examples; the tier budget is
    # `max(setup-independent jobs)`, so a second sibling lowers the tier rather
    # than adding to it. The two per-shard determinism gates are balanced one
    # each — coerce-floor here, golden on `-2` — and each `repro` shard warms the
    # Go cache its co-located gate reuses (job-boundary-is-a-cache-boundary).
    #
    # Projected: ~72s overhead + ~106s cargo build + ~510s repro/2 + ~90s coerce
    # ≈ 780s, comfortably under 990. 1.5x ≈ 20; 30 leaves cold-cache headroom.
    timeout-minutes: 30
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-macos-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-macos
      - run: cargo build --workspace --locked
      - name: Gate — repro (byte-stable Go, 2nd platform, shard 0/2)
        # Half the corpus; `macos-determinism-2` runs `--shard=1/2`. The union
        # of the two shards is the whole corpus and they are disjoint (proven in
        # `repro_gate::tests::shards_are_disjoint_and_total`), so every example
        # is still gated exactly once across the pair.
        run: cargo run -q -p xtask -- repro --shard=0/2
      # Declared partial for the same reason as `codegen-build` above, and more
      # sharply: this runner bills at 10x, so `sky install` over the five FFI
      # examples is the last thing that belongs here. The full 61-of-61 census
      # runs in `nightly-sweep.yml`.
      - name: Gate — coerce-floor (2nd platform)
        env:
          SKY_LIVE_TESTS: skip
        run: cargo run -q -p xtask -- coerce-floor
      # NOTE: the `golden` gate (the other 2nd-platform emit/go-build parity
      # gate) runs on `macos-determinism-2`, not here — the two determinism
      # gates are balanced one-per-shard so neither job binds the tier.
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── macOS determinism, second repro shard ──────────────────────────────────
  #
  # The other half of the `repro` corpus (`--shard=1/2`). Split off because
  # `repro`'s cost is the per-example `go build`, which one 3-core runner bounds;
  # a second runner is the only lever that adds real hardware parallelism, and
  # the tier budget being `max(setup-independent jobs)` means a sibling job
  # LOWERS the tier instead of summing into it. This is the same additive-split
  # pattern `macos-behaviour` used; no existing job was renamed, and the only
  # required check is `ci-green` (it `needs:` both macos jobs), so moving the
  # golden gate here from `macos-determinism` changes nothing about what is
  # enforced — it only balances the two shards' wall-clock.
  #
  # Its own Go cache is warmed from the same `go-macos-` key, restored by
  # `restore-keys`; only `macos-determinism` SAVES it (one writer per key), so
  # this job takes `save-if: false` on the rust-cache too.
  #
  # Projected: ~72s overhead + ~106s cargo build + ~510s repro/2 + ~73s golden
  # ≈ 760s, well under 990.
  macos-determinism-2:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-macos-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-macos
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — repro (byte-stable Go, 2nd platform, shard 1/2)
        run: cargo run -q -p xtask -- repro --shard=1/2
      # Platform parity for the emit + go-build regression class. The #164/#166
      # alias-collision / record-update-field-drop bugs and the int64 divergence
      # were the class a macOS-only codegen/runtime bug could ship green in; the
      # CLI golden set is the only runtime-output-correctness gate. Balanced onto
      # this shard (coerce-floor stays on `macos-determinism`) so the two
      # determinism jobs finish in roughly equal wall-clock. The `repro` shard
      # above warms the Go cache this reuses.
      - name: Gate — golden (runtime-correctness CLI subset, 2nd platform)
        run: cargo run -q -p xtask -- build-run --shape cli --run --golden
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ── ci-green: the fan-in ────────────────────────────────────────────────────
  # ── macOS behaviour half (split out of macos-determinism) ──────────────────
  #
  # `macos-determinism` reached 1092s against a 990s allowance and had been
  # running without headroom for a while — measured 766 / 854 / 904 / 1090 /
  # 1092 across recent pushes, so the green runs were luck rather than margin.
  # What tipped it was attributable, not mystery: `cargo test -p project` went
  # 112s -> 191s when the CAF-lint fix added 7 tests to that crate. Correct
  # tests, landing on the one job with nothing spare.
  #
  # The split follows the grouping the Linux jobs had to learn the hard way: a
  # job boundary is also a CACHE boundary. Everything that emits and `go build`s
  # the EXAMPLES stays together in `macos-determinism` (repro warms the Go cache
  # that `golden` then reuses); this job takes the three steps that build their
  # own things — the runtime's own Go tests, the `project` crate's tests, and
  # conformance, which builds a release `sky` and its own suite projects.
  #
  # Expected ~500s here and ~630s there, both setup-independent, against 990s.
  # Predicted from this run's per-step numbers — the next run is the measurement.
  macos-behaviour:
    runs-on: macos-latest
    # ~115s workspace build + ~61s rt tests + ~191s project tests + ~129s
    # conformance (incl. its release sky build) ~= 8 min. 1.5x = 12; 20 leaves
    # room for the colder Go cache this job now has, since `repro` no longer
    # runs ahead of it. macOS minutes bill at 10x, so this bound is deliberately
    # not generous.
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Cache Go build + module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-macos-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          restore-keys: go-macos-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: sky-macos
          save-if: 'false'
      - run: cargo build --workspace --locked
      - name: Gate — runtime rt tests (go test, 2nd platform)
        run: cd ../runtime-go && CGO_ENABLED=0 go test ./rt/...
      - name: Gate — project integration tests (go build regressions, 2nd platform)
        run: cargo test -p project --locked
      - name: Gate — stdlib behavioral conformance (2nd platform)
        run: |
          cargo build --release -p sky --locked
          source ../scripts/lib/cargo-target.sh
          SKY_BIN="$(cargo_bin_path "$PWD" sky --release)" ../scripts/conformance.sh
      - name: Bound the Go caches before save
        if: always()
        working-directory: .
        run: bash scripts/ci/bound-go-cache.sh

  # ONE check that is true iff every job above succeeded, plus the tier-budget
  # assertion that per-job `timeout-minutes` structurally cannot make (§8.2).
  #
  # THIS IS AN *ADDITIONAL* CHECK. See the two-step rollout note in the file
  # header: no job above was renamed or removed, because branch protection lives
  # in repo settings outside this tree and a required check that stops reporting
  # blocks every open PR forever. Promote this to required only AFTER it has
  # reported green on real runs, and only then drop the others from the required
  # list.
  ci-green:
    needs:
      - setup
      - test-ty
      - test-rest
      - test-sky
      - parity-accept
      - parity-reject
      - repro
      - repro-2
      - codegen-build
      - build-corpus
      - build-corpus-2
      - erasure-fuzz
      - behaviour-docs
      - config-gates
      - lsp-fuzz
      - licence-gate-linux
      - licence-gate-macos
      - integration-postgres
      - macos-determinism
      - macos-determinism-2
      - macos-behaviour
    # `always()` so a FAILED dependency still reaches the assertion below and is
    # reported as a failure here. Without it this job would be SKIPPED when an
    # upstream job failed, and a skipped required check is treated as neutral by
    # branch protection — the exact false-green shape this fan-in exists to stop.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed to read this run's per-job timings via the REST API.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Rendered from the `needs` graph, not from anything a job reported about
      # itself, so a job cannot pass by not running: `skipped` and `cancelled`
      # are failures here, not neutral.
      - name: Assert every upstream job succeeded
        working-directory: .
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key)\t\(.value.result)"'
          bad=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            echo "::error::ci-green: upstream job(s) did not succeed:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "all upstream jobs succeeded"

      - name: Assert the T1 tier budget
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          # These do NOT `needs: setup` — `integration-postgres` builds no Rust
          # at all, `macos-determinism` is a different OS with its own cache a
          # Linux `setup` cannot prime, and `build-corpus` consumes none of
          # setup's OUTPUT (it runs its own `cargo build --workspace`, restoring
          # the shared cargo cache by `restore-keys` like every other job), and
          # the two `licence-gate-*` jobs compile C fixtures and run two shell
          # scripts — no Rust at all.
          # They start alongside `setup`, so charging them its time would
          # overstate the tier.
          #
          # These names are SPACE-SEPARATED and matched whole, so a job whose
          # REST-API name contains a space (a `matrix` leg reports as
          # `name (leg)`) could never match one. That is why the licence gate is
          # two explicitly-named jobs rather than one two-legged matrix.
          SETUP_INDEPENDENT_JOBS: 'integration-postgres macos-determinism macos-determinism-2 macos-behaviour build-corpus build-corpus-2 erasure-fuzz test-sky licence-gate-linux licence-gate-macos'
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > jobs.json
          bash scripts/ci/assert-tier-budget.sh jobs.json
