name: Record ui-showcase snapshot baselines

# Records `examples/26-ui-showcase/snapshots/<platform>/` on a GitHub runner and
# uploads it as an artifact FOR REVIEW. It never commits.
#
# Why it exists: the snapshot baselines are platform-keyed (Chromium renders
# text with the host font stack, so a macOS baseline is 3-8 % different from the
# same DOM on Linux — see examples/26-ui-showcase/snapshots/README.md). The
# nightly `web-runtime` job runs on ubuntu-latest, so the Linux set has to be
# recorded on a Linux runner; there is otherwise no way to produce it from a Mac.
#
# It stops at "upload an artifact" on purpose. Re-recording a baseline is the one
# operation that can turn a real Std.Ui regression green, so it stays a
# deliberate human act: download, eyeball against the current set, then commit.
#
# NOTE: GitHub only offers `workflow_dispatch` for a workflow that exists on the
# DEFAULT branch, so this is dispatchable once it has merged, not from the branch
# that adds it. Until then the same renders come out of `web-runtime`'s
# `web-runtime-evidence` artifact — a run with no baselines for its platform
# writes every render to .skycache/ui-showcase-diffs/ as `<name>-current.png`,
# which is how the first Linux set was recorded.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you re-recording? (appears in the run title)'
        required: true
        type: string

run-name: 'Record ui-showcase baselines — ${{ inputs.reason }}'

jobs:
  record:
    runs-on: ubuntu-latest
    # Build sky (~2 min warm) + build the showcase app + one browser pass.
    timeout-minutes: 25
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache
      GO_CACHE_BUDGET_MB: '6144'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Cache Go build + module cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/.gocache
            ${{ github.workspace }}/.gomodcache
          key: go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
            go-linux-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: sky-gates-linux
          save-if: 'false'
      - name: Install Playwright + its browser
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/scripts/ci/playwright-deps.sh" chromium
          npx playwright install chromium
      - name: Build sky binary
        run: |
          source scripts/lib/cargo-target.sh
          cargo build --release -p sky --locked --manifest-path rust/Cargo.toml
          install_binary "$(cargo_bin_path "$PWD/rust" sky --release)" sky-out/sky
          sky-out/sky --version
      - name: Record baselines
        run: scripts/verify-ui-showcase.sh --update-baseline
      - name: Show what was recorded
        run: |
          echo "platform: $(node -p 'process.platform')"
          ls -la "examples/26-ui-showcase/snapshots/$(node -p 'process.platform')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-showcase-baselines
          path: examples/26-ui-showcase/snapshots/**
          if-no-files-found: error
          retention-days: 14
      - name: Bound the Go caches before save
        if: always()
        run: bash scripts/ci/bound-go-cache.sh
