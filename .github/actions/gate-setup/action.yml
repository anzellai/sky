name: 'Release gate setup'
description: >-
  Shared setup for the parallel release-gate jobs (release.yml): Rust + Go
  toolchains, a WARM Go build+module cache and cargo cache, an optional runner
  disk reclaim, and the compiler install (scripts/build.sh -> sky-out/sky).
  Factored out of the former single `gate` job so each of the fanned-out gate
  jobs defines its setup once. The behaviour matches that job's setup steps.

  NOTE ON CHECKOUT: a local composite action can only be referenced AFTER the
  repository is on disk, so `actions/checkout` cannot live here — it stays as
  the first step of each caller job, immediately before `uses:
  ./.github/actions/gate-setup`.

inputs:
  install-compiler:
    description: >-
      Run scripts/build.sh to install the compiler at sky-out/sky. Every gate
      job needs it (build-run, the harness gates, and the sweep all drive
      sky-out/sky).
    required: false
    default: 'true'
  postgres:
    description: >-
      Resolve PostgreSQL (scripts/ci/resolve-postgres.sh: the image's own, or
      the distribution default, whatever its major) and make sure sqlite3 +
      brotli are present, for the live tests. The workspace live tests, the T3
      app tier, and the T1 falsifiers need a real PostgreSQL; the resolver
      exports SKY_POSTGRES_BIN (and SKY_PG_MAJOR) to every later step. The sky crate's
      precompress tests need the brotli tool (live_gate Need::Brotli).
    required: false
    default: 'false'
  neovim:
    description: >-
      Install Neovim for the `lsp` harness gate, a DECLARED dependency of a T1
      gate. Without it that gate reports 0 assertions and the harness fails.
    required: false
    default: 'false'
  free-disk:
    description: >-
      Make sure the job starts with room for the accumulated Go build output:
      when / has under 80 GB free, remove preinstalled toolchains this gate
      never uses, within a 180 s budget (scripts/ci/reclaim-runner-disk.sh).
      UNUSED tooling only — NOT a `go clean -cache`, which would throw away
      the warm cache this setup exists to keep.
    required: false
    default: 'true'
  go-cache-family:
    description: >-
      The Go cache family this job restores: `go-linux` (the default, written
      by rust-ci on main) or `go-sweep` (the FFI module cache the nightly
      example sweep writes on main; it falls back to go-linux). A release
      never runs on main, so it only restores.
    required: false
    default: 'go-linux'

runs:
  using: 'composite'
  steps:
    # UNUSED preinstalled toolchains, reclaimed only when the runner starts
    # short of space, and inside a fixed budget. This is NOT the
    # cache-throwing `go clean -cache` the old single gate ran mid-run. The
    # unconditional `rm -rf` + `docker image prune` that used to sit here took
    # a median 116 s per job and once 898 s, which cancelled a 30-minute job
    # (run 37752520304); runners start with 86 GB free, which the nightly's
    # heaviest jobs prove is enough. scripts/ci/reclaim-runner-disk.sh carries
    # the measurements and never fails the job.
    - name: Free up runner disk space (only when short)
      if: inputs.free-disk == 'true'
      shell: bash
      run: bash scripts/ci/reclaim-runner-disk.sh

    - uses: dtolnay/rust-toolchain@stable

    # Pin the Go toolchain (the same reason the build job does): the gates shell
    # out to a real `go build`, and an unpinned toolchain silently tests
    # whatever Go the runner image ships. cache:false — the Go cache is managed
    # explicitly below so the BUILD cache (not just the module cache) is warm.
    - uses: actions/setup-go@v7
      id: setup-go
      with:
        go-version: '1.26'
        cache: false

    # Point GOCACHE / GOMODCACHE at workspace dirs and keep them warm across
    # releases. Writing to $GITHUB_ENV propagates these to every later step in
    # the CALLER job, so build.sh, the harness gates, and the sweep all use the
    # cached dirs.
    - name: Route the Go caches to workspace dirs
      shell: bash
      run: |
        echo "GOCACHE=${{ github.workspace }}/.gocache"     >> "$GITHUB_ENV"
        echo "GOMODCACHE=${{ github.workspace }}/.gomodcache" >> "$GITHUB_ENV"

    # WARMTH, RESTORE ONLY. Caches are saved on refs/heads/main alone (rust-ci
    # and the nightly write them); a release runs on a tag or a dispatched
    # branch, so it restores them and saves nothing. When every branch and tag
    # saved its own family (go-release-<job>, ~25 entries), they filled the
    # 10 GB repository budget and evicted main's entries, and every run started
    # cache-cold. The key ends with the Go version (a build cache is useless across Go
    # versions); the go.sum-hash prefix still restores the module cache.
    - name: Restore the Go build + module cache (saved on main only)
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ github.workspace }}/.gocache
          ${{ github.workspace }}/.gomodcache
        key: ${{ inputs.go-cache-family }}-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}-${{ steps.setup-go.outputs.go-version }}
        restore-keys: |
          ${{ inputs.go-cache-family }}-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          go-linux-${{ hashFiles('runtime-go/go.sum', 'runtime-go/go.mod') }}
          ${{ inputs.go-cache-family }}-
          go-linux-

    # The release-profile cargo cache the nightly writes on main
    # (nightly-sweep.yml example-sweep, shared-key sky-gates-linux). Restore only.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
        shared-key: sky-gates-linux
        save-if: 'false'

    # Neovim is a DECLARED dependency of the `lsp` harness gate (T1). Without it
    # that gate reports 0 assertions and the harness fails — a gate that cannot
    # run has not passed.
    #
    # TMPDIR: extract on the same filesystem as $HOME. Ubuntu 26.04 mounts /tmp
    # as tmpfs, and the action's rename from os.tmpdir() into $HOME then fails
    # with EXDEV ("cross-device link not permitted").
    - name: Neovim for the lsp harness gate
      if: inputs.neovim == 'true'
      uses: rhysd/action-setup-vim@v1
      env:
        TMPDIR: ${{ runner.temp }}
      with:
        neovim: true

    # A real PostgreSQL for the live tests (workspace live tests, the T3 app
    # tier, the T1 falsifiers). Without one they used to return and report `ok`
    # — a release gate is the last place that should count tests that did not
    # run.
    - name: PostgreSQL + sqlite3 + brotli for the live tests
      if: inputs.postgres == 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/scripts/ci/resolve-postgres.sh"
        bash "$GITHUB_WORKSPACE/scripts/ci/ensure-tools.sh" sqlite3 brotli

    # `scripts/build.sh` installs the compiler at `sky-out/sky` — the binary
    # BOTH the codegen build+run sweep and the app-driving harness gates need,
    # and it MUST run before either. It is here (before every gate step) rather
    # than mid-job so the ordering the v0.23.0 publish got wrong cannot recur.
    - name: Install the compiler the gates drive
      if: inputs.install-compiler == 'true'
      shell: bash
      run: bash scripts/build.sh
