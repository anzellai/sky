[[repro]]
file          = "ambiguous-exposing-all/"
issue         = "sky/ambiguous-unqualified-name-across-exposing-all (found by Family S, 2026-08-11)"
stratum       = "stdlib_import"
coordinate    = { import_shape = "exposing_all", shadow = "ambiguous_exposing_all" }
expect        = "reject"
expect_stdout = ""
summary       = "FIXED 2026-08-11: two modules both `exposing (..)` the same name used to resolve to the LAST import, silently — the program compiled clean and its value depended on import ORDER. Now rejected [E1012] at the use site via the unqualified-name precedence lattice (ambient < open < explicit < local), which keeps the autoloaded Prelude from colliding with explicit imports. A directory rather than one file, because the pair of import orderings IS the reproduction."

[[repro]]
file          = "cross-module-union-conflation/"
issue         = "sky/cross-module-union-conflation (found 2026-08-12 while extending [E1012] to the type namespace)"
stratum       = "nominal_identity"
coordinate    = { declaration = "union", modules = "two", reference = "fully_qualified" }
expect        = "reject"
expect_stdout = ""
summary       = "FIXED 2026-08-12: two same-named unions in two modules were ONE type to the checker. `ty::sig::rewrite_alias_refs` module-qualified `DefKind::TypeAlias` only (the #164 fix), so every union collapsed to its bare final segment and `unify.rs` compared `Ty::App` names as plain strings — while `lower` emitted two DISTINCT Go interfaces and bridged them with `rt.Coerce`, which SUCCEEDS because both interfaces carry the same method set. `sky check` clean, `go build` clean, `sky.Unreachable(case)` at runtime. Now rejected [E2001] `type mismatch: Conflate.Beta.Shape vs Conflate.Alpha.Shape`, because union identity is module-qualified through `ty::nominal`. A directory rather than one file, because two modules ARE the reproduction — and every reference here is fully qualified, so no use-site ambiguity rule ([E1012] in any namespace) could reach it."

