# Pinned historical repros — the coordinates the generator expands around.
#
# Every file listed here is HAND-WRITTEN and CHECKED IN. None of it is generator
# output, and that is deliberate: a generator edit must never be able to
# renumber, reword, or silently drop the reproduction of a shipped defect. The
# generator reads these coordinates and produces their **distance-1
# neighbourhood** — every assignment differing in exactly one axis — because, as
# the mandate puts it, "the bug was never unique, only the combination was".
#
# `expect_stdout` is the value the AUTHOR chose, never a blessed capture. This is
# the lesson of #173: `35-composite-generics`' golden froze the zeroed
# aggregation and was blessed because rust == oracle (commit 7425fd00). Both
# sides agreeing is not evidence when both sides are wrong.
#
# A repro whose `expect_stdout` stops matching is a REGRESSION, not a golden to
# re-bless.

