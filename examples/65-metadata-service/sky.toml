name = "metadata-service"
version = "0.1.0"
entry = "src/Main.sky"

[source]
root = "src"

# A stateless JSON metadata service, read-backed by Std.Db. This is the shape
# of the internal "core-metadata" trial workload: no Sky.Live, no SSE, no
# sessions — just HTTP → SQL read → JSON.
#
# The example SHIPS on SQLite (in-process, single-file, zero external setup) so
# it runs anywhere — including CI's build-run gate, which starts the bare
# `./app` binary with no `sky run`, no cluster, and no DSN. Because `Std.Db` is
# dialect-safe, the exact same app code runs against embedded PostgreSQL (the
# production tier) with a one-line config swap (`embedded = true`); that is the
# configuration the load baseline in
# docs/perf/http-metadata-service-capacity.md was measured on.
[database]
driver = "sqlite"
path = "metadata.db"
