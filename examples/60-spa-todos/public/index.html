<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sky.Spa Todos</title>
  </head>
  <body>
    <!-- The Sky.Spa client mounts its whole UI into #app. Everything below is
         painted by the wasm TEA loop; there is no server-rendered markup.
         boot.js is a file, not an inline script, so a strict
         Content-Security-Policy (script-src 'self' 'wasm-unsafe-eval') runs it. -->
    <div id="app"></div>
    <script src="/wasm_exec.js"></script>
    <script src="/boot.js"></script>
  </body>
</html>
