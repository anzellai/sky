name = "notes-app"
version = "0.1.0"
entry = "src/Main.sky"
port = 8000

[source]
root = "src"

[database]
driver = "sqlite"
path = "skynotes.db"

# No `[auth]` block. This app does its own session handling — `Lib/Auth.sky`
# generates an opaque token and stores it in a `sessions` table — so it reads
# neither a signing secret nor a TTL from configuration.
#
# There used to be one here (`method` / `secret` / `session_ttl` /
# `email_verification`). Not one of those four is a key Sky reads: `method` and
# `email_verification` are not keys at all, `secret` is env-only by design, and
# the real TTL key is `tokenTtl`. The compiler now WARNS on keys like these
# instead of dropping them silently, which is how they were found.
#
# NOTE for anyone copying this example: sessions here never expire — nothing
# checks `created_at` on lookup. The `session_ttl = "24h"` that used to sit in
# this file described behaviour the code does not implement.

["go.dependencies"]
"net/http" = "latest"
"github.com/gorilla/mux" = "latest"
"crypto/sha256" = "latest"
"encoding/hex" = "latest"
"github.com/google/uuid" = "latest"
"io" = "latest"
"os" = "latest"
