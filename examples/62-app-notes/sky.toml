name = "app-notes"
version = "0.1.0"
entry = "src/Main.sky"

[source]
root = "src"

# SQLite by default — a single-file store that embeds, zero ops (the pinned
# tier-1 default). This is the AUTO-SPLIT INPUT project; `sky spa-split` derives
# the native backend (which owns this DB) and the wasm frontend from it.
[database]
driver = "sqlite"
# A default single-file path so the app runs self-contained via `sky run` (the
# web/Live build). The auto-split backend (see README) overrides this with an
# explicit SKY_DB_PATH, which always wins — so both execution modes work.
path = "notes.db"
