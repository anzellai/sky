name = "fieldbook"
version = "0.1.0"
entry = "src/Main.sky"

[source]
root = "src"

[live]
# NOTE: no `port` key here on purpose. The bind port is resolved at
# runtime from the PORT environment variable (see Main.sky `livePort`)
# and applied with `Live.withPort`. A literal in this file would be a
# hardcoded bind port, which the Layer-2 corpus forbids.
store = "memory"
