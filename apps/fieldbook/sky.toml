# NOTE: the Sky.Live session store lives in `src/Main.sky` now, on the
# `Std.App` value: `|> App.withConfig (App.WebConfig { App.webDefaults |
# port = livePort, store = Just "memory" })`. There is deliberately NO port
# literal — `livePort` resolves the bind port from the PORT environment
# variable at runtime (a literal here would be a hardcoded bind port, which
# the Layer-2 corpus forbids).
