[workspace]
resolver = "2"
members = [
    "crates/base",
    "crates/diagnostics",
    "crates/syntax",
    "crates/hir",
    "crates/ty",
    "crates/skydb",
    "crates/lower",
    "crates/codegen",
    "crates/ffi",
    "crates/project",
    "crates/fmt",
    "crates/testrunner",
    "crates/sky",
    "crates/sky-lsp",
    "crates/xtask",
]

# Shared external dependency pins. Individual crates opt in via
# `<dep>.workspace = true`. Versions chosen from crates.io HEAD at M0
# (2026-07) and de-risked by the salsa 0.28 probe (see M0 report).
[workspace.dependencies]
# base — interning, ids, arenas (doc 02)
la-arena = "0.3"
smol_str = "0.3"
indexmap = "2"
# diagnostics — Elm-style rendering (doc 02, L7)
annotate-snippets = "0.12"
# syntax — lossless CST + lexer (doc 02, L8)
rowan = "0.16"
logos = "0.16"
# skydb — the salsa query engine (doc 01, L1/L2)
salsa = "0.28"
# ffi — pinned .skyi surface (de)serialisation (doc 09)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ffi — compile-time embedding of the stdlib + runtime + inspector asset trees
# so the `sky` binary is standalone (doc 09 §E). `include_dir!` recurses
# natively (no `embedDir` non-recursion scar) and a `build.rs` rerun-if-changed
# kills the 89-marker staleness hack.
include_dir = "0.7"
# sky-lsp — async LSP scaffolding (doc 10)
tower-lsp = "0.20"

[workspace.lints.clippy]
all = "warn"

[profile.release]
# Deterministic, debuggable release builds for the reproducibility gate (L4).
debug = 1

[profile.dev]
# The compiler is compute-bound: every gate (`reject`, `infer`, `repro`, the
# `ty` corpus tests) is dominated by type-checking work, and an unoptimised
# build of a compiler is pathologically slow at it.
#
# `opt-level = 2` — NOT `--release` — because it is the only option that keeps
# `debug-assertions` and `overflow-checks` ON. Those are worth keeping in a
# compiler: an integer overflow in an arena index or a span offset is a real
# bug class, and `--release` silently wraps it. Sprinkling `--release` through
# the CI gates would have bought the same speed by DISABLING those checks, and
# would have kept the local-release / CI-debug divergence where a gate's verdict
# depended on which profile it happened to be built with.
#
# One setting covers CI, the local preflight, and a plain `cargo test`, so all
# three now run the same code with the same checks enabled.
opt-level = 2
