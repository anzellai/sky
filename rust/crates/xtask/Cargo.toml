[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

# Dev-automation crate (doc 02). Orchestrates the workspace from the outside
# (differential-test vs the Haskell oracle, reproducibility gate — docs 11, 12).
# `roundtrip` parses the corpus in-process, so it depends on `syntax` + `base`.
[dependencies]
syntax = { path = "../syntax" }
base = { path = "../base" }
fmt = { path = "../fmt" }
hir = { path = "../hir" }
ty = { path = "../ty" }
lower = { path = "../lower" }
project = { path = "../project" }
diagnostics = { path = "../diagnostics" }
serde_json.workspace = true

# `xtask harness` runs every gate body in its own PROCESS GROUP and enforces the
# gate's budget by `killpg` — a thread's children are unreachable as a group, so
# a timeout that only kills the direct child leaks the `go build`, the server and
# the PTY into the next gate (docs/ci-test-architecture-v2.md §7.3). `nix` gives
# a safe `killpg`; the alternative is raw `libc` behind `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Test-only. `tests/workflows_parse.rs` asserts every `.github/workflows/*.yml`
# is parseable — the check whose absence let an unparseable `rust-ci.yml` reach
# `main`, where GitHub refused the file and ran NO jobs at all. `xtask ci-scan`
# reads those files line-by-line and cannot see a malformed document.
[dev-dependencies]
serde_yaml = "0.9"
