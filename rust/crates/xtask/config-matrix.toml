# config-matrix.toml — the dual-path fixture matrix, declared.
#
# `docs/tooling/config-architecture.md` §7.2 asks for a gate that proves every
# setting's EFFECTIVE VALUE is preserved when a setting moves. §12.2 says it
# "must exist before the first default is written". This file is that gate's
# specification; `docs/coverage/config-matrix.json` is what it observed.
#
# ## What a cell is
#
# A cell is one (setting, arm-combination) pair, where an arm is a layer that
# can supply a value: the environment, `sky.toml`, or a `withX` builder. A
# setting with three layers has 2^3 = 8 cells; one with two layers has 4.
#
# The value in a cell is **observed from a running binary** — the fixture is
# compiled by the real compiler, launched, and its own startup output read. It
# is never computed by re-implementing the resolver. That distinction is the
# whole point: this repository's dominant gate defect is proving two functions
# agree while the value that reaches the runtime comes from a third place, and
# a matrix built on a re-implementation would be exactly that defect wearing
# the uniform of its own cure.
#
# ## Why the sentinels must differ
#
# Every arm of a setting sets a DIFFERENT value. If two arms shared one, the
# cell could not say which layer won — it would compare a constant to itself
# and report `ok`. `set_env` / `set_toml` / `set_builder` are checked pairwise
# distinct before anything is built, and a collision is a hard failure with
# that sentence in the message.
#
# ## `builder_reaches_runtime`
#
# The declared answer to "does this builder's value reach the runtime, or is
# the builder ignored?", VERIFIED against the builder-only cell on every run.
# `live.ttl` declares `false` and that is not an oversight — it is §1.8's dead
# `Live.withTtl`, recorded as a measured fact rather than an assertion in
# prose. Flipping a declaration the observation contradicts is a failure in
# either direction: claiming a live builder is dead hides a regression just as
# well as the reverse.
#
# ## Buckets
#
# Every `sky.toml` key the compiler accepts and every env suffix it seeds —
# the census `docs/coverage/config-surface.json` maintains — must appear in
# exactly one of `[[setting]]`, `[[deferred]]` or `[[unobservable]]`. A census
# entry in none of them fails the gate, so the matrix cannot silently stop
# covering a setting, and a NEW setting cannot be added without someone
# writing down which bucket it is in and why.

# ---------------------------------------------------------------------------
# Harness constants — held fixed across every cell, and declared because a
# value the harness pins is a value the matrix is NOT measuring.
# ---------------------------------------------------------------------------

[[harness_constant]]
env    = "LIVE_STORE"
value  = "sqlite"
reason = "`live.storePath` is only printed by a store that HAS a path — `selectStore` (live_store.go:1828) renders the memory store as `memory (ttl=…)` with no `@ path`. Pinning the kind is what lets the path axis vary alone. It also pins the store OUT of the matrix; see the `live.store` entry under [[deferred]]."

# ---------------------------------------------------------------------------
# Covered settings
# ---------------------------------------------------------------------------

[[setting]]
id            = "live.port"
census        = ["live.port"]
toml_section  = "live"
toml_key      = "port"
env_suffix    = "LIVE_PORT"
builder       = "Live.withPort"
builder_kind  = "int"
probe         = "listening"
expect_unset  = "8000"
set_env       = "19811"
set_toml      = "19812"
set_builder   = "19813"
builder_reaches_runtime = true
note = "The FIXED counterpart to live.ttl. `resolveLivePort` (live.go:3849-3874) uses `isSeededDefault` to tell an operator's env from the one the prologue seeded, so the builder can win against a seeded default. That fix is why this row reads `true` and live.ttl's reads `false`, and having both in one table is how the difference stays legible."

[[setting]]
id            = "live.ttl"
census        = ["live.ttl", "LIVE_TTL"]
toml_section  = "live"
toml_key      = "ttl"
env_suffix    = "LIVE_TTL"
builder       = "Live.withTtl"
builder_kind  = "string"
probe         = "store_banner"
probe_key     = "sqlite"
field_after   = "ttl="
field_until   = ",)"
expect_unset  = "30m0s"
set_env       = "37m"
set_toml      = "38m"
set_builder   = "41m"
builder_reaches_runtime = false
note = "THE case. `lower.rs:822` emits `rt.SetSkyDefault(\"LIVE_TTL\", \"1800\")` unconditionally into every program, `SetSkyDefault` is set-if-unset, and `parseTTL` (live_store.go:307-325) takes the first parseable of [env, toml] — so the builder's value in argument two is unreachable. Measured, not reasoned: the builder-only cell sets `41m` and observes `30m0s`. Under §7.3's rule (`preserve the effective value, fix the precedence`) stage 3 flips this to `true`; the observed cells move with it, and both need a [[default-changed]] row in the same commit."

[[setting]]
id            = "live.storePath"
census        = ["live.storePath", "LIVE_STORE_PATH"]
toml_section  = "live"
toml_key      = "storePath"
env_suffix    = "LIVE_STORE_PATH"
builder       = "Live.withStorePath"
builder_kind  = "string"
probe         = "store_banner"
probe_key     = "sqlite"
field_after   = "@ "
field_until   = " "
expect_unset  = "sky_sessions.db"
set_env       = "cfgmx_env.db"
set_toml      = "cfgmx_toml.db"
set_builder   = "cfgmx_builder.db"
builder_reaches_runtime = true
note = "Carries `selectStore`'s `if x == \"\" { x = skyGetenv(…) }` shape (live_store.go:1753-1759) — config first, env only when the field is empty, the OPPOSITE order to live.ttl one module away. It is the only member of that shape with three values that can be selected without a live server, which is why it stands in for `live.store` (see [[deferred]])."

[[setting]]
id            = "live.idleEvict"
census        = []
env_suffix    = "LIVE_IDLE_EVICT"
builder       = "Live.withIdleEvict"
builder_kind  = "string"
probe         = "store_banner"
probe_key     = "sqlite"
field_after   = "idleEvict="
field_until   = ",)"
expect_unset  = "5m0s"
set_env       = "6m"
set_builder   = "11m"
builder_reaches_runtime = true
note = "In NEITHER census list — no `sky.toml` key accepts it and the prologue seeds no suffix for it, so it is env-and-builder only and `config-surface` cannot see it at all. It is in the matrix because §1.8 names it alongside `withTtl` as sharing `parseTTL`'s env-first order, and it is the control that shows the order is not the cause: same helper, live builder, because nothing seeds `LIVE_IDLE_EVICT`."

# ---------------------------------------------------------------------------
# The `[env] prefix` check — two cells, run against their own fixture.
#
# `[env] prefix` is R4: it shapes the NAMES of every other setting here, so a
# stage-3 mistake in it would invalidate every cell above while each of them
# still passed. The check is deliberately not a [[setting]] — its arms are not
# values but namespaces, so it does not fit the cell model.
# ---------------------------------------------------------------------------

[[prefix_check]]
prefix        = "CFGMX_"
census        = ["env.prefix"]
probe         = "listening"
wrong_env     = "SKY_LIVE_PORT"
wrong_value   = "19821"
right_env     = "CFGMX_LIVE_PORT"
right_value   = "19822"
expect_wrong  = "8000"
expect_right  = "19822"
note = "Under `prefix = \"CFGMX_\"` the default-namespace name must be INERT (the app falls to its 8000 default) and the prefixed one must win. Both halves matter: a prefix that renamed nothing would pass a test that only checked the prefixed name works."

# ---------------------------------------------------------------------------
# Deferred — observable in principle, no cells yet.
#
# `deferred_settings` in the JSON summary is RATCHETED: it may fall, never
# rise. Adding a setting to this bucket instead of covering it is therefore a
# decision someone has to authorise, not a default.
# ---------------------------------------------------------------------------

[[deferred]]
ids    = ["live.store", "LIVE_STORE"]
reason = "Three pairwise-distinct arm values are required for a cell to tell which layer won, and only `memory` and `sqlite` can be selected without a live server: `postgres` and `redis` reach `storeFatalf` (live_store.go:1705) and the app never starts. Two safe values cannot fill three arms. `live.storePath` carries the same `selectStore` config-first branch and IS covered; what stays unmeasured is the `kind` branch specifically. Closing it needs the Postgres-gated fixture in the row below."
needs  = "a `live_gate::required(Need::Postgres, …)` fixture"

[[deferred]]
ids    = ["database.path", "database.url", "database.driver", "database.embedded", "database.isolation", "database.txRetry", "database.maxOpenConns", "database.maxIdleConns", "database.connMaxLifetime", "database.connMaxIdleTime", "DB_PATH", "DB_ISOLATION", "DB_TX_RETRY", "DB_MAX_OPEN_CONNS", "DB_MAX_IDLE_CONNS", "DB_CONN_MAX_LIFETIME", "DB_CONN_MAX_IDLE_TIME"]
reason = "The effective value of a pool or isolation setting is only observable from a connected database — the fixture would have to open one and report what it opened. The Sky.Live fixture here deliberately has no `Std.Db` dependency, because a database that fails to start would turn every unrelated cell red. `database.maxOpenConns` additionally has a PRE-BINARY reader (`resolve_max_open_conns`, db_pool_sizing.rs:143, on `sky db start`); see the note on pre-binary coverage in the module doc of `config_matrix.rs`."
needs  = "a Postgres-gated Std.Db fixture that reports its applied pool settings"

[[deferred]]
ids    = ["log.level", "log.format", "LOG_LEVEL", "LOG_FORMAT"]
reason = "Observable — they change the shape of a `Std.Log` line — but the fixture logs nothing, and making it log adds a second probe whose parsing is coupled to the log format under test. Worth doing; not needed to protect the settings stage 3 moves first. Note these are §4.3.1's `look like R5 and are not`: captured at package init (rt.go:1205-1207) and REPAIRED by a hook, so they can move."
needs  = "a fixture that emits one `Std.Log` line per level"

[[deferred]]
ids    = ["security.csrf", "CSRF"]
reason = "Observable as the presence and attributes of the CSRF cookie on an HTTP response, which needs an HTTP probe rather than a startup line. `csrf_middleware.go:110` registers the env-prefix repair hook that makes it movable, and `csrf_middleware.go:82` reads `LIVE_TTL` with a 30-DAY default against live.go's 30 minutes — the §1.7 collision. That second fact is why this row is a priority once the HTTP probe exists."
needs  = "an HTTP probe of the fixture's cookie jar"

[[deferred]]
ids    = ["live.static", "live.input", "live.maxBodyBytes", "LIVE_STATIC_DIR", "LIVE_INPUT_MODE", "LIVE_MAX_BODY_BYTES"]
reason = "Each is observable only through request behaviour — what a static path serves, how an input event is dispatched, what body size is refused — so all three need the same HTTP probe as `security.csrf` and land with it."
needs  = "an HTTP probe of the fixture's request path"

[[deferred]]
ids    = ["jobs.store", "jobs.storePath", "jobs.store_path", "JOBS_STORE", "JOBS_STORE_PATH"]
reason = "Needs a `Std.Jobs` fixture. `jobsBoot` (jobs_kernel.go:86) is lazy and guarded, so nothing is applied until `enqueue`/`define` runs — the fixture must actually enqueue to make the setting take effect, and a fixture that only imports the module would observe the default and call it covered. Note `jobs.store_path` and `jobs.storePath` are BOTH accepted, which is a spelling the matrix should pin once it covers them."
needs  = "a Std.Jobs fixture that enqueues one job"

[[deferred]]
ids    = ["analytics.dbPath", "analytics.retention", "ANALYTICS_DB_PATH", "ANALYTICS_RETENTION"]
reason = "Observable as the path of the analytics database the runtime opens and the retention it applies, which requires the fixture to emit an event; without one the subsystem never opens anything."
needs  = "a fixture that emits one analytics event"

[[deferred]]
ids    = ["database.postgresVersion"]
reason = "Pre-binary and compile-affecting (R2): it pins which bundle `sky db provision --embed` resolves. Its effective value is observable as the resolved bundle, and no `postgres-bundle-v*` tag has been cut — the resolver 404s — so there is nothing to observe today. Covering it means a local-bundle fixture."
needs  = "a published postgres bundle, or a local-bundle fixture"

# ---------------------------------------------------------------------------
# Unobservable — there is no effective value to compare.
# ---------------------------------------------------------------------------

[[unobservable]]
ids    = ["auth.cookieName", "auth.driver", "auth.tokenTtl", "AUTH_COOKIE", "AUTH_DRIVER", "AUTH_TOKEN_TTL"]
reason = "NOTHING READS THEM. `lower.rs:823-825` seeds all three into every program's prologue and `config-surface` counts them as `seeded_without_reader = 3` — §1.11's write-only `[auth]` block, parsed, validated, emitted and ignored for four minor versions. A cell cannot compare an effective value where no consumer produces one, and inventing an observation would manufacture the appearance of coverage over a setting that does nothing. When stage 3 gives them a reader they move to [[setting]] and this bucket shrinks."

# ---------------------------------------------------------------------------
# Listed differences — the ONLY way an observed value may change.
#
# Empty today, and that is the correct state for a stage that moves nothing.
# The parser requires all five fields on every stanza, so an empty stanza
# cannot buy a free change.
#
#   [[default-changed]]
#   cell   = "live.ttl/builder"      # setting id + arm combination
#   from   = "30m0s"
#   to     = "41m0s"
#   reason = "…"
#   commit = "…"
#
#   [[moved]]   — same five fields; for a setting that changed LAYER rather
#                 than value, where the observed value must NOT move.
# ---------------------------------------------------------------------------
