[package]
name = "project"
version.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde_json.workspace = true
serde_yaml = "0.9"
skydb = { path = "../skydb" }
lower = { path = "../lower" }
hir = { path = "../hir" }
ty = { path = "../ty" }
diagnostics = { path = "../diagnostics" }
syntax = { path = "../syntax" }
base = { path = "../base" }
ffi = { path = "../ffi" }

[target.'cfg(unix)'.dependencies]
# `getrusage` for the peak-RSS column of the `--timings` report.
nix = { version = "0.29", features = ["resource"] }
# `wait4`: the peak resident set of ONE waited-for `go build` (memory.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `GlobalMemoryStatusEx`: the available memory that sizes `go build -p`.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
