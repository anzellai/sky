[package]
name = "sky"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "sky"
path = "src/main.rs"

[dependencies]
project = { path = "../project" }
fmt = { path = "../fmt" }
testrunner = { path = "../testrunner" }
sky-lsp = { path = "../sky-lsp" }
notify = "8"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `db_cluster_flow` reads back ~/.sky/clusters.json to assert what `sky db start`
# recorded. The crate has no lib target, so an integration test cannot reach the
# `serde_json` in [dependencies].
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe SIGTERM wrapper for `sky watch --kill-timeout` graceful shutdown — the
# crate forbids `unsafe`, so we use nix's safe `kill` rather than raw `libc`.
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(unix)'.dev-dependencies]
# The live cluster tests take down a spawned `sky run` / `sky watch` by process
# GROUP. They used to do it by spawning the `kill` BINARY, which is procps on
# Linux and BSD kill on macOS, need not be installed at all, and whose spawn
# error was discarded — leaving an unbounded `wait()` on a process that had
# never been signalled. Same signal, sent directly. (An integration test cannot
# reach the crate's own [dependencies]: `sky` has no lib target.)
nix = { version = "0.29", features = ["signal"] }
